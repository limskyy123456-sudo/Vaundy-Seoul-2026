<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VAUNDY ASIA ARENA TOUR 2026 "HORO" — SEOUL 응원가이드</title>
<meta name="description" content="VAUNDY ASIA ARENA TOUR 2026 &quot;HORO&quot; 서울 공연 응원 가이드 — 곡별 가사와 떼창·박수·손 흔들기 포인트">
<meta name="theme-color" content="#2a0a06">

<!-- 홈 화면 설치(PWA) -->
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="응원가이드">

<!-- 링크 공유용 -->
<meta property="og:type" content="website">
<meta property="og:title" content="VAUNDY &quot;HORO&quot; SEOUL 응원가이드">
<meta property="og:description" content="곡별 가사와 떼창·박수·손 흔들기 포인트를 영상에 맞춰 확인하세요">
<meta property="og:image" content="./icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Anton&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#230805;
    --bg-mid:#7a2712;
    --bg-glow:#c8462a;
    --ink:#170504;
    --gold:#e9d9a3;
    --gold-soft:#cdb87c;
    --teal:#5ecdc4;
    --sky:#3f8fd6;
    --cream:#f6efd9;
    --line:rgba(233,217,163,0.18);
    --chant:#f5942c;
    --clap:#4fa8e0;
    --wave:#8de05f;
    --jump:#b98cff;
    --spin:#ff86c8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-deep);
    color:var(--cream);
    font-family:'Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--teal);color:var(--ink);}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- utility ---------- */
  .eyebrow{
    font-family:'Anton',sans-serif;
    letter-spacing:.3em;
    font-size:clamp(13px,3.6vw,16px);
    color:var(--gold-soft);
    text-transform:uppercase;
    text-shadow:0 1px 6px rgba(0,0,0,0.85), 0 0 20px rgba(0,0,0,0.6);
  }

  /* ---------- HERO / HOME ---------- */
  .hero{
    position:relative;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    /* 위쪽 정렬 고정 — 공연 정보를 펼쳐도 위 내용(제목·카운트다운)이 밀려 올라가지 않음.
       닫힌 상태에서 가운데처럼 보이게 하는 여백은 JS(layoutHeroCenter)가 한 번만 계산해 고정합니다. */
    justify-content:flex-start;
    padding:calc(44px + var(--safe-top, 0px)) 20px 36px;
    background:
      radial-gradient(120% 70% at 50% 8%, rgba(200,70,42,0.55), transparent 60%),
      radial-gradient(140% 90% at 50% 100%, rgba(122,39,18,0.9), transparent 70%),
      linear-gradient(180deg, #170504 0%, #2c0a06 30%, #7a2712 78%, #3a0d08 100%);
    background-image:
      radial-gradient(120% 70% at 50% 8%, rgba(200,70,42,0.55), transparent 60%),
      radial-gradient(140% 90% at 50% 100%, rgba(122,39,18,0.9), transparent 70%),
      url('images/poster.jpg'),
      linear-gradient(180deg, #170504 0%, #2c0a06 30%, #7a2712 78%, #3a0d08 100%);
    background-size:cover,cover,cover,cover;
    background-position:center,center,center 42%,center;
    background-repeat:no-repeat;
    text-align:center;
    isolation:isolate;
  }
  .hero::after{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(23,5,4,0.42) 0%, rgba(23,5,4,0.38) 30%, rgba(23,5,4,0.66) 60%, rgba(15,4,3,0.97) 100%);
    z-index:0;
  }
  .hero-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:560px;}

  .tour-title{
    margin:16px 0 0;
    font-family:'Anton',sans-serif;
    font-size:clamp(40px,10vw,58px);
    letter-spacing:.02em;
    color:var(--gold);
    /* 카운트다운·일정과 같은 빨강·파랑 번짐을 옅게 넣어 톤을 맞춤 */
    text-shadow:1.2px 0 0 rgba(255,64,80,0.3), -1.2px 0 0 rgba(79,168,224,0.3),
                0 2px 8px rgba(0,0,0,0.9), 0 0 28px rgba(0,0,0,0.65);
    line-height:1.06;
  }
  .tour-title span{
    display:block;
    font-size:.44em;
    letter-spacing:.36em;
    color:#fff;
    margin-bottom:8px;
    text-shadow:1.2px 0 0 rgba(255,64,80,0.42), -1.2px 0 0 rgba(79,168,224,0.42),
                0 2px 10px rgba(0,0,0,0.85);
  }

  /* ── 카운트다운 (D-DAY 알약 + 공연 일정 목록) ───────────────── */
  .countdown{
    margin-top:30px;
    display:flex;
    justify-content:center;
    width:100%;
  }
  .cd-pill{
    display:inline-flex;
    align-items:center;
    gap:clamp(12px,3.4vw,18px);
    padding:clamp(11px,3vw,15px) clamp(20px,5.6vw,30px);
    border:1px solid rgba(246,239,217,0.28);
    border-radius:999px;
    background:rgba(20,6,4,0.55);
    backdrop-filter:blur(3px);
    box-shadow:0 6px 20px rgba(0,0,0,0.45);
  }
  .cd-dday{
    font-family:'Anton',sans-serif;
    font-size:clamp(28px,8.2vw,38px);
    line-height:1;
    color:#fff;
    letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
    text-shadow:1px 0 0 rgba(255,64,80,0.42), -1px 0 0 rgba(79,168,224,0.42), 0 2px 10px rgba(0,0,0,0.8);
  }
  .cd-sep{
    width:1px;
    align-self:stretch;
    background:rgba(246,239,217,0.3);
  }
  .cd-clock{
    font-family:'Anton',sans-serif;
    font-size:clamp(28px,8.2vw,38px);
    line-height:1;
    color:#e7e3d8;
    letter-spacing:.03em;
    font-variant-numeric:tabular-nums;
    text-shadow:0 2px 10px rgba(0,0,0,0.8);
  }
  /* 마지막 공연 진행 중 / 공연 종료 상태 */
  .cd-pill.is-live{
    border-color:rgba(245,148,44,0.55);
    box-shadow:0 6px 20px rgba(0,0,0,0.45), 0 0 22px rgba(245,148,44,0.18);
  }
  .cd-pill.is-live .cd-dday{ color:var(--chant); }
  .cd-pill.is-live .cd-clock{ color:#fff; }
  .cd-pill.is-end{
    border-color:rgba(246,239,217,0.22);
    background:rgba(20,6,4,0.4);
  }
  .cd-pill.is-end .cd-sep,
  .cd-pill.is-end .cd-clock{ display:none; }
  .cd-pill.is-end .cd-dday{
    color:#b9b3a6;
    letter-spacing:.16em;
    text-shadow:0 2px 10px rgba(0,0,0,0.8);
  }
  /* 이미 끝난 공연은 흐리게 / 진행 중인 공연은 주황으로 */
  .show-row.past{ opacity:.38; }
  .show-row.live .show-day{ color:var(--chant); }
  .show-row.live .show-time{ color:var(--chant); opacity:.85; }
  .show-row{ transition:opacity .3s ease; }

  .countdown-done{
    margin-top:30px;
    font-family:'Black Han Sans',sans-serif;
    font-size:22px;
    color:var(--teal);
    letter-spacing:.06em;
    text-shadow:0 2px 10px rgba(0,0,0,0.8);
  }

  .show-meta{
    margin-top:30px;
    width:100%;
    max-width:420px;
    text-align:left;
  }
  .show-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding:13px 2px;
    border-top:1px solid rgba(246,239,217,0.16);
  }
  .show-day{
    font-family:'Anton',sans-serif;
    font-size:clamp(18px,5vw,22px);
    letter-spacing:.03em;
    color:#fff;
    text-shadow:1px 0 0 rgba(255,64,80,0.4), -1px 0 0 rgba(79,168,224,0.4), 0 2px 8px rgba(0,0,0,0.8);
  }
  .show-day .dow{ margin-left:6px; }
  .show-time{
    font-family:'Anton',sans-serif;
    font-size:clamp(16px,4.4vw,20px);
    letter-spacing:.04em;
    color:#b9b3a6;
    font-variant-numeric:tabular-nums;
    text-shadow:0 2px 8px rgba(0,0,0,0.8);
  }
  .show-venue{
    margin-top:0;
    padding-top:13px;
    border-top:1px solid rgba(246,239,217,0.16);
    font-family:'Anton',sans-serif;
    font-size:clamp(12px,3.2vw,13px);
    color:#8d8577;
    letter-spacing:.18em;
    text-shadow:0 1px 6px rgba(0,0,0,0.85);
  }

  .main-menu{
    position:relative;z-index:1;
    margin-top:28px;
    width:100%;
    max-width:560px;
  }
  .menu-btn{
    width:100%;
    display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(180deg, rgba(246,239,217,0.10), rgba(246,239,217,0.04));
    border:1px solid rgba(233,217,163,0.34);
    border-radius:16px;
    padding:20px 24px;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
    transition:background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .menu-btn:hover, .menu-btn:focus-visible{
    background:linear-gradient(90deg, rgba(94,205,196,0.14), rgba(63,143,214,0.10));
    border-color:var(--teal);
    transform:translateY(-2px);
    outline:none;
  }
  .menu-btn-label{
    font-family:'Black Han Sans','Anton',sans-serif;
    font-size:clamp(20px,5.6vw,24px);
    letter-spacing:.02em;
    color:#fff;
    text-shadow:0 2px 10px rgba(0,0,0,0.8);
  }

  /* ---------- SONG LIST / GUIDE ---------- */
  .guide-page{
    min-height:100svh;
    position:relative;
    background:
      linear-gradient(180deg, rgba(15,4,3,0.90) 0%, rgba(15,4,3,0.94) 100%),
      url('images/poster-guide.jpg') center 30%/cover no-repeat,
      linear-gradient(180deg,#170504 0%, #0f0403 100%);
  }
  .songs-section{
    background:none;
    padding:36px 20px 80px;
  }
  .songs-head{
    max-width:640px;margin:0 auto 26px;
    text-align:center;
  }
  .songs-head h2{
    font-family:'Black Han Sans',sans-serif;
    font-size:clamp(22px,6vw,28px);
    margin:10px 0 6px;
    letter-spacing:.02em;
  }
  .songs-head p{
    margin:0;
    font-size:13px;
    color:#b9a98a;
  }

  /* ── 곡 목록 검색 ─────────────────────────────────────────── */
  .song-search{
    position:sticky;
    top:0;
    z-index:5;
    max-width:640px;margin:0 auto 12px;
    padding:10px 0 10px;
  }
  /* 화면 맨 위에 붙었을 때만 뒤를 살짝 흐린다.
     (붙기 전에는 아무 배경도 깔지 않아 포스터 위에 네모가 생기지 않음) */
  .song-search::before{
    content:"";
    position:absolute;
    top:0;bottom:0;
    left:calc(50% - 50vw);
    right:calc(50% - 50vw);
    background:linear-gradient(180deg, rgba(0,0,0,0.62), rgba(0,0,0,0));
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
    -webkit-mask-image:linear-gradient(180deg,#000 62%,transparent);
    mask-image:linear-gradient(180deg,#000 62%,transparent);
    opacity:0;
    transition:opacity .22s ease;
    pointer-events:none;
  }
  .song-search.stuck::before{ opacity:1; }
  .song-search-sentinel{ height:1px; margin:0; }
  .song-search-box{
    position:relative;                 /* 위 흐림 레이어보다 앞에 */
    display:flex;align-items:center;gap:9px;
    padding:11px 14px;
    border:1px solid rgba(246,239,217,0.20);
    border-radius:999px;
    /* 색을 얹지 않고 뒤 배경을 그대로 어둡게만 — 포스터 색이 무엇이든 겉돌지 않게 */
    background:rgba(0,0,0,0.30);
    backdrop-filter:blur(16px) saturate(1.05) brightness(0.92);
    -webkit-backdrop-filter:blur(16px) saturate(1.05) brightness(0.92);
    box-shadow:0 4px 14px rgba(0,0,0,0.28);
    transition:border-color .2s ease, background .2s ease;
  }
  .song-search-box:focus-within{
    border-color:var(--teal);
    background:rgba(0,0,0,0.44);
  }
  .song-search-box svg{ width:15px;height:15px;color:var(--gold-soft);flex:none; }
  .song-search-box input{
    flex:1;min-width:0;
    border:none;background:none;outline:none;
    color:var(--cream);
    font-family:inherit;font-size:14px;
  }
  .song-search-box input::placeholder{ color:#8d7d62; }
  /* 브라우저 기본 지우기 버튼은 숨기고 우리 ✕ 하나만 쓴다 */
  .song-search-box input::-webkit-search-cancel-button,
  .song-search-box input::-webkit-search-decoration{ -webkit-appearance:none; appearance:none; display:none; }
  .song-search-clear{
    flex:none;
    border:none;background:none;
    color:#8d7d62;
    font-size:15px;line-height:1;
    padding:2px 2px;
    cursor:pointer;
    display:none;
  }
  .song-search-clear.show{ display:block; }
  .song-search-meta{
    display:flex;align-items:center;justify-content:space-between;
    max-width:640px;margin:0 auto 6px;
    padding:0 2px;
    font-family:'Anton',sans-serif;
    font-size:11.5px;letter-spacing:.08em;
    color:#a5947a;
    text-shadow:0 1px 6px rgba(0,0,0,0.85);
  }
  .song-empty{
    max-width:640px;margin:0 auto;
    padding:46px 10px;
    text-align:center;
    color:#8d7d62;
    font-size:13.5px;line-height:1.7;
  }
  .song-empty b{ display:block;color:var(--cream);font-size:15px;margin-bottom:6px; }
  .song-row .hit{ color:var(--teal); }
  .song-list{
    max-width:640px;margin:0 auto;
    list-style:none;padding:0;
    border-top:1px solid var(--line);
  }
  .song-row{
    width:100%;
    display:flex;align-items:center;gap:13px;
    background:none;border:none;border-bottom:1px solid var(--line);
    color:var(--cream);
    padding:20px 6px;
    cursor:pointer;
    text-align:left;
    transition:background .2s ease, padding-left .2s ease;
  }
  .song-row:hover, .song-row:focus-visible{
    background:linear-gradient(90deg, rgba(94,205,196,0.10), transparent 70%);
    padding-left:14px;
    outline:none;
  }
  .song-title{
    flex:1;
    font-family:'Noto Sans KR',sans-serif;
    font-weight:500;
    font-size:clamp(16px,4.4vw,18px);
    letter-spacing:0;
    line-height:1.45;
    color:var(--cream);
  }
  /* 곡 번호 */
  .song-num{
    flex:none;
    width:26px;
    font-family:'Anton',sans-serif;
    font-size:14px;
    letter-spacing:.04em;
    color:var(--gold-soft);
    text-align:right;
  }

  .credits{
    text-align:center;
    padding:30px 20px 60px;
    font-size:11px;
    color:#7a6a52;
    letter-spacing:.08em;
  }

  /* ---------- INFO ACCORDION (공연 정보 / 관객 입장안내) ---------- */
  /* 히어로(첫 화면) 안에 들어가는 공연 정보 카드 */
  .info-section{
    position:relative;z-index:1;
    width:100%;
    max-width:560px;
    margin:0 auto;
    text-align:left;
  }
  .info-card{
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    background:rgba(20,6,4,0.55);
    backdrop-filter:blur(3px);
    box-shadow:0 6px 20px rgba(0,0,0,0.45);
  }
  /* ── 홈 아래 메뉴 — 한 장의 카드 안에 같은 모양의 줄로 정리 ──────
     응원가이드(주 버튼) → 공연 정보 · 가는 길 · 공식사이트 순서. */
  .menu-card{
    width:100%;
    max-width:560px;
    margin:14px auto 0;
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    background:rgba(20,6,4,0.55);
    backdrop-filter:blur(3px);
    box-shadow:0 6px 20px rgba(0,0,0,0.45);
    text-align:left;
  }
  .menu-card > * + *{ border-top:1px solid var(--line); }

  /* 카드 안에서는 각 항목의 테두리를 없애 한 덩어리로 보이게 */
  .menu-card .info-card{
    border:none;border-radius:0;
    background:none;box-shadow:none;backdrop-filter:none;
    margin:0;
  }

  .menu-row{
    width:100%;
    display:flex;align-items:center;gap:11px;
    padding:14px 15px;
    background:none;border:none;
    color:var(--cream);
    font-family:inherit;
    text-align:left;text-decoration:none;
    cursor:pointer;
    transition:background .2s ease;
  }
  .menu-row:hover, .menu-row:focus-visible{
    background:linear-gradient(90deg, rgba(94,205,196,0.10), transparent 75%);
    outline:none;
  }
  .info-toggle-icon{
    flex:none;
    width:26px;height:26px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg, rgba(94,205,196,0.18), rgba(63,143,214,0.14));
    border:1px solid var(--line);
    color:var(--teal);
  }
  .info-toggle-icon svg{width:14px;height:14px;}
  .info-toggle-label{
    flex:1;
    min-width:0;
    font-family:'Black Han Sans',sans-serif;
    font-size:14px;
    letter-spacing:.02em;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 6px rgba(0,0,0,0.6);
  }
  .info-toggle-chevron{
    flex:none;
    width:16px;height:16px;
    color:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;
    transition:transform .3s ease;
  }
  .info-toggle-chevron svg{width:16px;height:16px;}
  .info-card.open .info-toggle-chevron{ transform:rotate(180deg); }

  /* 외부 링크 줄 (공식사이트) */
  .menu-row.ext .info-toggle-icon{
    background:linear-gradient(135deg, rgba(212,175,110,0.18), rgba(94,205,196,0.10));
    color:var(--gold-soft);
  }
  .menu-row.ext .info-toggle-label{ color:var(--gold); font-size:13.5px; }
  .menu-row.ext .go{
    flex:none;
    font-size:13px;
    color:var(--gold-soft);
  }
  .menu-row.ext:hover .go{ color:var(--teal); }

  @media (max-width:400px){
    .menu-row{ padding:13px 13px; gap:9px; }
    .info-toggle-label{ font-size:13px; }
  }

  .info-panel{
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .38s cubic-bezier(.4,0,.2,1), opacity .3s ease;
  }
  .info-card.open .info-panel{ opacity:1; }

  .info-panel-inner{
    padding:4px 20px 24px;
    border-top:1px solid var(--line);
    /* 내용이 살짝 아래로 흘러내리듯 나타나 아코디언 움직임과 자연스럽게 이어지게 함 */
    transform:translateY(-8px);
    transition:transform .38s cubic-bezier(.4,0,.2,1);
  }
  .info-card.open .info-panel-inner{ transform:translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .info-panel, .info-panel-inner, .info-toggle-chevron{ transition:none; }
  }
  .info-panel-title{
    margin:20px 0 4px;
    text-align:center;
    font-family:'Black Han Sans',sans-serif;
    font-size:clamp(17px,4.6vw,20px);
    letter-spacing:.02em;
    color:var(--gold);
    text-shadow:0 1px 6px rgba(0,0,0,0.6);
  }
  .info-panel-title .bar{
    color:var(--teal);
    margin:0 8px;
    font-weight:400;
  }
  .info-table-wrap{
    margin-top:16px;
    overflow-x:auto;
    border-radius:10px;
    border:1px solid var(--line);
  }
  /* 모바일에서도 PC와 똑같은 4열 표로 보이도록 글자·여백이 화면 폭에 맞춰 함께 줄어듦 */
  .info-table{
    width:100%;
    min-width:0;
    table-layout:fixed;
    border-collapse:collapse;
    font-size:clamp(9.5px,2.7vw,12.5px);
  }
  .info-table thead th{
    background:linear-gradient(180deg, rgba(233,217,163,0.16), rgba(233,217,163,0.05));
    color:var(--gold);
    font-family:'Anton',sans-serif;
    letter-spacing:.02em;
    font-size:clamp(9px,2.5vw,11.5px);
    text-transform:uppercase;
    padding:clamp(8px,2.4vw,12px) clamp(2px,1vw,10px);
    text-align:center;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  .info-table td{
    padding:clamp(9px,2.6vw,13px) clamp(2px,1vw,10px);
    text-align:center;
    color:var(--cream);
    border-bottom:1px solid var(--line);
    white-space:nowrap;
    vertical-align:middle;
  }
  .info-table tbody tr:last-child td{ border-bottom:none; }
  .info-table tbody tr:nth-child(even){ background:rgba(246,239,217,0.03); }
  .info-table td.label{
    text-align:left;
    font-weight:700;
    color:#fff;
    white-space:normal;
    word-break:keep-all;      /* 한글은 단어 단위로 줄바꿈 */
    line-height:1.4;
  }
  .info-table td.note{
    text-align:left;
    font-size:clamp(9px,2.5vw,11.5px);
    color:#b9a98a;
    white-space:normal;
    word-break:keep-all;
    overflow-wrap:anywhere;
    line-height:1.45;
  }
  /* 열 너비 비율 — PC·모바일 동일 (합 100%) */
  .info-col-label{ width:26%; }
  .info-col-day{   width:23%; }
  .info-col-note{  width:28%; }
  .info-footnote{
    margin:14px 2px 0;
    font-size:11.5px;
    color:var(--gold-soft);
    line-height:1.6;
  }

  /* 공연 개요 — 항목 : 내용 목록 */
  .info-facts{
    margin:14px 0 0;
    display:grid;
    grid-template-columns:auto 1fr;
    gap:9px 14px;
    font-size:13px;
    line-height:1.55;
  }
  .info-facts dt{
    color:var(--gold-soft);
    white-space:nowrap;
    font-size:12px;
    padding-top:1px;
  }
  .info-facts dd{
    margin:0;
    color:var(--cream);
  }
  .info-facts .em{ color:var(--gold); font-weight:700; }
  .info-facts .sub{
    display:block;
    margin-top:2px;
    font-size:11.5px;
    color:#a99a80;
  }
  .info-price{
    margin:0;
    display:flex;
    flex-wrap:wrap;
    gap:6px 8px;
  }
  .info-price span{
    display:inline-block;
    padding:3px 9px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(0,0,0,0.25);
    font-size:12px;
    color:var(--cream);
  }
  .info-book-link{
    display:inline-flex;align-items:center;gap:7px;
    margin:16px 0 0;
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(0,0,0,0.28);
    color:var(--gold);
    text-decoration:none;
    font-size:12.5px;
    transition:border-color .2s ease, color .2s ease;
  }
  .info-book-link:hover{ border-color:var(--teal); color:var(--teal); }
  .info-book-link svg{ width:14px;height:14px; }
  .info-divider{
    margin:22px 0 0;
    border:0;
    border-top:1px solid var(--line);
  }
  @media (max-width:400px){
    .info-facts{ grid-template-columns:1fr; gap:2px 0; }
    .info-facts dt{ margin-top:9px; }
  }

  /* 좁은 화면에서는 카드 안쪽 여백을 줄여 표가 쓸 수 있는 폭을 최대한 확보 */
  @media (max-width:480px){
    .info-panel-inner{ padding:4px 10px 20px; }
  }
  /* 아주 좁은 기기(320px 등) — 시간 열이 겹치지 않도록 비율과 글자를 한 단계 더 조임 */
  @media (max-width:359px){
    .info-panel-inner{ padding:4px 6px 18px; }
    .info-col-label{ width:24%; }
    .info-col-day{   width:25%; }
    .info-col-note{  width:26%; }
    .info-table{ font-size:8.8px; }
    .info-table thead th{ font-size:8.5px; padding:8px 1px; }
    .info-table td{ padding:9px 1px; }
    .info-table td.note{ font-size:8.5px; }
  }

  /* ---------- SONG DETAIL PAGE ---------- */
  .song-page{
    height:100svh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:
      linear-gradient(180deg, rgba(15,4,3,0.90) 0%, rgba(23,5,4,0.94) 100%),
      var(--song-cover, url('images/poster-song.jpg')) center 30%/cover no-repeat,
      linear-gradient(180deg,#170504 0%, #260906 100%);
  }
  .song-body{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  .song-fixed-top{
    flex:none;
  }
  .song-topbar{
    display:flex;align-items:center;gap:14px;
    /* 홈 화면에 설치해 실행하면 화면 맨 위(시계·배터리 영역)까지 앱이 그려지므로
       그만큼 안쪽으로 밀어 준다. --safe-top 은 아래 @media 에서 정해진다. */
    padding:calc(16px + var(--safe-top, 0px)) 18px 16px;
    background:#1c0705;
    border-bottom:1px solid var(--line);
    position:relative;
    z-index:2;
  }
  .back-btn{
    background:none;border:1px solid var(--line);color:var(--cream);
    border-radius:999px;
    padding:8px 14px;
    font-size:13px;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .back-btn:hover{border-color:var(--teal);color:var(--teal);}
  .song-topbar h1{
    font-family:'Black Han Sans',sans-serif;
    font-size:clamp(16px,4.6vw,20px);
    margin:0;
    flex:1;
    text-align:center;
    padding-right:64px; /* balance back button */
  }

  /* ---------- 곡 이동 (이전/다음 + 제목 탭 → 곡 목록) ---------- */
  .song-topbar.has-nav{ gap:8px; padding:calc(12px + var(--safe-top, 0px)) 12px 12px; }
  .song-topbar.has-nav .back-btn{ flex:none; padding:8px 11px; }
  .song-nav{
    flex:1;
    min-width:0;
    display:flex;align-items:center;gap:6px;
  }
  .song-nav-btn{
    flex:none;
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    background:none;
    border:1px solid var(--line);
    border-radius:50%;
    color:var(--cream);
    cursor:pointer;
    transition:border-color .18s ease, color .18s ease, background .18s ease;
  }
  .song-nav-btn svg{width:18px;height:18px;}
  .song-nav-btn:hover, .song-nav-btn:focus-visible{
    border-color:var(--teal);color:var(--teal);
    background:rgba(94,205,196,0.10);
    outline:none;
  }
  .song-nav-btn:active{transform:scale(0.94);}

  /* 현재 곡 제목 = 목록 열기 버튼 */
  /* .song-topbar h1 의 padding-right(뒤로가기 버튼 균형용)를 여기서는 해제 */
  .song-topbar .song-picker-h{
    flex:1; min-width:0; margin:0; padding:0;
  }
  .song-picker-btn{
    width:100%;
    display:flex;align-items:center;justify-content:center;gap:7px;
    background:rgba(246,239,217,0.05);
    border:1px solid var(--line);
    border-radius:999px;
    color:var(--cream);
    padding:7px 12px;
    cursor:pointer;
    transition:border-color .18s ease, background .18s ease;
  }
  .song-picker-btn:hover, .song-picker-btn:focus-visible{
    border-color:var(--teal);
    background:linear-gradient(90deg, rgba(94,205,196,0.12), rgba(63,143,214,0.08));
    outline:none;
  }
  .song-picker-title{
    min-width:0;
    font-family:'Black Han Sans',sans-serif;
    font-size:clamp(13px,3.9vw,17px);
    line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .song-picker-caret{
    flex:none;width:15px;height:15px;
    display:flex;align-items:center;justify-content:center;
    color:var(--gold-soft);
    transition:transform .25s ease;
  }
  .song-picker-caret svg{width:15px;height:15px;}
  .song-picker-btn[aria-expanded="true"] .song-picker-caret{transform:rotate(180deg);}

  /* 곡 목록 시트 */
  .song-sheet{
    position:fixed;inset:0;z-index:60;
    display:flex;flex-direction:column;justify-content:flex-end;
    opacity:0;pointer-events:none;
    transition:opacity .22s ease;
  }
  .song-sheet.open{opacity:1;pointer-events:auto;}
  .song-sheet-backdrop{
    position:absolute;inset:0;
    background:rgba(8,2,2,0.68);
    backdrop-filter:blur(2px);
  }
  .song-sheet-panel{
    position:relative;
    margin:0 auto;
    width:100%;max-width:560px;
    max-height:76svh;
    display:flex;flex-direction:column;
    background:linear-gradient(180deg,#28100b 0%, #1a0705 100%);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:20px 20px 0 0;
    box-shadow:0 -12px 40px rgba(0,0,0,0.6);
    padding-bottom:env(safe-area-inset-bottom, 0px);   /* 제스처 바에 안 가리게 */
    transform:translateY(14px);
    transition:transform .26s cubic-bezier(.4,0,.2,1);
  }
  .song-sheet.open .song-sheet-panel{transform:translateY(0);}
  .song-sheet-head{
    flex:none;
    display:flex;align-items:center;gap:12px;
    padding:16px 18px 12px;
    border-bottom:1px solid var(--line);
  }
  .song-sheet-grip{
    position:absolute;top:7px;left:50%;transform:translateX(-50%);
    width:38px;height:4px;border-radius:999px;
    background:rgba(233,217,163,0.25);
  }
  .song-sheet-title{
    flex:1;
    font-family:'Anton',sans-serif;
    letter-spacing:.18em;
    font-size:12px;
    color:var(--gold);
    text-transform:uppercase;
  }
  .song-sheet-count{
    font-size:11px;color:#8d7d62;letter-spacing:.06em;
  }
  .song-sheet-close{
    flex:none;
    width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;
    background:none;border:1px solid var(--line);border-radius:50%;
    color:var(--cream);cursor:pointer;
  }
  .song-sheet-close svg{width:14px;height:14px;}
  .song-sheet-close:hover{border-color:var(--teal);color:var(--teal);}
  .sheet-search{
    flex:none;
    padding:10px 14px 6px;
  }
  .sheet-search .song-search-box{ padding:9px 13px; }
  .sheet-search .song-search-box input{ font-size:13.5px; }
  .sheet-empty{
    flex:none;
    margin:0;padding:28px 10px;
    text-align:center;
    color:#8d7d62;font-size:13px;
  }
  .song-sheet-list{
    flex:1;min-height:0;
    overflow-y:auto;overscroll-behavior:contain;
    list-style:none;margin:0;
    padding:8px 10px calc(18px + env(safe-area-inset-bottom,0px));
  }
  .song-sheet-item{
    width:100%;
    display:flex;align-items:center;gap:12px;
    background:none;border:none;
    color:var(--cream);
    text-align:left;
    padding:13px 12px;
    border-radius:10px;
    cursor:pointer;
    transition:background .16s ease;
  }
  .song-sheet-item:hover, .song-sheet-item:focus-visible{
    background:rgba(246,239,217,0.07);outline:none;
  }
  .song-sheet-num{
    flex:none;width:24px;
    font-family:'Anton',sans-serif;
    font-size:12px;
    color:#8d7d62;
    font-variant-numeric:tabular-nums;
  }
  .song-sheet-name{
    flex:1;min-width:0;
    font-size:clamp(14px,3.9vw,15.5px);
    font-weight:500;line-height:1.45;
  }
  .song-sheet-item.current{
    background:linear-gradient(90deg, rgba(94,205,196,0.16), rgba(63,143,214,0.06));
    box-shadow:inset 3px 0 0 var(--teal);
  }
  .song-sheet-item.current .song-sheet-num{color:var(--teal);}
  .song-sheet-item.current .song-sheet-name{font-weight:800;}
  .song-sheet-now{
    flex:none;
    font-family:'Anton',sans-serif;
    font-size:9px;letter-spacing:.14em;
    color:var(--teal);
    border:1px solid rgba(94,205,196,0.5);
    border-radius:999px;
    padding:3px 7px;
  }

  /* 아주 좁은 기기에서는 버튼·여백을 줄여 곡 제목이 최대한 길게 보이도록 */
  @media (max-width:360px){
    .song-topbar.has-nav{ padding:calc(10px + var(--safe-top, 0px)) 8px 10px; gap:6px; }
    .song-topbar.has-nav .back-btn{ padding:7px 9px; }
    .song-nav{ gap:4px; }
    .song-nav-btn{ width:30px;height:30px; }
    .song-nav-btn svg{ width:16px;height:16px; }
    .song-picker-btn{ padding:6px 9px; gap:5px; }
  }

  @media (prefers-reduced-motion: reduce){
    .song-sheet, .song-sheet-panel, .song-picker-caret{transition:none;}
  }

  .video-wrap{
    max-width:720px;margin:22px auto 0;padding:0 16px;
  }
  .video-frame{
    position:relative;width:100%;padding-top:56.25%;
    border-radius:12px;overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,0.5);
    border:1px solid var(--line);
    background:#000;
  }
  .video-frame iframe, .video-frame div{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .watch-on-yt{
    display:inline-block;
    margin-top:8px;
    font-size:11px;
    color:#8d7d62;
    text-decoration:none;
  }
  .watch-on-yt:hover{color:var(--teal);}


  .lyrics-note{
    max-width:720px;margin:16px auto 0;padding:0 16px;
    font-size:12px;color:#b9a98a;
    display:flex;gap:8px;align-items:flex-start;
  }
  .lyrics-note .dot{color:var(--teal);}

  .lyrics-legend{
    max-width:720px;margin:14px auto 12px;padding:0 16px;
    display:flex;gap:18px;flex-wrap:wrap;
  }
  .legend-item{
    display:flex;align-items:center;gap:7px;
    font-size:12px;color:#cbb99b;
  }
  .legend-icon{
    width:20px;height:20px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .legend-icon svg{width:12px;height:12px;}
  .legend-icon.chant{background:rgba(245,148,44,0.16);color:var(--chant);}
  .legend-icon.clap{background:rgba(79,168,224,0.16);color:var(--clap);}
  .legend-icon.wave{background:rgba(141,224,95,0.18);color:var(--wave);}

  .lyrics-scroll{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overscroll-behavior:contain;
    border-top:1px solid var(--line);
    /* -webkit-overflow-scrolling:touch 는 iOS에서 잔상/깜빡임을 일으켜 제거함
       (iOS 13+ 는 기본으로 관성 스크롤이 동작) */
    transform:translateZ(0);
    isolation:isolate;
  }
  .lyrics-list{
    max-width:720px;margin:10px auto 0;padding:8px 10px 140px;
    list-style:none;
  }
  .lyric-line{
    width:100%;
    display:flex;
    gap:10px;
    align-items:flex-start;
    background:none;border:none;
    padding:13px 10px;
    border-radius:10px;
    text-align:left;
    cursor:pointer;
    transition:background-color .18s ease;
  }
  .lyric-line:hover{background:rgba(246,239,217,0.06);}
  /* 각 가사 줄에 포함된 파트 종류를 아이콘으로 표시 (떼창/박수/둘 다) */
  .lyric-icons{
    flex:none;
    display:flex;
    flex-direction:column;
    gap:4px;
    width:22px;
    padding-top:2px;
  }
  .lyric-type-icon{
    width:22px;height:22px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .lyric-type-icon svg{width:13px;height:13px;}
  .lyric-type-icon.chant{background:rgba(245,148,44,0.16);color:var(--chant);}
  .lyric-type-icon.clap{background:rgba(79,168,224,0.16);color:var(--clap);}
  .lyric-type-icon.wave{background:rgba(141,224,95,0.18);color:var(--wave);}

  /* ── 가사 안에 글자처럼 끼워 넣는 움직이는 아이콘 ────────────────
     가사 텍스트 아무 곳에나 [wave] / [clap] 이라고 적으면
     그 자리에 흔드는 손 · 박수 아이콘이 실시간으로 움직인다. */
  .ico{
    display:inline-flex;
    align-items:center;justify-content:center;
    vertical-align:-0.2em;
    margin:0 2px;
  }
  /* 손 흔들기 — 손목을 축으로 좌우로 살랑살랑 */
  .ico-wave{
    width:1.15em;height:1.15em;
    color:var(--wave);
  }
  .ico-wave svg{
    width:100%;height:100%;
    transform-origin:60% 85%;
    animation:handWave 1.1s ease-in-out infinite;
  }
  @keyframes handWave{
    0%,100%{ transform:rotate(-16deg); }
    50%    { transform:rotate(16deg); }
  }

  /* 박수 — 두 손이 가운데로 모였다 벌어지고, 마주치는 순간 반짝 */
  .ico-clap{
    position:relative;
    width:1.5em;height:1.15em;
    color:var(--clap);
  }
  .ico-clap .hand{
    position:absolute;top:0;
    width:0.85em;height:1.15em;
    display:block;
  }
  .ico-clap .hand svg{width:100%;height:100%;}
  .ico-clap .hand.l{ left:0;  animation:clapL .62s ease-in-out infinite; }
  .ico-clap .hand.r{ right:0; animation:clapR .62s ease-in-out infinite; }
  .ico-clap .spark{
    position:absolute;
    left:50%;top:-0.12em;
    width:0.9em;height:0.9em;
    margin-left:-0.45em;
    color:var(--gold);
    opacity:0;
    animation:clapSpark .62s ease-out infinite;
    pointer-events:none;
  }
  .ico-clap .spark svg{width:100%;height:100%;}
  @keyframes clapL{
    0%,100%{ transform:translateX(-8%) rotate(-14deg); }
    46%,56%{ transform:translateX(6%)  rotate(-2deg); }
  }
  @keyframes clapR{
    0%,100%{ transform:scaleX(-1) translateX(-8%) rotate(-14deg); }
    46%,56%{ transform:scaleX(-1) translateX(6%)  rotate(-2deg); }
  }
  @keyframes clapSpark{
    0%,38%  { opacity:0; transform:scale(.5)  translateY(2px); }
    50%     { opacity:.95; transform:scale(1) translateY(0); }
    74%,100%{ opacity:0; transform:scale(1.3) translateY(-2px); }
  }

  /* 점프 — 바닥선 위에서 웅크렸다 튀어오름 */
  .ico-jump{
    position:relative;
    width:1.3em;height:1.45em;
    vertical-align:-0.3em;
    color:var(--jump);
  }
  .ico-jump svg{
    position:absolute;left:0;top:0;
    width:100%;height:84%;
    transform-origin:50% 100%;
    animation:iconJump .72s cubic-bezier(.3,.7,.4,1) infinite;
  }
  .ico-jump .ground{
    position:absolute;
    left:6%;right:6%;bottom:0;
    height:2px;border-radius:2px;
    background:currentColor;
    opacity:.42;
  }
  @keyframes iconJump{
    0%      { transform:translateY(0)    scaleY(1); }
    14%     { transform:translateY(5%)   scaleY(.91); }   /* 웅크림 */
    46%     { transform:translateY(-17%) scaleY(1.03); }  /* 점프 (높이 조절은 이 값) */
    78%,100%{ transform:translateY(0)    scaleY(1); }
  }

  /* 머리 위로 팔 돌리기 — 손을 든 채로 팔 전체가 기울며 손이 작은 원을 그린다 */
  .ico-spin{
    position:relative;
    width:1.55em;height:1.55em;
    vertical-align:-0.38em;
    color:var(--spin);
  }
  .ico-spin .body,
  .ico-spin .arm{
    position:absolute;inset:0;
    width:100%;height:100%;
  }
  .ico-spin .arm{
    transform-origin:47.5% 67.1%;     /* 어깨 위치 (11.4, 16.1) */
    animation:iconArmCircle 1.15s linear infinite;
  }
  /* 든 손이 머리 옆에서 작은 원을 그리도록 —
     좌우로 기울이기(rotate) + 팔 길이 원근감(scale) 을 90° 어긋나게 겹친다 */
  @keyframes iconArmCircle{
    0%     { transform:rotate(11.00deg) scale(1.000); }
    8.333% { transform:rotate(9.53deg) scale(1.070); }
    16.667%{ transform:rotate(5.50deg) scale(1.121); }
    25.000%{ transform:rotate(0.00deg) scale(1.140); }
    33.333%{ transform:rotate(-5.50deg) scale(1.121); }
    41.667%{ transform:rotate(-9.53deg) scale(1.070); }
    50.000%{ transform:rotate(-11.00deg) scale(1.000); }
    58.333%{ transform:rotate(-9.53deg) scale(0.930); }
    66.667%{ transform:rotate(-5.50deg) scale(0.879); }
    75.000%{ transform:rotate(-0.00deg) scale(0.860); }
    83.333%{ transform:rotate(5.50deg) scale(0.879); }
    91.667%{ transform:rotate(9.53deg) scale(0.930); }
    100%   { transform:rotate(11.00deg) scale(1.000); }
  }
  .lyric-line.active .ico-spin .arm{ animation-duration:.8s; }
  .lyric-line.active .ico-spin{ filter:drop-shadow(0 0 6px rgba(255,134,200,0.5)); }

  /* 떼창(마이크) — 살짝 커졌다 작아지는 맥박 */
  .ico-mic{
    width:1.05em;height:1.05em;
    color:var(--chant);
  }
  .ico-mic svg{
    width:100%;height:100%;
    animation:micPulse 1.2s ease-in-out infinite;
  }
  @keyframes micPulse{
    0%,100%{ transform:scale(1); }
    50%    { transform:scale(1.18); }
  }

  /* 지금 재생 중인 줄의 아이콘은 조금 더 빠르고 또렷하게 */
  .lyric-line.active .ico-wave svg{ animation-duration:.75s; }
  .lyric-line.active .ico-clap .hand{ animation-duration:.45s; }
  .lyric-line.active .ico-clap .spark{ animation-duration:.45s; }
  .lyric-line.active .ico-wave{ filter:drop-shadow(0 0 6px rgba(141,224,95,0.5)); }
  .lyric-line.active .ico-clap{ filter:drop-shadow(0 0 6px rgba(79,168,224,0.45)); }

  .lyric-line.active .ico-mic svg{ animation-duration:.8s; }
  .lyric-line.active .ico-jump svg{ animation-duration:.5s; }
  .lyric-line.active .ico-jump{ filter:drop-shadow(0 0 6px rgba(185,140,255,0.5)); }

  /* 화면에 보이는 가사 줄의 아이콘만 실제로 움직인다.
     (한 곡에 아이콘이 100개 넘게 들어가므로 전부 돌리면 발열·배터리 소모가 큼) */
  .lyric-line .ico-wave svg,
  .lyric-line .ico-mic svg,
  .lyric-line .ico-jump svg,
  .lyric-line .ico-spin .arm,
  .lyric-line .ico-clap .hand,
  .lyric-line .ico-clap .spark{ animation-play-state:paused; }
  .lyric-line.in-view .ico-wave svg,
  .lyric-line.in-view .ico-mic svg,
  .lyric-line.in-view .ico-jump svg,
  .lyric-line.in-view .ico-spin .arm,
  .lyric-line.in-view .ico-clap .hand,
  .lyric-line.in-view .ico-clap .spark{ animation-play-state:running; }

  /* 왼쪽 종류 표시(동그라미)와 범례에도 같은 움직이는 아이콘을 그대로 사용.
     em 기준 크기라서 font-size 만 정해 주면 동그라미 안에 딱 맞게 들어간다. */
  .lyric-type-icon .ico{ margin:0; font-size:11px; }
  .legend-icon .ico{ margin:0; font-size:10px; }
  .lyric-type-icon .ico svg, .legend-icon .ico svg{ width:100%; height:100%; }
  .lyric-type-icon .ico-mic, .legend-icon .ico-mic,
  .lyric-type-icon .ico-wave, .legend-icon .ico-wave,
  .lyric-type-icon .ico-clap, .legend-icon .ico-clap{ color:inherit; }

  @media (prefers-reduced-motion: reduce){
    .ico-wave svg, .ico-clap .hand, .ico-clap .spark, .ico-mic svg, .ico-jump svg,
    .ico-spin .arm{ animation:none; }
    .ico-clap .hand.r{ transform:scaleX(-1); }
  }
  .lyric-body{min-width:0;display:block;flex:1;}

     영상을 화면에서 완전히 감추고 한글 발음 가사만 크게 보여 준다.
     플레이어는 화면 밖으로 옮겨 두기만 하므로(없애지 않음)
     온라인이면 소리도 그대로 나오고 가사 동기화도 계속 동작한다. */
  /* 단축모드에서는 영상이 안 보이므로 재생/정지 버튼을 따로 둔다 */
  .play-toggle{
    display:none;
    align-items:center;justify-content:center;
    width:48px;height:48px;
    border-radius:50%;
    border:1px solid var(--gold-soft);
    background:linear-gradient(180deg, #2c130c, #1c0a06);
    color:var(--gold);
    cursor:pointer;
    box-shadow:0 3px 12px rgba(0,0,0,0.5);
    transition:transform .12s ease, border-color .18s ease, color .18s ease;
  }
  .play-toggle:active{ transform:scale(0.94); }
  .play-toggle svg{ width:20px;height:20px; }
  .play-toggle.playing{ border-color:var(--wave); color:var(--wave); }
  .song-page.venue .play-toggle{ display:flex; }

  .song-page.venue.offline .play-toggle{ display:none; }

  .venue-toggle{
    display:flex;align-items:center;gap:7px;

    border-radius:999px;
    padding:5px 5px 5px 10px;
    cursor:pointer;
    box-shadow:0 3px 9px rgba(0,0,0,0.45);
    transition:opacity .18s ease, transform .12s ease, border-color .18s ease;

  .venue-toggle:active{ transform:scale(0.97); }
  .venue-toggle:not(.active){ opacity:.55; }
  .venue-toggle.active{ border-color:var(--wave); }
  .venue-label{
    font-family:'Anton',sans-serif;
    font-size:10px;letter-spacing:.14em;

    white-space:nowrap;

  .venue-toggle.active .venue-label{ color:var(--wave); }
  .venue-switch{

     그 줄에 들어 있던 응원 아이콘([clap] 등)은 그대로 보이게 한다. */
  .song-page.venue .lyric-jp,

  /* ── 화면 안전영역(노치·상태바·제스처바) ─────────────────────
     브라우저 탭으로 열면 0, 홈 화면에 설치해 실행하면 실제 상태바 높이가 들어온다.
     일부 기기는 값을 0 으로 알려 주므로, 설치 실행일 때는 최소 28px 를 보장한다. */

  @media (min-width:1400px){

     flex의 justify-content:center를 쓰면 공연 정보를 펼칠 때 높이가 늘어나면서
     위쪽 글자들이 같이 밀려 올라가 이질감이 생기므로, 여백을 고정값으로 잡아 둡니다. */
  function layoutHeroCenter(){
    const hero  = document.querySelector(".hero");
    const inner = document.querySelector(".hero-inner");
    const card  = document.getElementById("info-card");
    if (!hero || !inner) return;
    // 펼쳐진 상태에서는 다시 계산하지 않음 (계산하면 화면이 움직임)
    if (card && card.classList.contains("open")) return;

    inner.style.marginTop = "0px";
    const cs   = getComputedStyle(hero);
    const padT = parseFloat(cs.paddingTop)  || 0;
    const padB = parseFloat(cs.paddingBottom) || 0;
    const free = hero.clientHeight - padT - padB - inner.offsetHeight;
    inner.style.marginTop = free > 0 ? Math.round(free / 2) + "px" : "0px";
  }

  /* 화면 "가로" 크기가 바뀔 때만 다시 계산.
     모바일에서 주소창이 접히며 생기는 세로 높이 변화로는 다시 계산하지 않아 화면이 흔들리지 않음 */
  let lastHeroWidth = window.innerWidth;
  window.addEventListener("resize", ()=>{
    if (window.innerWidth === lastHeroWidth) return;
    lastHeroWidth = window.innerWidth;
    layoutHeroCenter();
  });

  /* 홈 화면 "공연 정보" 아코디언 — 클릭 시 관객 입장안내가 아래로 펼쳐짐 */
  /* 공연 정보 · 준비물 · 가는 길 — 접었다 펴는 카드 전부에 동일하게 적용 */
  function setupAccordions(){
    document.querySelectorAll(".info-card").forEach(card => setupOneAccordion(card));
  }
  function setupOneAccordion(card){
    const btn   = card.querySelector(".info-toggle");
    const panel = card.querySelector(".info-panel");
    if (!card || !btn || !panel) return;

    btn.addEventListener("click", ()=>{
      const isOpen = card.classList.contains("open");
      if (isOpen){
        // 닫기: 현재 높이에서 0으로 애니메이션
        panel.style.maxHeight = panel.scrollHeight + "px";
        requestAnimationFrame(()=>{
          card.classList.remove("open");
          btn.setAttribute("aria-expanded", "false");
          panel.style.maxHeight = "0px";
        });
      } else {
        card.classList.add("open");
        btn.setAttribute("aria-expanded", "true");

  /* 끝난 공연은 흐리게, 진행 중인 공연은 주황으로 —
     지금 어느 공연을 세고 있는지 한눈에 보이도록 */
  function markShowRows(liveIdx, nextIdx){
    const rows = document.querySelectorAll(".show-meta .show-row");
    rows.forEach((row, i)=>{
      const live   = (i === liveIdx);
      const passed = !live && ((nextIdx === -1) || (i < nextIdx));
      row.classList.toggle("live", live);
      row.classList.toggle("past", passed);
    });
  }


  /* ── 오늘의 일정 ─────────────────────────────────────────────
     한국 시간 기준으로 오늘이 공연날이면 카드가 나타나고,
     지금 어느 단계인지와 다음 단계까지 남은 시간을 1초마다 갱신한다. */
  function kstDateKey(d){
    return new Intl.DateTimeFormat("en-CA", {
      timeZone:"Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit"
    }).format(d);
  }
  let todayBuiltKey = null;
  function updateTodayCard(now){
    const card = document.getElementById("today-card");
    if (!card) return;
    const key   = kstDateKey(new Date(now));
    const steps = SHOW_TIMELINE[key];
    if (!steps){ card.hidden = true; todayBuiltKey = null; return; }
    card.hidden = false;

    const times   = steps.map(v => new Date(`${key}T${v.t}:00+09:00`).getTime());
    const nextIdx = times.findIndex(t => t > now);
    const curIdx  = nextIdx === -1 ? steps.length - 1 : nextIdx - 1;

    if (todayBuiltKey !== key){
      todayBuiltKey = key;
      const d = new Date(`${key}T12:00:00+09:00`);
      const dow = ["일","월","화","수","목","금","토"][d.getDay()];
      document.getElementById("today-title").textContent =
        `오늘 공연 · ${Number(key.slice(5,7))}/${Number(key.slice(8,10))}(${dow})`;
    }
    document.getElementById("today-list").innerHTML = steps.map((v,i)=>{
      const cls = i < curIdx ? "past" : (i === curIdx ? "now" : "");
      return `<li class="${cls}"><span class="t">${v.t}</span><span class="l">${escapeHtml(v.label)}</span></li>`;
    }).join("");

    const nowEl = document.getElementById("today-now");
    if (nextIdx === -1){
      nowEl.innerHTML = `<b>공연이 모두 끝났습니다.</b> 오늘 고생 많으셨어요!`;
      return;
    }
    const diff = times[nextIdx] - now;
    const h = Math.floor(diff/3600000), m = Math.floor(diff%3600000/60000), sec = Math.floor(diff%60000/1000);
    const left = h > 0 ? `${h}시간 ${pad(m)}분 ${pad(sec)}초` : `${m}분 ${pad(sec)}초`;
    const cur  = curIdx >= 0 ? `<b>${escapeHtml(steps[curIdx].label)}</b> 진행 중<br>` : "";
    nowEl.innerHTML = `${cur}${escapeHtml(steps[nextIdx].label)}까지 <span class="left">${left}</span>`;
  }

  /* ── 곡 목록 검색 ─────────────────────────────────────────────
     한글 제목, 괄호 안 원제(일본어·영문), 그리고 초성(ㅁㅎ → 무희)까지 찾습니다. */
  const CHO_TABLE = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  function toCho(str){
    return [...String(str)].map(ch=>{
      const c = ch.charCodeAt(0);
      return (c >= 0xAC00 && c <= 0xD7A3) ? CHO_TABLE[Math.floor((c - 0xAC00) / 588)] : ch;
    }).join("");
  }
  const squash = (str) => String(str).toLowerCase().replace(/\s+/g, "");

  function setupSongSearch(){
    const input = document.getElementById("song-search-input");
    const clear = document.getElementById("song-search-clear");
    const count = document.getElementById("song-count");
    const empty = document.getElementById("song-empty");
    if (!input) return;

    const rows = [...document.querySelectorAll(".song-list > li")].map((li,i)=>{
      const title = li.querySelector(".song-title").textContent;
      return {
        li,
        plain: squash(title),
        cho:   squash(toCho(title)),
        num:   String(i + 1),          // "5"
        pad:   pad(i + 1)              // "05"
      };
    });

    const apply = ()=>{
      // "5", "05", "5번" 모두 5번 곡으로 인식
      const raw = squash(input.value).replace(/번$/, "");
      const q   = raw;
      const isNum = /^\d{1,2}$/.test(q);
      let hit = 0;
      rows.forEach(r=>{
        const ok = !q || (isNum
          ? (r.num === String(Number(q)) || r.pad === q)   // 번호 검색
          : (r.plain.includes(q) || r.cho.includes(q)));   // 제목 · 초성 검색
        r.li.hidden = !ok;
        if (ok) hit++;
      });
      count.textContent = q ? `검색 결과 ${hit}곡` : `전체 ${rows.length}곡`;
      empty.hidden = hit !== 0;
      clear.classList.toggle("show", !!input.value);
    };

    // 검색창이 화면 맨 위에 붙었을 때만 뒤 배경을 흐리게 (붙기 전에는 그대로 둠)
    const bar = document.querySelector(".song-search");
    const sentinel = document.getElementById("song-search-sentinel");
    if (bar && sentinel && "IntersectionObserver" in window){
      new IntersectionObserver(([e])=>{
        bar.classList.toggle("stuck", !e.isIntersecting);
      }, { threshold: 0 }).observe(sentinel);
    }

    input.addEventListener("input", apply);
    clear.addEventListener("click", ()=>{ input.value = ""; apply(); input.focus(); });
    apply();
  }

  function startCountdown(){
    const shows = SHOW_SCHEDULE.map(v => ({
      start: new Date(v.start).getTime(),
      end:   new Date(v.end).getTime()
    }));
    const finalEnd = shows[shows.length - 1].end;

    function tick(){
      const box = document.getElementById("countdown");
      if (!box) { stopCountdown(); return; }

      const now     = Date.now();
      updateTodayCard(now);                                                  // 공연 당일이면 오늘 일정 갱신
      const liveIdx = shows.findIndex(v => now >= v.start && now < v.end);   // 진행 중인 공연
      const nextIdx = shows.findIndex(v => v.start > now);                   // 아직 시작 전인 첫 공연
      markShowRows(liveIdx, nextIdx);

      if (liveIdx !== -1){                 // 공연 진행 중 (토·일 모두)
        setPill("NOW", "ON AIR", "live");
        return;
      }
      if (nextIdx === -1){                 // 남은 공연 없음
        if (now >= finalEnd){
          setPill("END", "", "end");
          stopCountdown();
        }
        return;
      }

      const diff = shows[nextIdx].start - now;
      const d = Math.floor(diff/86400000);
      const h = Math.floor(diff%86400000/3600000);
      const m = Math.floor(diff%3600000/60000);
      const s = Math.floor(diff%60000/1000);
      setPill(`D-${pad(d)}`, `${pad(h)}:${pad(m)}:${pad(s)}`, "count");
    }

    tick();
    countdownTimer = setInterval(tick, 1000);
  }
  function stopCountdown(){ if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; } }

  /* 곡 목록 시트 안 검색 — 곡 목록 화면과 동일한 규칙 */
  function applySheetFilter(){

            <span class="venue-switch"><span class="venue-knob"></span></span>
          </button>
          <button class="autoscroll-toggle${autoScrollEnabled ? " active" : ""}" id="autoscroll-btn" aria-label="자동 스크롤 켜기/끄기">
            <span class="autoscroll-label">AUTO SCROLL</span>
            <span class="autoscroll-switch"><span class="autoscroll-knob"></span></span>
          </button>
        </div>

        <div class="song-sheet" id="song-sheet" aria-hidden="true">
          <div class="song-sheet-backdrop" data-close-sheet></div>
          <div class="song-sheet-panel" role="dialog" aria-label="곡 선택">
            <span class="song-sheet-grip"></span>
            <div class="song-sheet-head">
              <span class="song-sheet-title">Song List</span>
              <span class="song-sheet-count">${SONGS.length}곡</span>
              <button class="song-sheet-close" data-close-sheet aria-label="닫기">${CLOSE_SVG}</button>
            </div>
            <div class="sheet-search">
              <div class="song-search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
                <input id="sheet-search-input" type="search" inputmode="search" autocomplete="off"
                       placeholder="곡 제목 · 번호 검색">
                <button type="button" class="song-search-clear" id="sheet-search-clear" aria-label="지우기">✕</button>
              </div>
            </div>
            <p class="sheet-empty" id="sheet-empty" hidden>찾는 곡이 없어요</p>
            <ul class="song-sheet-list" id="song-sheet-list"></ul>
          </div>
        </div>
      </div>
    `;

    document.getElementById("song-back-btn").addEventListener("click", ()=>{ location.hash = "#/guide"; });

    // 이전/다음 곡 — 탭한 그 순간(사용자 제스처 안에서) 바로 재생을 시작시킨다
    document.getElementById("prev-song").addEventListener("click", ()=>{
      if (!currentSong) return;
      gotoSong(songNeighbors(currentSong).prev);
    });
    document.getElementById("next-song").addEventListener("click", ()=>{
      if (!currentSong) return;
      gotoSong(songNeighbors(currentSong).next);
    });

    // 곡 목록 시트
    document.getElementById("song-picker-btn").addEventListener("click", ()=>{
      const sheet = document.getElementById("song-sheet");
      sheet.classList.contains("open") ? closeSongSheet() : openSongSheet();
    });
    document.getElementById("song-sheet").querySelectorAll("[data-close-sheet]").forEach(el=>{
      el.addEventListener("click", closeSongSheet);
    });
    document.getElementById("song-sheet-list").addEventListener("click", (e)=>{
      const item = e.target.closest(".song-sheet-item");
      if (!item) return;
      const target = SONGS.find(s => s.id === item.dataset.id);
      closeSongSheet();
      if (!target || (currentSong && target.id === currentSong.id)) return;
      gotoSong(target);
    });

    // 곡 목록 시트 안 검색 — 곡 목록 화면과 같은 방식(제목·초성·원제·번호)
    const sheetInput = document.getElementById("sheet-search-input");
    const sheetClear = document.getElementById("sheet-search-clear");
    if (sheetInput){
      sheetInput.addEventListener("input", applySheetFilter);
      sheetClear.addEventListener("click", ()=>{
        sheetInput.value = "";
        applySheetFilter();
        sheetInput.focus();
      });
    }

    // 가사 줄 탭 → 해당 위치로 이동 (목록이 바뀌어도 되도록 위임 방식)
    document.getElementById("lyrics-list").addEventListener("click", (e)=>{
      const btn = e.target.closest(".lyric-line");
      if (!btn) return;
      seekTo(Number(btn.dataset.time));
    });

    /* 단축모드 — 영상을 감추고 발음 가사만 크게.
       온라인이면 소리와 가사 동기화는 그대로 유지된다. */
    /* 재생 / 일시정지 — 단축모드에서 영상이 안 보일 때 소리를 멈추는 수단 */
    document.getElementById("play-toggle").addEventListener("click", ()=>{
      if (!player || !playerReady) return;
      let st = -1;
      try { st = player.getPlayerState(); } catch(e){}
      try {
        if (st === YT.PlayerState.PLAYING || st === YT.PlayerState.BUFFERING) player.pauseVideo();
        else player.playVideo();
      } catch(e){}
    });

    document.getElementById("venue-btn").addEventListener("click", (e)=>{
      venueMode = !venueMode;
      store("horo-venue", venueMode ? "1" : "");
      applyVenueMode();
    });

    document.getElementById("autoscroll-btn").addEventListener("click", (e)=>{
      autoScrollEnabled = !autoScrollEnabled;
      e.currentTarget.classList.toggle("active", autoScrollEnabled);
      if (autoScrollEnabled) updateLyricsSync(true);   // 켜는 즉시 현재 위치로 이동
    });

    // ESC 로 시트 닫기 / ← → 로 이전·다음 곡 (PC 키보드)
    if (songKeyHandler) document.removeEventListener("keydown", songKeyHandler);
    songKeyHandler = (e)=>{
      if (!isSongViewActive()) return;                      // 다른 화면이면 무시
      const sheet = document.getElementById("song-sheet");
      if (e.key === "Escape"){ closeSongSheet(); return; }
      if (sheet.classList.contains("open")) return;         // 목록이 열려 있으면 좌우키 무시
      const tag = (e.target && e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea") return;
      if (e.key === "ArrowLeft")  document.getElementById("prev-song").click();
      if (e.key === "ArrowRight") document.getElementById("next-song").click();
    };
    document.addEventListener("keydown", songKeyHandler);
  }

  /* 사용자가 곡을 고른 "그 탭" 안에서 재생을 먼저 걸고 화면을 이동한다.
     (모바일은 사용자 제스처 안에서 시작한 재생만 소리를 허용하기 때문) */
  function gotoSong(song){
    if (!song) return;
    playVideoFor(song.youtubeId);
    location.hash = `#/song/${song.id}`;
  }

  function isSongViewActive(){
    return !songView.classList.contains("offstage");
  }

  function renderSong(song){
    buildSongShell();

    currentSong = song;
    lastActiveIdx = -1;
    if (scrollRafId !== null) { cancelAnimationFrame(scrollRafId); scrollRafId = null; }

    const { prev, next } = songNeighbors(song);
    const page = document.getElementById("song-page");
    if (song.cover) page.style.setProperty("--song-cover", `url('${song.cover}')`);
    else            page.style.removeProperty("--song-cover");

    document.getElementById("song-picker-title").textContent = song.title;
    document.getElementById("prev-song").title = `이전 곡: ${prev.title}`;
    document.getElementById("next-song").title = `다음 곡: ${next.title}`;
    document.getElementById("watch-on-yt").href =
      `https://www.youtube.com/watch?v=${encodeURIComponent(song.youtubeId)}`;

    document.getElementById("lyrics-list").innerHTML = song.lyrics.map((l,i)=>`
      <li>
        <button class="lyric-line" data-time="${l.time}" data-idx="${i}">
          <span class="lyric-icons">${lyricIconsHtml(l)}</span>
          <span class="lyric-body">
            <span class="lyric-jp">${withIcons(l.jp || "")}</span>
            <span class="lyric-ko">${renderKo(l.ko)}</span>
            <span class="lyric-tr">${withIcons(l.tr || "")}</span>
            ${l.bg ? `<span class="lyric-bg">${renderKo(l.bg)}</span>` : ""}
          </span>
        </button>
      </li>`).join("");

    document.getElementById("song-sheet-list").innerHTML = SONGS.map((s,i)=>`
      <li>
        <button class="song-sheet-item${s.id === song.id ? " current" : ""}" data-id="${s.id}">
          <span class="song-sheet-num">${pad(i+1)}</span>
          <span class="song-sheet-name">${escapeHtml(s.title)}</span>
          ${s.id === song.id ? `<span class="song-sheet-now">NOW</span>` : ""}
        </button>
      </li>`).join("");

    closeSongSheet();
    applySheetFilter();

    // 곡 화면 보이기 (먼저 보여야 컨테이너 높이를 정확히 잴 수 있음)
    songView.classList.remove("offstage");
    app.style.display = "none";

    applyVenueMode();                      // 단축모드 상태 반영 (글자 크기 등)
    updateLyricsPadding();                 // 첫 소절도 가운데 오도록 여백 계산
    observeLyricLines();                   // 보이는 줄의 아이콘만 움직이게
    requestWakeLock();                     // 가사 보는 동안 화면이 꺼지지 않게
    const scroller = songView.querySelector(".lyrics-scroll");
    if (scroller) scroller.scrollTop = 0;

    ensurePlaying(song.youtubeId);
  }

  /* 보이는 가사 줄에만 .in-view 를 붙여, 화면 밖 아이콘 애니메이션은 멈춰 둔다.
     (IntersectionObserver 를 못 쓰는 아주 오래된 브라우저에서는 전부 움직이게 둠) */
  let lyricObserver = null;
  function observeLyricLines(){
    if (lyricObserver){ lyricObserver.disconnect(); lyricObserver = null; }
    const container = songView.querySelector(".lyrics-scroll");
    const lines = songView.querySelectorAll(".lyric-line");
    if (!container || !lines.length) return;
    if (!("IntersectionObserver" in window)){
      lines.forEach(el => el.classList.add("in-view"));
      return;
    }
    lyricObserver = new IntersectionObserver((entries)=>{
      entries.forEach(e => e.target.classList.toggle("in-view", e.isIntersecting));
    }, { root: container, rootMargin: "120px 0px" });
    lines.forEach(el => lyricObserver.observe(el));
  }

  /* 단축모드 화면 적용 — 곡을 바꿔도 유지된다 */
  function applyVenueMode(){
    const page = document.getElementById("song-page");
    const btn  = document.getElementById("venue-btn");
    if (!page) return;
    page.classList.toggle("venue", venueMode);
    page.classList.toggle("offline", !navigator.onLine);
    if (btn) btn.classList.toggle("active", venueMode);
    updatePlayButton();
    // 글자 크기가 달라지므로 가운데 기준을 다시 잡고 현재 소절로 맞춘다
    updateLyricsPadding();
    updateLyricsSync(true);
  }
  window.addEventListener("online",  ()=>{ if (songShellBuilt) applyVenueMode(); });
  window.addEventListener("offline", ()=>{ if (songShellBuilt) applyVenueMode(); });

  /* 곡 화면을 벗어날 때 — 플레이어는 부수지 않고 일시정지만 한다
     (iframe 을 없앴다 다시 만들면 모바일에서 소리 권한이 초기화됨) */
  function leaveSongView(){
    stopSyncTimer();
    closeSongSheet();
    if (lyricObserver){ lyricObserver.disconnect(); lyricObserver = null; }
    releaseWakeLock();
    if (player && typeof player.pauseVideo === 'function') {
      try { player.pauseVideo(); } catch(e){}
    }
    if (songShellBuilt) songView.classList.add("offstage");
    app.style.display = "";
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  /* 가사 글자를 안전하게 처리하면서, [wave] [clap] [mic] 같은 표시를
     그 자리에서 움직이는 아이콘으로 바꿔 준다. 가사 어느 위치에나 넣을 수 있다. */
  /* [wave] 처럼 대괄호로도, (wave) 처럼 소괄호로도 쓸 수 있게 둘 다 인식 */
  const ICON_TOKEN_RE = /[\[(](wave|clap|mic|chant|jump|spin|turn)[\])]/gi;
  function withIcons(str){
    if (str === undefined || str === null) return "";
    return escapeHtml(String(str)).replace(ICON_TOKEN_RE, (m, key)=> INLINE_ICONS[key.toLowerCase()] || m);
  }
  function hasIconToken(str, name){
    if (typeof str !== "string") return false;
    return new RegExp(`[\\[(]${name}[\\])]`, "i").test(str);
  }

  function renderKo(ko){
    if (!ko) return "";
    if (typeof ko === "string") return withIcons(ko);
    return ko.map(seg => {
      const cls = seg.tag === "chant" ? "seg-chant"
                : seg.tag === "clap"  ? "seg-clap"
                : "";
      return `<span class="${cls}">${withIcons(seg.text || "")}</span>`;
    }).join("");
  }

  // 한 줄의 ko / bg 조각들을 훑어서 그 줄에 떼창/박수가 포함돼 있는지 판단하고,
  // 해당하는 아이콘을 만들어 줍니다.
  // bg(코러스처럼 뒤에 깔리는 떼창)가 있으면 그 자체로 떼창으로 취급합니다.
  function lyricIconsHtml(line){
    const ko = line.ko, bg = line.bg;
    let hasChant = false, hasClap = false, wave = false;
    const scan = (arr) => {
      if (typeof arr === "string"){
        if (hasIconToken(arr, "wave")) wave = true;
        if (hasIconToken(arr, "clap")) hasClap = true;
        return;
      }
      if (!Array.isArray(arr)) return;
      arr.forEach(seg => {
        if (seg.tag === "chant") hasChant = true;
        else if (seg.tag === "clap") hasClap = true;
        if (hasIconToken(seg.text, "wave")) wave = true;
        if (hasIconToken(seg.text, "clap")) hasClap = true;
      });
    };
    scan(ko);
    // 일본어·해석 줄에만 아이콘을 적어도 왼쪽 표시가 붙도록 함께 확인
    [line.jp, line.tr].forEach(t => {
      if (hasIconToken(t, "wave")) wave = true;
      if (hasIconToken(t, "clap")) hasClap = true;
    });
    if (bg){
      hasChant = true;      // 코러스 떼창도 떼창
      scan(bg);
    }
    let html = "";
    // 박수·손 흔들기는 가사 안에 넣는 [clap] / [wave] 아이콘으로만 표시하고
    // 왼쪽 종류 표시에는 떼창만 남긴다.
    if (hasChant) html += `<span class="lyric-type-icon chant" title="떼창">${INLINE_ICONS.mic}</span>`;
    return html;
  }

  /* ── 화면 꺼짐 방지 ───────────────────────────────────────────
     곡 화면에서는 가사를 보는 동안 화면이 자동으로 꺼지지 않게 한다.
     지원하지 않는 브라우저(주로 iOS 구버전)에서는 조용히 넘어간다. */
  let wakeLock = null;
  async function requestWakeLock(){
    if (!("wakeLock" in navigator) || wakeLock) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
    } catch(e){ wakeLock = null; }
  }
  function releaseWakeLock(){
    if (!wakeLock) return;
    try { wakeLock.release(); } catch(e){}
    wakeLock = null;
  }
  // 다른 앱에 갔다 돌아오면 화면 잠금 해제가 풀리므로 다시 잡아 준다
  document.addEventListener("visibilitychange", ()=>{
    if (document.visibilityState === "visible" && songShellBuilt && isSongViewActive()) requestWakeLock();
  });

  /* ---------------- YouTube Player API 연동 ----------------
     플레이어는 페이지당 딱 하나. 처음 한 번만 만들고 곡이 바뀌면
     loadVideoById 로 영상만 갈아끼운다. 이렇게 해야 사용자가 곡을 탭한
     순간의 "재생 허가"가 유지되어 모바일에서도 소리가 바로 난다. */
  let playerReady   = false;
  let currentVideoId = null;    // 플레이어에 올라가 있는 영상
  let pendingVideoId = null;    // 플레이어 준비 전에 눌린 곡
  let userVolume     = 100;     // 사용자가 마지막으로 맞춰 둔 볼륨(곡이 바뀌어도 유지)
  let userMuted      = false;   // 사용자가 직접 음소거해 뒀는지
  let volumeWatchTimer = null;

  function ensurePlayer(){
    if (player || !window.YT || !window.YT.Player) return;
    buildSongShell();                       // #yt-player 자리 확보
    if (!document.getElementById("yt-player")) return;
    currentVideoId = (currentSong || SONGS[0]).youtubeId;
    player = new YT.Player('yt-player', {
      videoId: currentVideoId,
      playerVars: {
        'rel': 0,
        'playsinline': 1,                   // iOS 에서 전체화면으로 튀지 않게
        'modestbranding': 1,
        'autoplay': 0                       // 홈 화면에서 멋대로 소리 나지 않도록
      },
      events: {
        'onReady': onPlayerReady,
        'onStateChange': onPlayerStateChange
      }
    });
  }

  function onPlayerReady(){
    playerReady = true;
    try { player.unMute(); player.setVolume(userVolume); } catch(e){}
    startVolumeWatch();
    if (pendingVideoId) {                   // 준비되기 전에 고른 곡이 있으면 지금 재생
      const id = pendingVideoId;
      pendingVideoId = null;
      playVideoFor(id);
    }
  }

  /* ── 볼륨 기억하기 ────────────────────────────────────────────
     사용자가 플레이어에서 볼륨을 조절하면 그 값을 기억해 두었다가
     다음 곡에도 그대로 적용한다. (유튜브 API 에는 볼륨 변경 이벤트가
     없어서 주기적으로 확인하는 방식) */
  function startVolumeWatch(){
    if (volumeWatchTimer) return;
    volumeWatchTimer = setInterval(()=>{
      if (!player || !playerReady) return;
      try {
        const v = player.getVolume();
        const m = player.isMuted();
        if (typeof v === "number" && v > 0) userVolume = v;   // 0 은 음소거로 취급
        userMuted = !!m;
      } catch(e){}
    }, 800);
  }

  /* 지정한 영상을 즉시 재생. 볼륨은 사용자가 맞춰 둔 값을 그대로 유지한다.
     사용자 탭 핸들러 안에서 부르면 모바일에서도 소리가 그대로 난다. */
  function playVideoFor(videoId){
    if (!player || !playerReady) { pendingVideoId = videoId; return; }
    try {
      if (userMuted) player.mute();         // 사용자가 꺼 뒀으면 계속 꺼 둠
      else           player.unMute();
      player.setVolume(userVolume);         // 100 으로 되돌리지 않음
      if (currentVideoId === videoId) {
        player.seekTo(0, true);
        player.playVideo();
      } else {
        currentVideoId = videoId;
        player.loadVideoById(videoId);      // loadVideoById 는 바로 재생까지 함
      }
    } catch(e){}
  }

  /* 이미 그 곡이 재생 중이면 건드리지 않고, 아니면 재생시킨다.
     (곡을 탭 → 이미 playVideoFor 가 돌았으므로 여기서 다시 끊기지 않게) */
  function ensurePlaying(videoId){
    if (!player || !playerReady) { pendingVideoId = videoId; return; }
    if (currentVideoId === videoId) {
      let st = -1;
      try { st = player.getPlayerState(); } catch(e){}
      if (st === YT.PlayerState.PLAYING || st === YT.PlayerState.BUFFERING) return;
    }
    playVideoFor(videoId);
  }

  /* 재생 버튼 모양을 현재 상태에 맞춘다 */
  function updatePlayButton(){
    const btn = document.getElementById("play-toggle");
    if (!btn) return;
    let st = -1;
    try { st = player && player.getPlayerState(); } catch(e){}
    const playing = (st === 1 || st === 3);   // PLAYING / BUFFERING
    btn.innerHTML = playing ? PAUSE_SVG : PLAY_SVG;
    btn.classList.toggle("playing", playing);
    btn.setAttribute("aria-label", playing ? "일시정지" : "재생");
  }

  function onPlayerStateChange(event) {
    updatePlayButton();
    // 영상이 끝나면 다음 곡으로 (마지막 곡이면 첫 곡으로 되돌아감)
    if (event.data === YT.PlayerState.ENDED) {
      stopSyncTimer();
      goToNextSong();
      return;
    }

    // 재생 중(PLAYING = 1)일 때만 동기화 타이머 가동
    if (event.data === YT.PlayerState.PLAYING) {
      startSyncTimer();
    } else {
      stopSyncTimer();
      // 일시정지/탐색 시에도 위치에 맞춰 현재 가사 하이라이트 1회 갱신
      updateLyricsSync();
    }
  }

  /* 다음 곡으로. 마지막 곡이면 첫 곡으로 순환한다.
     (이미 재생 중인 iframe 을 그대로 쓰므로 소리도 이어서 난다) */
  function goToNextSong() {
    if (!currentSong || !isSongViewActive()) return;
    const next = songNeighbors(currentSong).next;

    // 곡이 하나뿐이면 해시가 그대로라 hashchange 가 안 뜨므로 직접 처음부터 재생
    if (next.id === currentSong.id) {
      playVideoFor(next.youtubeId);
      return;
    }
    gotoSong(next);
  }


  function startSyncTimer() {
    stopSyncTimer();
    syncTimer = setInterval(updateLyricsSync, SYNC_INTERVAL_MS);
  }

  function stopSyncTimer() {
    if (syncTimer) {
      clearInterval(syncTimer);
      syncTimer = null;
    }
  }

  function updateLyricsSync(force) {
    if (!player || typeof player.getCurrentTime !== 'function') return;
    const list = document.getElementById("lyrics-list");
    if (!list) return;

    // 실제 재생 위치보다 조금 앞선 시점을 기준으로 판단해 가사를 먼저 넘김
    const cur = player.getCurrentTime() + LYRIC_LEAD_SEC;
    const lines = list.querySelectorAll(".lyric-line");

    let activeIdx = -1;
    for (let i = 0; i < lines.length; i++) {
      if (cur >= Number(lines[i].dataset.time)) activeIdx = i;
      else break;                       // time 순서대로이므로 더 볼 필요 없음
    }

    // 활성 소절이 그대로면 DOM을 건드리지 않는다.
    // (매 틱마다 전체 줄을 갱신하고 smooth 스크롤을 다시 시작하던 것이 버벅임의 원인)
    if (activeIdx === lastActiveIdx && !force) return;

    if (lastActiveIdx >= 0 && lines[lastActiveIdx]) lines[lastActiveIdx].classList.remove("active");
    if (activeIdx >= 0 && lines[activeIdx]) lines[activeIdx].classList.add("active");
    lastActiveIdx = activeIdx;

    if (activeIdx >= 0 && autoScrollEnabled) {
      scrollLyricIntoView(lines[activeIdx]);
    }
  }

  /* 첫 소절·마지막 소절도 화면 한가운데에 놓이도록 가사 목록의 위아래에
     "빈 공간(패딩)"을 컨테이너 높이의 절반만큼 준다.
     이게 없으면 스크롤이 맨 위에서 더 내려갈 곳이 없어 첫 가사가 위에 붙는다. */
  function updateLyricsPadding(){
    const container = document.querySelector(".lyrics-scroll");
    const list = document.getElementById("lyrics-list");
    if (!container || !list) return;
    const first = list.querySelector(".lyric-line");
    const h = container.clientHeight;
    if (!first || !h) return;
    const half = h / 2 - first.getBoundingClientRect().height / 2;
    list.style.paddingTop    = Math.max(8, half) + "px";
    list.style.paddingBottom = Math.max(140, h / 2) + "px";
  }

  /* 화면 크기가 크게 바뀌면(회전 등) 가운데 기준도 달라지므로 다시 계산한다.
     모바일 주소창이 접히며 생기는 자잘한 높이 변화로는 다시 잡지 않는다
     — 사용자가 직접 가사를 넘겨 보는 중에 화면이 튀지 않도록. */
  let lastLyricsW = window.innerWidth, lastLyricsH = window.innerHeight;
  window.addEventListener("resize", ()=>{
    const w = window.innerWidth, h = window.innerHeight;
    const changed = (w !== lastLyricsW) || Math.abs(h - lastLyricsH) > 100;
    if (!changed) return;
    lastLyricsW = w; lastLyricsH = h;
    if (!songShellBuilt) return;
    updateLyricsPadding();
    if (isSongViewActive()) updateLyricsSync(true);
  });

  // 가사 컨테이너만 스크롤한다. scrollIntoView는 상위 스크롤 영역까지
  // 함께 움직여서 큰 화면 2단 레이아웃에서 화면이 흔들리는 원인이 됨.
  function scrollLyricIntoView(el) {
    const container = document.querySelector(".lyrics-scroll");
    if (!container || !el) return;
    const cRect = container.getBoundingClientRect();
    const eRect = el.getBoundingClientRect();
    const delta = (eRect.top - cRect.top) - (container.clientHeight / 2 - eRect.height / 2);
    const maxTop = container.scrollHeight - container.clientHeight;
    const top = Math.max(0, Math.min(maxTop, container.scrollTop + delta));
    // 이미 거의 제자리면 스크롤을 다시 걸지 않음
    if (Math.abs(top - container.scrollTop) < 4) return;
    animateScrollTo(container, top, SCROLL_DURATION_MS);
  }

  // behavior:"smooth" 는 속도를 조절할 수 없어(브라우저 고정, 보통 400~600ms)
  // 직접 애니메이션해서 SCROLL_DURATION_MS 만큼만 걸리도록 함
  function animateScrollTo(container, to, duration) {
    if (scrollRafId !== null) cancelAnimationFrame(scrollRafId);
    const from = container.scrollTop;
    const diff = to - from;
    if (duration <= 0) { container.scrollTop = to; return; }
    const start = performance.now();
    const step = (now) => {
      const p = Math.min(1, (now - start) / duration);
      // easeOutCubic — 처음에 빠르게 움직이고 부드럽게 멈춤
      const eased = 1 - Math.pow(1 - p, 3);
      container.scrollTop = from + diff * eased;
      if (p < 1) {
        scrollRafId = requestAnimationFrame(step);
      } else {
        scrollRafId = null;
      }
    };
    scrollRafId = requestAnimationFrame(step);
  }

  function seekTo(seconds) {
    if (player && typeof player.seekTo === 'function') {
      player.seekTo(seconds, true);
      player.playVideo();
    }
  }

  /* ── 오프라인 캐시 · 홈 화면 설치 · 안내 배너 ─────────────────
     서비스워커는 https 로 올렸을 때만 동작합니다.
     (파일을 그냥 열었을 때(file://)는 조용히 건너뜁니다) */
  const banner    = document.getElementById("app-banner");
  const bannerMsg = document.getElementById("app-banner-msg");
  const bannerBtn = document.getElementById("app-banner-action");
  const bannerX   = document.getElementById("app-banner-close");
  let bannerAction = null;

  function showBanner(html, btnLabel, onClick, kind){
    if (!banner) return;
    bannerMsg.innerHTML = html;
    bannerAction = onClick || null;
    bannerBtn.textContent = btnLabel || "";
    bannerBtn.style.display = btnLabel ? "" : "none";
    banner.classList.toggle("offline", kind === "offline");
    banner.classList.add("show");
  }
  function hideBanner(){ if (banner) banner.classList.remove("show"); }
  if (bannerBtn) bannerBtn.addEventListener("click", ()=>{ if (bannerAction) bannerAction(); });
  if (bannerX)   bannerX.addEventListener("click", hideBanner);

  /* 저장해 둔 값 읽고 쓰기 (사파리 프라이빗 모드 등에서 막혀도 문제없게) */
  function store(key, value){
    try {
      if (value === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, value);
    } catch(e){ return null; }
  }

  /* 1) 서비스워커 등록 — 오프라인에서도 가사가 열리게 */
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("./sw.js").then((reg)=>{
        reg.addEventListener("updatefound", ()=>{
          const sw = reg.installing;
          if (!sw) return;
          sw.addEventListener("statechange", ()=>{
            // 이미 쓰고 있는 상태에서 새 버전이 준비된 경우에만 안내
            if (sw.state === "installed" && navigator.serviceWorker.controller){
              showBanner("<b>새 버전</b>이 준비됐어요. 가사가 업데이트됐을 수 있어요.",
                         "새로고침",
                         ()=>{ sw.postMessage({ type:"SKIP_WAITING" }); });
            }
          });
        });
      }).catch(()=>{});

      let reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", ()=>{
        if (reloading) return;
        reloading = true;
        location.reload();
      });
    });
  }

  /* 2) 오프라인이 되면 알려 주기 — 가사는 되지만 영상은 안 된다는 안내 */
  function updateOnlineState(){
    if (!navigator.onLine){
      showBanner("<b>오프라인</b> 상태예요. 가사와 응원 표시는 그대로 볼 수 있지만, 영상 재생은 안 됩니다.",
                 "", null, "offline");
    } else if (banner && banner.classList.contains("offline")){
      hideBanner();
    }
  }
  window.addEventListener("online",  updateOnlineState);
  window.addEventListener("offline", updateOnlineState);

  /* 3) 아이폰은 설치 안내가 자동으로 뜨지 않으므로 한 번만 알려 줌 */
  function maybeShowInstallHint(){
    if (!navigator.onLine) return;                      // 오프라인 안내가 우선
    if (store("horo-install-hint") === "done") return;  // 이미 본 사람
    const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
    if (standalone) return;                             // 이미 홈 화면에서 실행 중
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (!isIOS) return;
    showBanner("공유 버튼 <b>⎋</b> → <b>홈 화면에 추가</b> 를 누르면 앱처럼 쓸 수 있어요.",
               "알겠어요",
               ()=>{ store("horo-install-hint", "done"); hideBanner(); });
  }

  /* 안드로이드 크롬 — 설치 배너를 직접 띄움 */
  let deferredInstall = null;
  window.addEventListener("beforeinstallprompt", (e)=>{
    e.preventDefault();
    deferredInstall = e;
    if (store("horo-install-hint") === "done") return;
    showBanner("홈 화면에 <b>설치</b>하면 공연장에서 바로 열 수 있어요.",
               "설치",
               async ()=>{
                 hideBanner();
                 store("horo-install-hint", "done");
                 try { deferredInstall.prompt(); await deferredInstall.userChoice; } catch(err){}
                 deferredInstall = null;
               });
  });
  window.addEventListener("appinstalled", ()=>{ store("horo-install-hint", "done"); hideBanner(); });

  setTimeout(()=>{ updateOnlineState(); maybeShowInstallHint(); }, 1500);

  window.addEventListener("hashchange", router);

  // 유튜브 API 가 준비되는 대로 플레이어를 미리 만들어 둔다.
  // (곡을 탭한 순간 곧바로 재생을 걸 수 있어야 모바일에서 소리가 난다)
  if (window.YT && window.YT.Player) ensurePlayer();
  else window.onYouTubeIframeAPIReady = ensurePlayer;

  router();
</script>
</body>
</html>
