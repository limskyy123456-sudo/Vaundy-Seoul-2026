<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이동 중…</title>
<link rel="canonical" href="https://vaundyball-engawa.netlify.app/">
<meta name="robots" content="noindex">
<!-- 자바스크립트가 막혀 있어도 0.5초 뒤에 넘어갑니다 -->
<meta http-equiv="refresh" content="0.5;url=https://vaundyball-engawa.netlify.app/">
<style>
  :root{ color-scheme: dark; }
  body{
    margin:0; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    background:#141210; color:#e9d9a3;
    font:15px/1.7 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    text-align:center; padding:24px;
  }
  a{ color:#5ecdc4; }
  .box{ max-width:420px; }
  .dim{ color:#a5947a; font-size:13px; margin-top:10px; }
</style>
</head>
<body>
  <div class="box">
    <p>새 페이지로 이동하고 있어요…</p>
    <p class="dim">바로 넘어가지 않으면
      <a id="go" href="https://vaundyball-engawa.netlify.app/">여기를 눌러 주세요</a>.
    </p>
  </div>
<script>
  var TARGET = "https://vaundyball-engawa.netlify.app/";

  /* 예전에 설치된 서비스워커·캐시를 지운다.
     (앱으로 설치해 둔 사람은 이게 없으면 옛 화면이 계속 뜬다) */
  function cleanup(){
    var jobs = [];
    try {
      if ("serviceWorker" in navigator) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
          return Promise.all(rs.map(function(r){ return r.unregister(); }));
        }).catch(function(){}));
      }
      if (window.caches && caches.keys) {
        jobs.push(caches.keys().then(function(ks){
          return Promise.all(ks.map(function(k){ return caches.delete(k); }));
        }).catch(function(){}));
      }
    } catch(e){}
    return Promise.all(jobs).catch(function(){});
  }

  /* 정리는 최대 1.2초만 기다리고, 그 뒤엔 무조건 넘어간다 */
  var moved = false;
  function go(){ if (moved) return; moved = true; location.replace(TARGET); }
  setTimeout(go, 1200);
  cleanup().then(go);
</script>
</body>
</html>
