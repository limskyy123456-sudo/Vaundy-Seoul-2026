<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAUNDY ASIA ARENA TOUR 2026 "HORO" — SEOUL 떼창 가이드</title>
<meta name="theme-color" content="#2a0a06">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Anton&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#230805;
    --bg-mid:#7a2712;
    --bg-glow:#c8462a;
    --ink:#170504;
    --gold:#e9d9a3;
    --gold-soft:#cdb87c;
    --teal:#5ecdc4;
    --sky:#3f8fd6;
    --cream:#f6efd9;
    --line:rgba(233,217,163,0.18);
    --chant:#f5942c;
    --clap:#4fa8e0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-deep);
    color:var(--cream);
    font-family:'Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--teal);color:var(--ink);}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- utility ---------- */
  .eyebrow{
    font-family:'Anton',sans-serif;
    letter-spacing:.28em;
    font-size:13px;
    color:var(--gold);
    text-transform:uppercase;
    text-shadow:0 1px 6px rgba(0,0,0,0.85), 0 0 20px rgba(0,0,0,0.6);
  }

  /* ---------- HERO / HOME ---------- */
  .hero{
    position:relative;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:56px 20px 40px;
    background:
      radial-gradient(120% 70% at 50% 8%, rgba(200,70,42,0.55), transparent 60%),
      radial-gradient(140% 90% at 50% 100%, rgba(122,39,18,0.9), transparent 70%),
      linear-gradient(180deg, #170504 0%, #2c0a06 30%, #7a2712 78%, #3a0d08 100%);
    background-image:
      radial-gradient(120% 70% at 50% 8%, rgba(200,70,42,0.55), transparent 60%),
      radial-gradient(140% 90% at 50% 100%, rgba(122,39,18,0.9), transparent 70%),
      url('images/poster.jpg'),
      linear-gradient(180deg, #170504 0%, #2c0a06 30%, #7a2712 78%, #3a0d08 100%);
    background-size:cover,cover,cover,cover;
    background-position:center,center,center 42%,center;
    background-repeat:no-repeat;
    text-align:center;
    isolation:isolate;
  }
  .hero::after{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(23,5,4,0.42) 0%, rgba(23,5,4,0.38) 30%, rgba(23,5,4,0.66) 60%, rgba(15,4,3,0.97) 100%);
    z-index:0;
  }
  .hero-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:560px;}

  .tour-title{
    margin:14px 0 0;
    font-family:'Anton',sans-serif;
    font-size:clamp(30px,7vw,44px);
    letter-spacing:.03em;
    color:var(--gold);
    text-shadow:0 2px 8px rgba(0,0,0,0.9), 0 0 28px rgba(0,0,0,0.65);
    line-height:1.08;
  }
  .tour-title span{display:block;font-size:.5em;letter-spacing:.34em;color:var(--gold);margin-bottom:6px;}

  .countdown-label{
    margin-top:30px;
    font-family:'Black Han Sans',sans-serif;
    font-size:15px;
    letter-spacing:.18em;
    color:var(--gold);
    text-shadow:0 1px 6px rgba(0,0,0,0.85);
  }
  .countdown{
    display:flex;
    gap:clamp(6px,2vw,12px);
    margin-top:16px;
    width:100%;
    max-width:400px;
    justify-content:center;
  }
  .cd-box{
    background:rgba(20,6,4,0.55);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 4px 13px;
    flex:1 1 0;
    min-width:0;
    max-width:88px;
    backdrop-filter:blur(3px);
    box-shadow:0 6px 20px rgba(0,0,0,0.45);
  }
  .cd-num{
    font-family:'Anton',sans-serif;
    font-size:clamp(34px,9vw,46px);
    line-height:1;
    color:#fff;
    font-variant-numeric:tabular-nums;
    text-shadow:0 2px 10px rgba(0,0,0,0.8);
  }
  .cd-unit{
    margin-top:8px;
    font-size:11px;
    letter-spacing:.22em;
    color:var(--gold);
    text-shadow:0 1px 5px rgba(0,0,0,0.8);
  }
  .countdown-done{
    margin-top:16px;
    font-family:'Black Han Sans',sans-serif;
    font-size:22px;
    color:var(--teal);
    letter-spacing:.06em;
    text-shadow:0 2px 10px rgba(0,0,0,0.8);
  }

  .show-meta{
    margin-top:64px;
    font-family:'Anton',sans-serif;
    letter-spacing:.04em;
  }
  .show-date{
    font-size:clamp(20px,5.4vw,26px);
    color:#fff;
    text-shadow:0 2px 10px rgba(0,0,0,0.85);
  }
  .show-venue{
    margin-top:2px;
    font-size:clamp(14px,3.6vw,16px);
    color:var(--gold);
    letter-spacing:.14em;
    text-shadow:0 1px 6px rgba(0,0,0,0.85);
  }

  .main-menu{
    position:relative;z-index:1;
    margin-top:46px;
  }
  .menu-btn{
    display:flex;flex-direction:column;align-items:center;
    background:rgba(246,239,217,0.06);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 56px;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
    transition:background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .menu-btn:hover, .menu-btn:focus-visible{
    background:linear-gradient(90deg, rgba(94,205,196,0.14), rgba(63,143,214,0.10));
    border-color:var(--teal);
    transform:translateY(-2px);
    outline:none;
  }
  .menu-btn-label{
    font-family:'Anton',sans-serif;
    font-size:26px;
    letter-spacing:.06em;
    color:#fff;
    text-shadow:0 2px 10px rgba(0,0,0,0.8);
  }

  /* ---------- SONG LIST / GUIDE ---------- */
  .guide-page{
    min-height:100svh;
    position:relative;
    background:
      linear-gradient(180deg, rgba(15,4,3,0.90) 0%, rgba(15,4,3,0.94) 100%),
      url('images/poster-guide.jpg') center 30%/cover no-repeat,
      linear-gradient(180deg,#170504 0%, #0f0403 100%);
  }
  .songs-section{
    background:none;
    padding:36px 20px 80px;
  }
  .songs-head{
    max-width:640px;margin:0 auto 26px;
    text-align:center;
  }
  .songs-head h2{
    font-family:'Black Han Sans',sans-serif;
    font-size:clamp(22px,6vw,28px);
    margin:10px 0 6px;
    letter-spacing:.02em;
  }
  .songs-head p{
    margin:0;
    font-size:13px;
    color:#b9a98a;
  }
  .song-list{
    max-width:640px;margin:0 auto;
    list-style:none;padding:0;
    border-top:1px solid var(--line);
  }
  .song-row{
    width:100%;
    display:flex;align-items:center;gap:16px;
    background:none;border:none;border-bottom:1px solid var(--line);
    color:var(--cream);
    padding:20px 6px;
    cursor:pointer;
    text-align:left;
    transition:background .2s ease, padding-left .2s ease;
  }
  .song-row:hover, .song-row:focus-visible{
    background:linear-gradient(90deg, rgba(94,205,196,0.10), transparent 70%);
    padding-left:14px;
    outline:none;
  }
  .song-title{
    flex:1;
    font-family:'Noto Sans KR',sans-serif;
    font-weight:500;
    font-size:clamp(16px,4.4vw,18px);
    letter-spacing:0;
    line-height:1.45;
    color:var(--cream);
  }
  .song-arrow{
    font-family:'Anton',sans-serif;
    font-size:18px;
    background:linear-gradient(90deg,var(--teal),var(--sky));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    flex:none;
  }

  .credits{
    text-align:center;
    padding:30px 20px 60px;
    font-size:11px;
    color:#7a6a52;
    letter-spacing:.08em;
  }

  /* ---------- SONG DETAIL PAGE ---------- */
  .song-page{
    height:100svh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:
      linear-gradient(180deg, rgba(15,4,3,0.90) 0%, rgba(23,5,4,0.94) 100%),
      var(--song-cover, url('images/poster-song.jpg')) center 30%/cover no-repeat,
      linear-gradient(180deg,#170504 0%, #260906 100%);
  }
  .song-body{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  .song-fixed-top{
    flex:none;
  }
  .song-topbar{
    display:flex;align-items:center;gap:14px;
    padding:16px 18px;
    background:rgba(23,5,4,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .back-btn{
    background:none;border:1px solid var(--line);color:var(--cream);
    border-radius:999px;
    padding:8px 14px;
    font-size:13px;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .back-btn:hover{border-color:var(--teal);color:var(--teal);}
  .song-topbar h1{
    font-family:'Black Han Sans',sans-serif;
    font-size:clamp(16px,4.6vw,20px);
    margin:0;
    flex:1;
    text-align:center;
    padding-right:64px; /* balance back button */
  }

  .video-wrap{
    max-width:720px;margin:22px auto 0;padding:0 16px;
  }
  .video-frame{
    position:relative;width:100%;padding-top:56.25%;
    border-radius:12px;overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,0.5);
    border:1px solid var(--line);
    background:#000;
  }
  .video-frame iframe, .video-frame div{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .watch-on-yt{
    display:inline-block;
    margin-top:8px;
    font-size:11px;
    color:#8d7d62;
    text-decoration:none;
  }
  .watch-on-yt:hover{color:var(--teal);}

  .lyrics-note{
    max-width:720px;margin:16px auto 0;padding:0 16px;
    font-size:12px;color:#b9a98a;
    display:flex;gap:8px;align-items:flex-start;
  }
  .lyrics-note .dot{color:var(--teal);}

  .lyrics-legend{
    max-width:720px;margin:14px auto 12px;padding:0 16px;
    display:flex;gap:18px;flex-wrap:wrap;
  }
  .legend-item{
    display:flex;align-items:center;gap:7px;
    font-size:12px;color:#cbb99b;
  }
  .legend-icon{
    width:20px;height:20px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .legend-icon svg{width:12px;height:12px;}
  .legend-icon.chant{background:rgba(245,148,44,0.16);color:var(--chant);}
  .legend-icon.clap{background:rgba(79,168,224,0.16);color:var(--clap);}

  .lyrics-scroll{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    border-top:1px solid var(--line);
  }
  .lyrics-list{
    max-width:720px;margin:10px auto 0;padding:8px 10px 140px;
    list-style:none;
  }
  .lyric-line{
    width:100%;
    display:flex;
    gap:10px;
    align-items:flex-start;
    background:none;border:none;
    padding:13px 10px;
    border-radius:10px;
    text-align:left;
    cursor:pointer;
    transition:background .18s ease, transform .18s ease;
  }
  .lyric-line:hover{background:rgba(246,239,217,0.06);}
  /* 각 가사 줄에 포함된 파트 종류를 아이콘으로 표시 (떼창/박수/둘 다) */
  .lyric-icons{
    flex:none;
    display:flex;
    flex-direction:column;
    gap:4px;
    width:22px;
    padding-top:2px;
  }
  .lyric-type-icon{
    width:22px;height:22px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .lyric-type-icon svg{width:13px;height:13px;}
  .lyric-type-icon.chant{background:rgba(245,148,44,0.16);color:var(--chant);}
  .lyric-type-icon.clap{background:rgba(79,168,224,0.16);color:var(--clap);}
  .lyric-body{min-width:0;display:block;flex:1;}
  .lyric-jp{
    display:block;
    font-size:clamp(13px,3.6vw,14px);
    color:#a99a80;
    line-height:1.5;
  }
  .lyric-ko{
    display:block;
    font-size:clamp(15px,4.2vw,17px);
    font-weight:800;
    line-height:1.5;
    color:var(--cream);
  }
  .lyric-tr{
    display:block;
    font-size:clamp(12px,3.4vw,13px);
    color:#8d7d62;
    line-height:1.5;
    margin-top:1px;
  }
  /* 4번째 줄 — 코러스처럼 뒤에 깔리는 떼창 (백킹 코러스) */
  .lyric-bg{
    display:block;
    margin-top:3px;
    font-size:clamp(13px,3.6vw,15px);
    font-weight:700;
    line-height:1.5;
    color:var(--chant);
    font-style:italic;
  }
  .seg-chant{color:var(--chant);}
  .seg-clap{color:var(--clap);}
  /* 떼창 + 박수 동시: 주황 글자 + 파란 밑줄로 두 가지를 함께 표시 */
  .seg-both{
    color:var(--chant);
    border-bottom:2px solid var(--clap);
    padding-bottom:1px;
  }

  .lyric-line.active{
    background:linear-gradient(90deg, rgba(94,205,196,0.14), rgba(63,143,214,0.08));
    transform:translateX(2px);
  }

  .player-controls{
    position:fixed;
    right:18px;bottom:22px;
    z-index:20;
    display:flex;flex-direction:column;align-items:flex-end;gap:10px;
  }

  .autoscroll-toggle{
    display:flex;align-items:center;gap:7px;
    background:linear-gradient(180deg, #2c130c, #1c0a06);
    border:1px solid var(--chant);
    border-radius:999px;
    padding:5px 5px 5px 10px;
    cursor:pointer;
    box-shadow:0 3px 9px rgba(0,0,0,0.45);
    transition:opacity .18s ease, transform .12s ease;
  }
  .autoscroll-toggle:active{transform:scale(0.97);}
  .autoscroll-toggle:not(.active){opacity:.55;}
  .autoscroll-label{
    font-family:'Anton',sans-serif;
    letter-spacing:.05em;
    font-size:8px;
    color:var(--chant);
    white-space:nowrap;
  }
  .autoscroll-switch{
    width:22px;height:13px;flex:none;
    border-radius:999px;
    background:#160a06;
    border:1px solid var(--chant);
    position:relative;
    transition:background .2s ease;
  }
  .autoscroll-knob{
    position:absolute;top:1px;left:1px;
    width:10px;height:10px;
    border-radius:50%;
    background:#8d8f93;
    box-shadow:0 1px 2px rgba(0,0,0,0.5);
    transition:transform .2s ease, background .2s ease;
  }
  .autoscroll-toggle.active .autoscroll-switch{background:#241109;}
  .autoscroll-toggle.active .autoscroll-knob{
    transform:translateX(9px);
    background:#aab6c9;
  }

  #app{min-height:100svh;}
  @media (min-width:720px){
    .hero{padding-top:72px;}
  }

  /* ---------- PC 등 큰 화면: 영상 왼쪽 / 가사 오른쪽 2단 ---------- */
  @media (min-width:900px){
    .song-body{
      flex-direction:row;
      align-items:stretch;
    }
    .song-fixed-top{
      flex:1 1 62%;
      min-width:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      overflow-y:auto;
      padding:16px 0 24px;
    }
    .song-fixed-top .video-wrap{
      margin-top:0;
      width:100%;
      /* 가로는 컬럼 폭 전체를 쓰되, 세로가 화면을 넘지 않도록 16:9 기준으로 제한 */
      max-width:min(100%, calc((100svh - 250px) * 16 / 9));
      padding:0 24px;
    }
    .lyrics-scroll{
      flex:1 1 38%;
      min-width:0;
      border-top:none;
      border-left:1px solid var(--line);
    }
    .lyrics-list{
      margin-top:0;
      padding:16px 18px 140px;
    }
    /* 2단일 때는 가사 영역이 따로 스크롤되므로 하단 여백을 줄임 */
    .player-controls{
      bottom:26px;
    }
  }

  /* 아주 넓은 화면에서는 영상 비중을 조금 더 키움 */
  @media (min-width:1400px){
    .song-fixed-top{flex:1 1 66%;}
    .lyrics-scroll{flex:1 1 34%;}
    .song-fixed-top .video-wrap{padding:0 36px;}
  }
</style>
<!-- YouTube IFrame Player API 스크립트 추가 -->
<script src="https://www.youtube.com/iframe_api"></script>
</head>

<body>
<div id="app"></div>

<script>
  const SHOW_DATETIME = "2026-09-19T17:00:00+09:00";

  /* 가사 한 줄의 형식
     {
       time: 12.5,              // 영상에서 이 소절이 시작되는 시점(초)
       jp:   "일본어 원문",
       ko:   "한글 발음",        // 문자열이면 전체 기본색
             // 또는 배열로 구간별 색 지정:
             // [{ text:"떼창구간", tag:"chant" },   ← 주황(떼창)
             //  { text:"박수구간", tag:"clap"  },   ← 파랑(박수)
             //  { text:"동시구간", tag:"both"  },   ← 주황글자+파란밑줄
             //  { text:"기본색구간" }]              ← tag 생략
       tr:   "한국어 해석",
       bg:   "코러스 떼창"        // (선택) 4번째 줄 — 코러스처럼 뒤에 깔리는 떼창
             // ko와 동일하게 문자열 또는 배열 모두 사용 가능.
             // bg가 있으면 그 줄에는 자동으로 떼창 아이콘이 붙습니다.
     }
     실제 가사·발음·해석은 저작권이 있으니 직접 입력해 주세요. */

  const SONGS = [
    {
      id: "Tokimeki",
      title: "두근거림 (ときめき)",
      youtubeId: "-_PKhPMXMDY", // ← 실제 유튜브 영상 ID로 교체
      lyrics: [
        { time: 0, jp: "目に映るのは 確かなときめきで光る魔法",        ko: [{ text: "메니 우츠루노와 타시카나 토키메키데 히카루 마호", tag: "clap" }],                                                     tr: "눈에 비치는 것은 확실한 두근거림으로 빛나는 마법" },
        { time: 9, jp: "思い当たるのは 誰かの 涙が落ちる音",        ko: [{ text: "오모이아타루노와 다레카노 나미다가 오치루 오토", tag: "clap" }],                                                     tr: "마음에 짚이는 것은 누군가의 눈물이 떨어지는 소리" },
        { time: 17, jp: "Hu Hu Hu Ya Ya x3",        ko: [{ text: "Hu Hu Hu Ya Ya x3", tag: "chant" }],                                                    tr: "Hu Hu Hu Ya Ya x3" },
        { time: 22.5, jp: "それは、軽やかな魔法 Hu Hu Hu Ya Ya x2", ko: [{ text: "소레와 카로야카나 마호-" }, { text: " Hu Hu Hu Ya Ya x2", tag: "chant" }],               tr: "그것은 경쾌한 마법 Hu Hu Hu Ya Ya x2" },

        return;
      }
      const d = Math.floor(diff/86400000);
      const h = Math.floor(diff%86400000/3600000);
      const m = Math.floor(diff%3600000/60000);
      const s = Math.floor(diff%60000/1000);
      const dd=document.getElementById("cd-d"), hh=document.getElementById("cd-h"),
            mm=document.getElementById("cd-m"), ss=document.getElementById("cd-s");
      if(dd){dd.textContent=pad(d); hh.textContent=pad(h); mm.textContent=pad(m); ss.textContent=pad(s);}
    }
    tick();
    countdownTimer = setInterval(tick, 1000);
  }
  function stopCountdown(){ if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; } }

  /* ---------------- SONG DETAIL ---------------- */
  const MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
  const CLAP_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V7a2 2 0 0 1 4 0"/><path d="M12 13V5a2 2 0 0 1 4 0v8"/><path d="M16 13V7a2 2 0 0 1 4 0v6a7 7 0 0 1-7 7h-1a7 7 0 0 1-6.3-4"/><path d="M4 12l1-1"/><path d="M3 9l1.5-.5"/><path d="M4 6l1 1"/></svg>';

  function renderSong(song){
    currentSong = song;
    lastActiveIdx = -1;
    app.innerHTML = `
      <div class="song-page"${song.cover ? ` style="--song-cover:url('${song.cover}')"` : ""}>
        <div class="song-topbar">
          <button class="back-btn" id="back-btn">← 목록</button>
          <h1>${escapeHtml(song.title)}</h1>
        </div>

        <div class="song-body">
          <div class="song-fixed-top">
            <div class="video-wrap">
              <div class="video-frame">
                <div id="yt-player"></div>
              </div>
              <a class="watch-on-yt" href="https://www.youtube.com/watch?v=${encodeURIComponent(song.youtubeId)}" target="_blank" rel="noopener">유튜브에서 보기 ↗</a>
            </div>

            <div class="lyrics-note"><span class="dot">●</span> 가사를 탭하면 해당 위치로 영상이 이동해요. 영상 재생 상태에 따라 가사 하이라이트가 동기화됩니다.</div>

            <div class="lyrics-legend">
              <span class="legend-item"><span class="legend-icon chant">${MIC_SVG}</span>떼창</span>
              <span class="legend-item"><span class="legend-icon clap">${CLAP_SVG}</span>박수</span>
              <span class="legend-item"><span class="legend-icon chant">${MIC_SVG}</span><span class="legend-icon clap">${CLAP_SVG}</span>떼창+박수</span>
            </div>
          </div>

          <div class="lyrics-scroll">
          <ul class="lyrics-list" id="lyrics-list">
            ${song.lyrics.map((l,i)=>{
              return `
              <li>
                <button class="lyric-line" data-time="${l.time}" data-idx="${i}">
                  <span class="lyric-icons">${lyricIconsHtml(l.ko, l.bg)}</span>
                  <span class="lyric-body">
                    <span class="lyric-jp">${escapeHtml(l.jp || "")}</span>
                    <span class="lyric-ko">${renderKo(l.ko)}</span>
                    <span class="lyric-tr">${escapeHtml(l.tr || "")}</span>
                    ${l.bg ? `<span class="lyric-bg">${renderKo(l.bg)}</span>` : ""}
                  </span>
                </button>
              </li>`;
            }).join("")}
          </ul>
          </div>
        </div>

        <div class="player-controls">
          <button class="autoscroll-toggle${autoScrollEnabled ? " active" : ""}" id="autoscroll-btn" aria-label="자동 스크롤 켜기/끄기">
            <span class="autoscroll-label">AUTO SCROLL</span>
            <span class="autoscroll-switch"><span class="autoscroll-knob"></span></span>
          </button>
        </div>
      </div>
    `;

    document.getElementById("back-btn").addEventListener("click", ()=>{ location.hash = "#/guide"; });

    document.querySelectorAll(".lyric-line").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const t = Number(btn.dataset.time);
        seekTo(t);
      });
    });

    document.getElementById("autoscroll-btn").addEventListener("click", (e)=>{
      autoScrollEnabled = !autoScrollEnabled;
      e.currentTarget.classList.toggle("active", autoScrollEnabled);
      if (autoScrollEnabled) updateLyricsSync(true);   // 켜는 즉시 현재 위치로 이동
    });

    initYoutubePlayer(song.youtubeId);
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function renderKo(ko){
    if (!ko) return "";
    if (typeof ko === "string") return escapeHtml(ko);
    return ko.map(seg => {
      const cls = seg.tag === "chant" ? "seg-chant"
                : seg.tag === "clap"  ? "seg-clap"
                : seg.tag === "both"  ? "seg-both"
                : "";
      return `<span class="${cls}">${escapeHtml(seg.text || "")}</span>`;
    }).join("");
  }

  // 한 줄의 ko / bg 조각들을 훑어서 그 줄에 떼창/박수가 포함돼 있는지 판단하고,
  // 해당하는 아이콘을 만들어 줍니다. ("both"는 떼창·박수 둘 다로 취급)
  // bg(코러스처럼 뒤에 깔리는 떼창)가 있으면 그 자체로 떼창으로 취급합니다.
  function lyricIconsHtml(ko, bg){
    let hasChant = false, hasClap = false;
    const scan = (arr) => {
      if (!Array.isArray(arr)) return;
      arr.forEach(seg => {
        if (seg.tag === "chant") hasChant = true;
        else if (seg.tag === "clap") hasClap = true;
        else if (seg.tag === "both"){ hasChant = true; hasClap = true; }
      });
    };
    scan(ko);
    if (bg){
      hasChant = true;      // 코러스 떼창도 떼창
      scan(bg);
    }
    let html = "";
    if (hasChant) html += `<span class="lyric-type-icon chant" title="떼창">${MIC_SVG}</span>`;
    if (hasClap)  html += `<span class="lyric-type-icon clap" title="박수">${CLAP_SVG}</span>`;
    return html;
  }

  /* ---------------- YouTube Player API 연동 ---------------- */
  function initYoutubePlayer(videoId) {
    if (window.YT && window.YT.Player) {
      createPlayer(videoId);
    } else {
      window.onYouTubeIframeAPIReady = () => createPlayer(videoId);
    }
  }

  function createPlayer(videoId) {
    player = new YT.Player('yt-player', {
      videoId: videoId,
      playerVars: {
        'rel': 0,
        'playsinline': 1,
        'modestbranding': 1
      },
      events: {
        'onStateChange': onPlayerStateChange
      }
    });
  }

  function onPlayerStateChange(event) {
    // 재생 중(PLAYING = 1)일 때만 동기화 타이머 가동
    if (event.data === YT.PlayerState.PLAYING) {
      startSyncTimer();
    } else {
      stopSyncTimer();
      // 일시정지/탐색 시에도 위치에 맞춰 현재 가사 하이라이트 1회 갱신
      updateLyricsSync();
    }
  }

  function startSyncTimer() {
    stopSyncTimer();
    syncTimer = setInterval(updateLyricsSync, 200);
  }

  function stopSyncTimer() {
    if (syncTimer) {
      clearInterval(syncTimer);
      syncTimer = null;
    }
  }

  function updateLyricsSync(force) {
    if (!player || typeof player.getCurrentTime !== 'function') return;
    const list = document.getElementById("lyrics-list");
    if (!list) return;

    const cur = player.getCurrentTime();
    const lines = list.querySelectorAll(".lyric-line");

    let activeIdx = -1;
    for (let i = 0; i < lines.length; i++) {
      if (cur >= Number(lines[i].dataset.time)) activeIdx = i;
      else break;                       // time 순서대로이므로 더 볼 필요 없음
    }

    // 활성 소절이 그대로면 DOM을 건드리지 않는다.
    // (매 200ms마다 전체 줄을 갱신하고 smooth 스크롤을 다시 시작하던 것이 버벅임의 원인)
    if (activeIdx === lastActiveIdx && !force) return;

    if (lastActiveIdx >= 0 && lines[lastActiveIdx]) lines[lastActiveIdx].classList.remove("active");
    if (activeIdx >= 0 && lines[activeIdx]) lines[activeIdx].classList.add("active");
    lastActiveIdx = activeIdx;

    if (activeIdx >= 0 && autoScrollEnabled) {
      scrollLyricIntoView(lines[activeIdx]);
    }
  }

  // 가사 컨테이너만 스크롤한다. scrollIntoView는 상위 스크롤 영역까지
  // 함께 움직여서 큰 화면 2단 레이아웃에서 화면이 흔들리는 원인이 됨.
  function scrollLyricIntoView(el) {
    const container = document.querySelector(".lyrics-scroll");
    if (!container || !el) return;
    const cRect = container.getBoundingClientRect();
    const eRect = el.getBoundingClientRect();
    const delta = (eRect.top - cRect.top) - (container.clientHeight / 2 - eRect.height / 2);
    const top = Math.max(0, container.scrollTop + delta);
    // 이미 거의 제자리면 스크롤을 다시 걸지 않음
    if (Math.abs(top - container.scrollTop) < 4) return;
    container.scrollTo({ top, behavior: "smooth" });
  }

  function seekTo(seconds) {
    if (player && typeof player.seekTo === 'function') {
      player.seekTo(seconds, true);
      player.playVideo();
    }
  }

  function destroyPlayer() {
    stopSyncTimer();
    if (player && typeof player.destroy === 'function') {
      player.destroy();
      player = null;
    }
  }

  window.addEventListener("hashchange", router);
  router();
</script>
</body>
