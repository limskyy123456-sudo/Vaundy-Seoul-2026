<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAUNDY ASIA ARENA TOUR 2026 "HORO" — SEOUL 떼창 가이드</title>
<meta name="theme-color" content="#2a0a06">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Anton&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#230805;
    --bg-mid:#7a2712;
    --bg-glow:#c8462a;
    --ink:#170504;
    --gold:#e9d9a3;
    --gold-soft:#cdb87c;
    --teal:#5ecdc4;
    --sky:#3f8fd6;
    --cream:#f6efd9;
    --line:rgba(233,217,163,0.18);
    --chant:#f5942c;
    --clap:#4fa8e0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-deep);
    color:var(--cream);
    font-family:'Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--teal);color:var(--ink);}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- utility ---------- */
  .eyebrow{
    font-family:'Anton',sans-serif;
    letter-spacing:.28em;
    font-size:13px;
    color:var(--gold-soft);
    text-transform:uppercase;
  }

  /* ---------- HERO / HOME ---------- */
  .hero{
    position:relative;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:56px 20px 40px;
    background:
      radial-gradient(120% 70% at 50% 8%, rgba(200,70,42,0.55), transparent 60%),
      radial-gradient(140% 90% at 50% 100%, rgba(122,39,18,0.9), transparent 70%),
      linear-gradient(180deg, #170504 0%, #2c0a06 30%, #7a2712 78%, #3a0d08 100%);
    background-image:
      radial-gradient(120% 70% at 50% 8%, rgba(200,70,42,0.55), transparent 60%),
      radial-gradient(140% 90% at 50% 100%, rgba(122,39,18,0.9), transparent 70%),
      url('images/poster.jpg'),
      linear-gradient(180deg, #170504 0%, #2c0a06 30%, #7a2712 78%, #3a0d08 100%);
    background-size:cover,cover,cover,cover;
    background-position:center,center,center 42%,center;
    background-repeat:no-repeat;
    text-align:center;
    isolation:isolate;
  }
  .hero::after{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(23,5,4,0.15) 0%, rgba(23,5,4,0.15) 35%, rgba(23,5,4,0.55) 62%, rgba(15,4,3,0.96) 100%);
    z-index:0;
  }
  .hero-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:560px;}

  .tour-title{
    margin:14px 0 0;
    font-family:'Anton',sans-serif;
    font-size:clamp(30px,7vw,44px);
    letter-spacing:.03em;
    color:var(--gold);
    text-shadow:0 2px 18px rgba(0,0,0,0.5);
    line-height:1.08;
  }
  .tour-title span{display:block;font-size:.5em;letter-spacing:.34em;color:var(--gold-soft);margin-bottom:6px;}

  .countdown-label{
    margin-top:30px;
    font-family:'Black Han Sans',sans-serif;
    font-size:14px;
    letter-spacing:.18em;
    color:var(--gold-soft);
  }
  .countdown{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  .cd-box{
    background:rgba(246,239,217,0.06);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 6px 10px;
    width:70px;
    backdrop-filter:blur(2px);
  }
  .cd-num{
    font-family:'Anton',sans-serif;
    font-size:clamp(26px,7vw,34px);
    line-height:1;
    color:var(--cream);
    font-variant-numeric:tabular-nums;
  }
  .cd-unit{
    margin-top:6px;
    font-size:10px;
    letter-spacing:.22em;
    color:var(--gold-soft);
  }
  .countdown-done{
    margin-top:16px;
    font-family:'Black Han Sans',sans-serif;
    font-size:20px;
    color:var(--teal);
    letter-spacing:.06em;
  }

  .show-meta{
    margin-top:30px;
    font-family:'Anton',sans-serif;
    letter-spacing:.04em;
  }
  .show-date{font-size:clamp(20px,5.4vw,26px);color:var(--cream);}
  .show-venue{margin-top:2px;font-size:clamp(14px,3.6vw,16px);color:var(--gold-soft);letter-spacing:.14em;}

  .main-menu{
    position:relative;z-index:1;
    margin-top:46px;
  }
  .menu-btn{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    background:rgba(246,239,217,0.06);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 40px;
    cursor:pointer;
    transition:background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .menu-btn:hover, .menu-btn:focus-visible{
    background:linear-gradient(90deg, rgba(94,205,196,0.14), rgba(63,143,214,0.10));
    border-color:var(--teal);
    transform:translateY(-2px);
    outline:none;
  }
  .menu-btn-label{
    font-family:'Black Han Sans',sans-serif;
    font-size:19px;
    color:var(--cream);
    letter-spacing:.02em;
  }
  .menu-btn-sub{
    font-family:'Anton',sans-serif;
    font-size:10px;
    letter-spacing:.26em;
    background:linear-gradient(90deg,var(--teal),var(--sky));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  /* ---------- SONG LIST / GUIDE ---------- */
  .guide-page{
    min-height:100svh;
    background:linear-gradient(180deg,#170504 0%, #0f0403 100%);
  }
  .songs-section{
    background:none;
    padding:36px 20px 80px;
  }
  .songs-head{
    max-width:640px;margin:0 auto 26px;
    text-align:center;
  }
  .songs-head h2{
    font-family:'Black Han Sans',sans-serif;
    font-size:clamp(22px,6vw,28px);
    margin:10px 0 6px;
    letter-spacing:.02em;
  }
  .songs-head p{
    margin:0;
    font-size:13px;
    color:#b9a98a;
  }
  .song-list{
    max-width:640px;margin:0 auto;
    list-style:none;padding:0;
    border-top:1px solid var(--line);
  }
  .song-row{
    width:100%;
    display:flex;align-items:center;gap:16px;
    background:none;border:none;border-bottom:1px solid var(--line);
    color:var(--cream);
    padding:18px 6px;
    cursor:pointer;
    text-align:left;
    transition:background .2s ease, padding-left .2s ease;
  }
  .song-row:hover, .song-row:focus-visible{
    background:linear-gradient(90deg, rgba(94,205,196,0.10), transparent 70%);
    padding-left:14px;
    outline:none;
  }
  .song-title{
    flex:1;
    font-family:'Black Han Sans',sans-serif;
    font-size:clamp(16px,4.4vw,19px);
    letter-spacing:.01em;
  }
  .song-arrow{
    font-family:'Anton',sans-serif;
    font-size:18px;
    background:linear-gradient(90deg,var(--teal),var(--sky));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    flex:none;
  }

  .credits{
    text-align:center;
    padding:30px 20px 60px;
    font-size:11px;
    color:#7a6a52;
    letter-spacing:.08em;
  }

  /* ---------- SONG DETAIL PAGE ---------- */
  .song-page{
    height:100svh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:linear-gradient(180deg,#170504 0%, #260906 100%);
  }
  .song-fixed-top{
    flex:none;
  }
  .song-topbar{
    display:flex;align-items:center;gap:14px;
    padding:16px 18px;
    background:rgba(23,5,4,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .back-btn{
    background:none;border:1px solid var(--line);color:var(--cream);
    border-radius:999px;
    padding:8px 14px;
    font-size:13px;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .back-btn:hover{border-color:var(--teal);color:var(--teal);}
  .song-topbar h1{
    font-family:'Black Han Sans',sans-serif;
    font-size:clamp(16px,4.6vw,20px);
    margin:0;
    flex:1;
    text-align:center;
    padding-right:64px; /* balance back button */
  }

  .video-wrap{
    max-width:720px;margin:22px auto 0;padding:0 16px;
  }
  .video-frame{
    position:relative;width:100%;padding-top:56.25%;
    border-radius:12px;overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,0.5);
    border:1px solid var(--line);
    background:#000;
  }
  .video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .watch-on-yt{
    display:inline-block;
    margin-top:8px;
    font-size:11px;
    color:#8d7d62;
    text-decoration:none;
  }
  .watch-on-yt:hover{color:var(--teal);}

  .lyrics-note{
    max-width:720px;margin:16px auto 0;padding:0 16px;
    font-size:12px;color:#b9a98a;
    display:flex;gap:8px;align-items:flex-start;
  }
  .lyrics-note .dot{color:var(--teal);}

  .lyrics-legend{
    max-width:720px;margin:14px auto 12px;padding:0 16px;
    display:flex;gap:18px;flex-wrap:wrap;
  }
  .legend-item{
    display:flex;align-items:center;gap:7px;
    font-size:12px;color:#cbb99b;
  }
  .legend-icon{
    width:20px;height:20px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .legend-icon svg{width:12px;height:12px;}
  .legend-icon.chant{background:rgba(245,148,44,0.16);color:var(--chant);}
  .legend-icon.clap{background:rgba(79,168,224,0.16);color:var(--clap);}

  .lyrics-scroll{
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    border-top:1px solid var(--line);
  }
  .lyrics-list{
    max-width:720px;margin:10px auto 0;padding:8px 10px 140px;
    list-style:none;
  }
  .lyric-line{
    width:100%;
    display:block;
    background:none;border:none;
    padding:13px 10px;
    border-radius:10px;
    text-align:left;
    cursor:pointer;
    transition:background .18s ease, transform .18s ease;
  }
  .lyric-line:hover{background:rgba(246,239,217,0.06);}
  .lyric-body{min-width:0;display:block;}
  .lyric-jp{
    display:block;
    font-size:clamp(13px,3.6vw,14px);
    color:#a99a80;
    line-height:1.5;
  }
  .lyric-ko{
    display:block;
    font-size:clamp(15px,4.2vw,17px);
    font-weight:800;
    line-height:1.5;
    color:var(--cream);
  }
  .lyric-tr{
    display:block;
    font-size:clamp(12px,3.4vw,13px);
    color:#8d7d62;
    line-height:1.5;
    margin-top:1px;
  }
  /* 한 줄 안에서도 구간별로 떼창(주황) 부분만 색이 달라짐 */
  .seg-chant{color:var(--chant);}
  .seg-clap{color:var(--clap);}

  .lyric-line.active{
    background:linear-gradient(90deg, rgba(94,205,196,0.14), rgba(63,143,214,0.08));
    transform:translateX(2px);
  }

  /* ---------- 우측 하단 고정 컨트롤 ---------- */
  .player-controls{
    position:fixed;
    right:18px;bottom:22px;
    z-index:20;
    display:flex;flex-direction:column;align-items:flex-end;gap:10px;
  }

  /* AUTO SCROLL 필 스위치 (참고 이미지 스타일) — 크기 절반 */
  .autoscroll-toggle{
    display:flex;align-items:center;gap:7px;
    background:linear-gradient(180deg, #2c130c, #1c0a06);
    border:1px solid var(--chant);
    border-radius:999px;
    padding:5px 5px 5px 10px;
    cursor:pointer;
    box-shadow:0 3px 9px rgba(0,0,0,0.45);
    transition:opacity .18s ease, transform .12s ease;
  }
  .autoscroll-toggle:active{transform:scale(0.97);}
  .autoscroll-toggle:not(.active){opacity:.55;}
  .autoscroll-label{
    font-family:'Anton',sans-serif;
    letter-spacing:.05em;
    font-size:8px;
    color:var(--chant);
    white-space:nowrap;
  }
  .autoscroll-switch{
    width:22px;height:13px;flex:none;
    border-radius:999px;
    background:#160a06;
    border:1px solid var(--chant);
    position:relative;
    transition:background .2s ease;
  }
  .autoscroll-knob{
    position:absolute;top:1px;left:1px;
    width:10px;height:10px;
    border-radius:50%;
    background:#8d8f93;
    box-shadow:0 1px 2px rgba(0,0,0,0.5);
    transition:transform .2s ease, background .2s ease;
  }
  .autoscroll-toggle.active .autoscroll-switch{background:#241109;}
  .autoscroll-toggle.active .autoscroll-knob{
    transform:translateX(9px);
    background:#aab6c9;
  }

  #app{min-height:100svh;}
  @media (min-width:720px){
    .hero{padding-top:72px;}
  }
</style>
</head>

<body>
<div id="app"></div>

<script>
/* =========================================================================
   VAUNDY ASIA ARENA TOUR 2026 "HORO" — SEOUL 떼창 가이드
   -------------------------------------------------------------------------
   ▼ 아래 SONGS 배열에 실제 세트리스트 정보를 채워 넣으세요.
   ▼ id          : URL에 쓰일 영문/숫자 slug (예: 'kaijuu')
   ▼ title       : 화면에 보일 곡명
   ▼ youtubeId   : 유튜브 영상 ID (watch?v=  뒤에 오는 11자리 문자열)
   ▼ lyrics      : 한 소절씩 아래 형식의 객체 배열
       {
         time: 초단위 타임스탬프 (영상에서 이 소절이 시작되는 시점 · 화면에는
               표시되지 않고 영상 이동에만 쓰임),
         jp:   일본어 원문,
         ko:   한글 발음. 아래 둘 중 하나로 넣으세요.
               1) 문자열 그대로 넣으면 구분 없이 기본색으로 표시됩니다.
                  예: ko: "한글 발음 전체"
               2) 한 줄 안에서 떼창(주황)·박수(파랑) 구간만 색을 다르게
                  하고 싶으면 배열로 나눠서 넣으세요. 각 조각의 tag 값:
                  "chant" = 떼창(주황), "clap" = 박수(파랑), 생략 = 기본색.
                  예: ko: [
                        { text: "앞부분 몇 글자는 떼창", tag: "chant" },
                        { text: " 이 부분은 박수", tag: "clap" },
                        { text: " 뒷부분은 기본색" },
                      ]
                  조각들은 이어붙여서 한 줄로 표시되니 필요하면 조각
                  사이에 띄어쓰기를 text 안에 포함해 주세요.
         tr:   한국어 해석,
       }
     * 떼창·박수 아이콘은 각 곡 화면 맨 위에 한 번만(범례) 표시되고,
       가사 줄 앞에는 더 이상 표시되지 않습니다.
     * 저작권 보호를 받는 실제 가사 원문·발음·해석은 이 코드에 미리
       채워둘 수 없어 예시 문구로 대체해 두었습니다.
       실제 배포 전에 공식 가사/발음/해석과 떼창·박수 구간을 직접
       확인해서 교체해 주세요.
   ========================================================================= */
  const SHOW_DATETIME = "2026-09-19T17:00:00+09:00"; // 공연 시작 카운트다운 기준

  const SONGS = [
    {
      id: "Tokimeki",
      title: "[Tokimeki]",
      youtubeId: "-_PKhPMXMDY", // ← 실제 유튜브 영상 ID로 교체
      lyrics: [
        { time: 0, jp: "目に映るのは 確かなときめきで光る魔法",        ko: [{ text: "메니 우츠루노와 타시카나 토키메키데 히카루 마호", tag: "clap" }],                                                     tr: "눈에 비치는 것은 확실한 두근거림으로 빛나는 마법" },
        { time: 9, jp: "思い当たるのは 誰かの 涙が落ちる音",        ko: [{ text: "오모이아타루노와 다레카노 나미다가 오치루 오토", tag: "clap" }],                                                     tr: "마음에 짚이는 것은 누군가의 눈물이 떨어지는 소리" },
        { time: 17, jp: "Hu Hu Hu Ya Ya x3",        ko: [{ text: "Hu Hu Hu Ya Ya x3", tag: "chant" }],                                                    tr: "Hu Hu Hu Ya Ya x3" },
        { time: 21, jp: "それは、軽やかな魔法 Hu Hu Hu Ya Ya x2", ko: [{ text: "소레와 카로야카나 마호-" }, { text: " Hu Hu Hu Ya Ya x2", tag: "chant" }],               tr: "그것은 경쾌한 마법 Hu Hu Hu Ya Ya x2" },
        { time: 29,  jp: "美しいほど 止まらぬCRY", ko: "우츠쿠시이 호도 토마라누 CRY",                                 tr: "아름다울수록멈추지 않는 CRY" },
        { time: 32, jp: "DA-DADADADA Just dancing tonight", ko: [{ text: "DA-DADADADA ", tag: "chant" }, { text: "Just dancing tonight"}],               tr: "DA-DADADADA Just dancing tonight" },
        { time: 38, jp: "(DA-DA-DA) 涙流して笑えばいいさ", ko: [{ text: "(DA-DA-DA) ", tag: "chant" }, { text: "나미다 나가시테 와라에바 이-사"}],               tr: "(DA-DA-DA) 눈물 흘리며 웃으면 되는 거야" },
        { time: 43, jp: "見えぬ未来も 悪くはないぜ (ないぜ)", ko: [{ text: "미에누 미라이모 와루쿠와 나이제" }, { text: "(나이제)", tag: "chant" }],               tr: "보이지 않는 미래도 나쁘진 않은걸" },
        { time: 48, jp: "DA-DADADADA Just dancing tonight", ko: [{ text: "DA-DADADADA ", tag: "chant" }, { text: "Just dancing tonight"}],               tr: "DA-DADADADA Just dancing tonight" },
        { time: 54, jp: "(DA-DA-DA) あくびしてる暇なんかないぜ", ko: [{ text: "(DA-DA-DA) ", tag: "chant" }, { text: "아쿠비시테루 히마난카 나이제"}],               tr: "(DA-DA-DA) 하품하고 있을 시간 따윈 없어" },
        { time: 59, jp: "ほら、ほらもっと聞かせて Hu Hu Hu Hu Hu", ko: [{ text: "호라 호라 못토 키카세테" }, { text: " Hu Hu Hu Hu Hu", tag: "chant" }],               tr: "자, 좀 더 들려줘 Hu Hu Hu Hu Hu" },
        { time: 73, jp: "聞こえてるのは 確かな ときめきで歌う魔法",        ko: [{ text: "키코에테루노와 타시카나 토키메키데 히카루 마호", tag: "clap" }],                                                     tr: "들리는 것은 확실한 두근거림으로 빛나는 마법" },
        { time: 82, jp: "思い当たるのは 誰かの 鼻歌のイントロ",        ko: [{ text: "오모이아타루노와 다레카노 하나우타노 인토로", tag: "clap" }],                                                     tr: "마음에 짚이는 것은 누군가의 콧노래의 인트로" },
        { time: 89, jp: "Hu Hu Hu Ya Ya x3",        ko: [{ text: "Hu Hu Hu Ya Ya x3", tag: "chant" }],                                                    tr: "Hu Hu Hu Ya Ya x3" },
        { time: 94, jp: "それは、鮮やかな魔法 Hu Hu Hu Ya Ya x2", ko: [{ text: "소레와 아자야카나 마호-" }, { text: " Hu Hu Hu Ya Ya x2", tag: "chant" }],               tr: "그것은 산뜻한 마법 Hu Hu Hu Ya Ya x2" },

        { time: 10, jp: "(예시) 떼창 파트 원문",         ko: [{ text: "(예시) 떼창 파트 한글 발음", tag: "chant" }],  tr: "(예시) 떼창 파트 해석" },
        { time: 20, jp: "(예시) 박수 파트 원문",         ko: [{ text: "(예시) 박수 파트 한글 발음", tag: "clap" }],   tr: "(예시) 박수 파트 해석" },
      ],

      id: "song-3",

      youtubeId: "dQw4w9WgXcQ",
      lyrics: [

        { time: 12, jp: "(예시) 떼창 파트 원문",         ko: [{ text: "(예시) 떼창 파트 한글 발음", tag: "chant" }], tr: "(예시) 떼창 파트 해석" },
        { time: 32, jp: "(예시) 한 줄 안에서 떼창·박수 나눠지는 원문", ko: [{ text: "앞부분은 떼창 ", tag: "chant" }, { text: "뒷부분은 박수", tag: "clap" }],               tr: "(예시) 앞부분은 떼창, 뒷부분은 박수인 해석" },
      ],
    },
  ];


  /* ------------------------------------------------------------------ */

  const app = document.getElementById("app");
  let countdownTimer = null;
  let localPollTimer = null;
  let localPlayStartWall = null;
  let localPlayStartVideoTime = 0;
  let localPollActive = false;

  function pad(n){ return String(n).padStart(2,"0"); }

  function router(){
    stopCountdown();
    stopLocalPoll();
    const hash = location.hash.replace(/^#\/?/, "");
    if (hash.startsWith("song/")) {
      const id = hash.slice(5);
      const song = SONGS.find(s => s.id === id);
      song ? renderSong(song) : renderHome();
    } else if (hash === "guide") {
      renderGuide();
    } else {
      renderHome();
    }
    window.scrollTo(0,0);
  }

  /* ---------------- HOME ---------------- */
  function renderHome(){
    app.innerHTML = `
      <section class="hero">
        <div class="hero-inner">
          <div class="eyebrow">ASIA ARENA TOUR 2026</div>
          <h1 class="tour-title"><span>VAUNDY</span>&ldquo;HORO&rdquo;</h1>

          <div class="countdown-label">공연까지 남은 시간</div>
          <div class="countdown" id="countdown">
            <div class="cd-box"><div class="cd-num" id="cd-d">00</div><div class="cd-unit">DAYS</div></div>
            <div class="cd-box"><div class="cd-num" id="cd-h">00</div><div class="cd-unit">HRS</div></div>
            <div class="cd-box"><div class="cd-num" id="cd-m">00</div><div class="cd-unit">MIN</div></div>
            <div class="cd-box"><div class="cd-num" id="cd-s">00</div><div class="cd-unit">SEC</div></div>
          </div>

          <div class="show-meta">
            <div class="show-date">9.19–20</div>
            <div class="show-venue">SEOUL · INSPIRE ARENA</div>
          </div>

          <nav class="main-menu">
            <button class="menu-btn" id="guide-btn">
              <span class="menu-btn-label">떼창가이드</span>
              <span class="menu-btn-sub">CHANT GUIDE</span>
            </button>
          </nav>
        </div>
      </section>

      <div class="credits">VAUNDY ASIA ARENA TOUR 2026 &ldquo;HORO&rdquo; · SEOUL FAN CHANT GUIDE (비공식 팬 제작)</div>
    `;

    document.getElementById("guide-btn").addEventListener("click", ()=>{ location.hash = "#/guide"; });

    startCountdown();
  }

  /* ---------------- CHANT GUIDE (song list) ---------------- */
  function renderGuide(){
    app.innerHTML = `
      <div class="guide-page">
        <div class="song-topbar">
          <button class="back-btn" id="back-btn">← 홈으로</button>
          <h1>떼창가이드</h1>
        </div>

        <section class="songs-section">
          <div class="songs-head">
            <div class="eyebrow">CHANT GUIDE</div>
            <h2>떼창 가이드</h2>
            <p>곡을 선택하면 영상에 맞춰 가사 · 떼창 포인트를 확인할 수 있어요</p>
          </div>
          <ul class="song-list">
            ${SONGS.map((s,i)=>`
              <li>
                <button class="song-row" data-id="${s.id}">
                  <span class="song-title">${escapeHtml(s.title)}</span>
                  <span class="song-arrow">→</span>
                </button>
              </li>`).join("")}
          </ul>
        </section>

        <div class="credits">VAUNDY ASIA ARENA TOUR 2026 &ldquo;HORO&rdquo; · SEOUL FAN CHANT GUIDE (비공식 팬 제작)</div>
      </div>
    `;

    document.getElementById("back-btn").addEventListener("click", ()=>{ location.hash = "#/"; });

    app.querySelectorAll(".song-row").forEach(btn=>{
      btn.addEventListener("click", ()=>{ location.hash = `#/song/${btn.dataset.id}`; });
    });
  }

  function startCountdown(){
    const target = new Date(SHOW_DATETIME).getTime();
    function tick(){
      const now = Date.now();
      const diff = target - now;
      const box = document.getElementById("countdown");
      if (!box) { stopCountdown(); return; }
      if (diff <= 0){
        box.outerHTML = `<div class="countdown-done">🎤 공연이 시작되었습니다!</div>`;
        stopCountdown();
        return;
      }
      const d = Math.floor(diff/86400000);
      const h = Math.floor(diff%86400000/3600000);
      const m = Math.floor(diff%3600000/60000);
      const s = Math.floor(diff%60000/1000);
      const dd=document.getElementById("cd-d"), hh=document.getElementById("cd-h"),
            mm=document.getElementById("cd-m"), ss=document.getElementById("cd-s");
      if(dd){dd.textContent=pad(d); hh.textContent=pad(h); mm.textContent=pad(m); ss.textContent=pad(s);}
    }
    tick();
    countdownTimer = setInterval(tick, 1000);
  }
  function stopCountdown(){ if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; } }

  /* ---------------- SONG DETAIL ---------------- */
  const MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
  const CLAP_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V7a2 2 0 0 1 4 0"/><path d="M12 13V5a2 2 0 0 1 4 0v8"/><path d="M16 13V7a2 2 0 0 1 4 0v6a7 7 0 0 1-7 7h-1a7 7 0 0 1-6.3-4"/><path d="M4 12l1-1"/><path d="M3 9l1.5-.5"/><path d="M4 6l1 1"/></svg>';

  let autoScrollEnabled = true;
  let currentSong = null;

  function renderSong(song){
    currentSong = song;
    localPollActive = false;
    app.innerHTML = `
      <div class="song-page">
        <div class="song-fixed-top">
          <div class="song-topbar">
            <button class="back-btn" id="back-btn">← 목록</button>
            <h1>${escapeHtml(song.title)}</h1>
          </div>

          <div class="video-wrap">
            <div class="video-frame" id="video-frame">${videoIframeHtml(song.youtubeId)}</div>
            <a class="watch-on-yt" href="https://www.youtube.com/watch?v=${encodeURIComponent(song.youtubeId)}" target="_blank" rel="noopener">유튜브에서 보기 ↗</a>
          </div>

          <div class="lyrics-note"><span class="dot">●</span> 가사를 탭하면 해당 위치로 영상이 이동해요(자동재생). 그 지점부터 재생 중인 소절이 자동으로 하이라이트됩니다.</div>

          <div class="lyrics-legend">
            <span class="legend-item"><span class="legend-icon chant">${MIC_SVG}</span>떼창</span>
            <span class="legend-item"><span class="legend-icon clap">${CLAP_SVG}</span>박수</span>
          </div>
        </div>

        <div class="lyrics-scroll">
          <ul class="lyrics-list" id="lyrics-list">
            ${song.lyrics.map((l,i)=>{
              return `
              <li>
                <button class="lyric-line" data-time="${l.time}" data-idx="${i}">
                  <span class="lyric-body">
                    <span class="lyric-jp">${escapeHtml(l.jp || "")}</span>
                    <span class="lyric-ko">${renderKo(l.ko)}</span>
                    <span class="lyric-tr">${escapeHtml(l.tr || "")}</span>
                  </span>
                </button>
              </li>`;
            }).join("")}
          </ul>
        </div>

        <div class="player-controls">
          <button class="autoscroll-toggle${autoScrollEnabled ? " active" : ""}" id="autoscroll-btn" aria-label="자동 스크롤 켜기/끄기">
            <span class="autoscroll-label">AUTO SCROLL</span>
            <span class="autoscroll-switch"><span class="autoscroll-knob"></span></span>
          </button>
        </div>
      </div>
    `;

    document.getElementById("back-btn").addEventListener("click", ()=>{ location.hash = "#/guide"; });

    document.querySelectorAll(".lyric-line").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const t = Number(btn.dataset.time);
        seekTo(t);
      });
    });

    document.getElementById("autoscroll-btn").addEventListener("click", (e)=>{
      autoScrollEnabled = !autoScrollEnabled;
      e.currentTarget.classList.toggle("active", autoScrollEnabled);
    });
  }

  function formatTime(sec){
    const m = Math.floor(sec/60), s = Math.floor(sec%60);
    return `${m}:${pad(s)}`;
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ko가 문자열이면 그대로, 배열이면 조각별로 떼창(chant)/박수(clap) 색을 입혀 이어붙입니다.
  function renderKo(ko){
    if (!ko) return "";
    if (typeof ko === "string") return escapeHtml(ko);
    return ko.map(seg => {
      const cls = seg.tag === "chant" ? "seg-chant" : seg.tag === "clap" ? "seg-clap" : "";
      return `<span class="${cls}">${escapeHtml(seg.text || "")}</span>`;
    }).join("");
  }

  /* ---------------- YouTube 재생 (일반 iframe 임베드 방식) ----------------
     유튜브 IFrame JS API(postMessage 통신)는 file://로 직접 열었을 때나
     네트워크/보안 설정에 따라 아예 로드되지 않는 경우가 있어, 그런 환경에서도
     최소한 영상 자체는 항상 뜨도록 순수 <iframe> 임베드 방식으로 구현했습니다.
     대신 실제 재생 위치를 API로 읽어올 수 없어서, 가사 하이라이트는 "가사를
     탭한 시점부터 1배속으로 재생된다"고 가정한 자체 시계로 추정합니다. */
  function videoIframeHtml(videoId){
    const src = `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?rel=0&playsinline=1&modestbranding=1`;
    return `<iframe id="yt-iframe" src="${src}" title="YouTube video player" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
  }

  function seekTo(seconds){
    const iframe = document.getElementById("yt-iframe");
    const song = currentSong;
    if (!iframe || !song) return;
    const src = `https://www.youtube.com/embed/${encodeURIComponent(song.youtubeId)}?rel=0&playsinline=1&modestbranding=1&autoplay=1&start=${Math.max(0, Math.floor(seconds))}`;
    iframe.src = src;
    localPlayStartVideoTime = seconds;
    localPlayStartWall = Date.now();
    localPollActive = true;
    startLocalPoll();
  }

  function startLocalPoll(){
    stopLocalPollTimerOnly();
    localPollTimer = setInterval(()=>{
      if (!localPollActive || localPlayStartWall == null) return;
      const list = document.getElementById("lyrics-list");
      if (!list) { stopLocalPoll(); return; }
      const cur = localPlayStartVideoTime + (Date.now() - localPlayStartWall) / 1000;
      const lines = Array.from(list.querySelectorAll(".lyric-line"));
      let activeIdx = -1;
      lines.forEach((el,i)=>{
        const t = Number(el.dataset.time);
        if (cur >= t) activeIdx = i;
      });
      lines.forEach((el,i)=> el.classList.toggle("active", i===activeIdx));
      if (activeIdx >= 0 && autoScrollEnabled){
        lines[activeIdx].scrollIntoView({ block:"center", behavior:"smooth" });
      }
    }, 300);
  }
  function stopLocalPollTimerOnly(){
    if (localPollTimer){ clearInterval(localPollTimer); localPollTimer=null; }
  }
  function stopLocalPoll(){
    stopLocalPollTimerOnly();
    localPollActive = false;
    localPlayStartWall = null;
  }

  window.addEventListener("hashchange", router);
  router();
</script>
