<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAUNDY ASIA ARENA TOUR 2026 "HORO" — SEOUL 떼창 가이드</title>
<meta name="theme-color" content="#2a0a06">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Anton&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#230805;
    --bg-mid:#7a2712;
    --bg-glow:#c8462a;
    --ink:#170504;
    --gold:#e9d9a3;
    --gold-soft:#cdb87c;
    --teal:#5ecdc4;
    --sky:#3f8fd6;
    --cream:#f6efd9;
    --line:rgba(233,217,163,0.18);
    --chant:#f5942c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-deep);
    color:var(--cream);
    font-family:'Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--teal);color:var(--ink);}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- utility ---------- */
  .eyebrow{
    font-family:'Anton',sans-serif;
    letter-spacing:.28em;
    font-size:13px;
    color:var(--gold-soft);
    text-transform:uppercase;
  }

  /* ---------- HERO / HOME ---------- */
  .hero{
    position:relative;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:56px 20px 40px;
    background:
      radial-gradient(120% 70% at 50% 8%, rgba(200,70,42,0.55), transparent 60%),
      radial-gradient(140% 90% at 50% 100%, rgba(122,39,18,0.9), transparent 70%),
      linear-gradient(180deg, #170504 0%, #2c0a06 30%, #7a2712 78%, #3a0d08 100%);
    background-image:
      radial-gradient(120% 70% at 50% 8%, rgba(200,70,42,0.55), transparent 60%),
      radial-gradient(140% 90% at 50% 100%, rgba(122,39,18,0.9), transparent 70%),
      url('images/poster.jpg'),
      linear-gradient(180deg, #170504 0%, #2c0a06 30%, #7a2712 78%, #3a0d08 100%);
    background-size:cover,cover,cover,cover;
    background-position:center,center,center 22%,center;
    background-repeat:no-repeat;
    text-align:center;
    isolation:isolate;
  }
  .hero::after{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(23,5,4,0.15) 0%, rgba(23,5,4,0.15) 35%, rgba(23,5,4,0.55) 62%, rgba(15,4,3,0.96) 100%);
    z-index:0;
  }
  .hero-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:560px;}

  .tour-title{
    margin:14px 0 0;
    font-family:'Anton',sans-serif;
    font-size:clamp(30px,7vw,44px);
    letter-spacing:.03em;
    color:var(--gold);
    text-shadow:0 2px 18px rgba(0,0,0,0.5);
    line-height:1.08;
  }
  .tour-title span{display:block;font-size:.5em;letter-spacing:.34em;color:var(--gold-soft);margin-bottom:6px;}

  .wordmark{
    margin:26px 0 6px;
    font-family:'Anton',sans-serif;
    font-size:clamp(52px,17vw,108px);
    letter-spacing:.02em;
    background:linear-gradient(180deg, var(--gold) 0%, var(--gold) 38%, var(--teal) 62%, var(--sky) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 6px 22px rgba(0,0,0,0.45));
  }

  .countdown-label{
    margin-top:30px;
    font-family:'Black Han Sans',sans-serif;
    font-size:14px;
    letter-spacing:.18em;
    color:var(--gold-soft);
  }
  .countdown{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  .cd-box{
    background:rgba(246,239,217,0.06);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 6px 10px;
    width:70px;
    backdrop-filter:blur(2px);
  }
  .cd-num{
    font-family:'Anton',sans-serif;
    font-size:clamp(26px,7vw,34px);
    line-height:1;
    color:var(--cream);
    font-variant-numeric:tabular-nums;
  }
  .cd-unit{
    margin-top:6px;
    font-size:10px;
    letter-spacing:.22em;
    color:var(--gold-soft);
  }
  .countdown-done{
    margin-top:16px;
    font-family:'Black Han Sans',sans-serif;
    font-size:20px;
    color:var(--teal);
    letter-spacing:.06em;
  }

  .show-meta{
    margin-top:30px;
    font-family:'Anton',sans-serif;
    letter-spacing:.04em;
  }
  .show-date{font-size:clamp(20px,5.4vw,26px);color:var(--cream);}
  .show-venue{margin-top:2px;font-size:clamp(14px,3.6vw,16px);color:var(--gold-soft);letter-spacing:.14em;}

  .main-menu{
    position:relative;z-index:1;
    margin-top:46px;
  }
  .menu-btn{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    background:rgba(246,239,217,0.06);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 40px;
    cursor:pointer;
    transition:background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .menu-btn:hover, .menu-btn:focus-visible{
    background:linear-gradient(90deg, rgba(94,205,196,0.14), rgba(63,143,214,0.10));
    border-color:var(--teal);
    transform:translateY(-2px);
    outline:none;
  }
  .menu-btn-label{
    font-family:'Black Han Sans',sans-serif;
    font-size:19px;
    color:var(--cream);
    letter-spacing:.02em;
  }
  .menu-btn-sub{
    font-family:'Anton',sans-serif;
    font-size:10px;
    letter-spacing:.26em;
    background:linear-gradient(90deg,var(--teal),var(--sky));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  /* ---------- SONG LIST / GUIDE ---------- */
  .guide-page{
    min-height:100svh;
    background:linear-gradient(180deg,#170504 0%, #0f0403 100%);
  }
  .songs-section{
    background:none;
    padding:36px 20px 80px;
  }
  .songs-head{
    max-width:640px;margin:0 auto 26px;
    text-align:center;
  }
  .songs-head h2{
    font-family:'Black Han Sans',sans-serif;
    font-size:clamp(22px,6vw,28px);
    margin:10px 0 6px;
    letter-spacing:.02em;
  }
  .songs-head p{
    margin:0;
    font-size:13px;
    color:#b9a98a;
  }
  .song-list{
    max-width:640px;margin:0 auto;
    list-style:none;padding:0;
    border-top:1px solid var(--line);
  }
  .song-row{
    width:100%;
    display:flex;align-items:center;gap:16px;
    background:none;border:none;border-bottom:1px solid var(--line);
    color:var(--cream);
    padding:18px 6px;
    cursor:pointer;
    text-align:left;
    transition:background .2s ease, padding-left .2s ease;
  }
  .song-row:hover, .song-row:focus-visible{
    background:linear-gradient(90deg, rgba(94,205,196,0.10), transparent 70%);
    padding-left:14px;
    outline:none;
  }
  .song-title{
    flex:1;
    font-family:'Black Han Sans',sans-serif;
    font-size:clamp(16px,4.4vw,19px);
    letter-spacing:.01em;
  }
  .song-arrow{
    font-family:'Anton',sans-serif;
    font-size:18px;
    background:linear-gradient(90deg,var(--teal),var(--sky));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    flex:none;
  }

  .credits{
    text-align:center;
    padding:30px 20px 60px;
    font-size:11px;
    color:#7a6a52;
    letter-spacing:.08em;
  }

  /* ---------- SONG DETAIL PAGE ---------- */
  .song-page{
    min-height:100svh;
    background:linear-gradient(180deg,#170504 0%, #260906 100%);
  }
  .song-topbar{
    position:sticky;top:0;z-index:5;
    display:flex;align-items:center;gap:14px;
    padding:16px 18px;
    background:rgba(23,5,4,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .back-btn{
    background:none;border:1px solid var(--line);color:var(--cream);
    border-radius:999px;
    padding:8px 14px;
    font-size:13px;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .back-btn:hover{border-color:var(--teal);color:var(--teal);}
  .song-topbar h1{
    font-family:'Black Han Sans',sans-serif;
    font-size:clamp(16px,4.6vw,20px);
    margin:0;
    flex:1;
    text-align:center;
    padding-right:64px; /* balance back button */
  }

  .video-wrap{
    max-width:720px;margin:22px auto 0;padding:0 16px;
  }
  .video-frame{
    position:relative;width:100%;padding-top:56.25%;
    border-radius:12px;overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,0.5);
    border:1px solid var(--line);
    background:#000;
  }
  .video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .video-error{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:20px;text-align:center;
    background:#0f0403;
  }
  .video-error p{
    margin:0;font-size:13px;line-height:1.6;color:#cbb99b;max-width:420px;
  }
  .video-retry-btn{
    background:none;
    border:1px solid var(--teal);
    color:var(--teal);
    border-radius:999px;
    padding:8px 18px;
    font-size:13px;
    cursor:pointer;
  }
  .video-retry-btn:hover{background:rgba(94,205,196,0.12);}

  .lyrics-note{
    max-width:720px;margin:16px auto 0;padding:0 16px;
    font-size:12px;color:#b9a98a;
    display:flex;gap:8px;align-items:flex-start;
  }
  .lyrics-note .dot{color:var(--teal);}

  .lyrics-legend{
    max-width:720px;margin:14px auto 0;padding:0 16px;
    display:flex;gap:18px;flex-wrap:wrap;
  }
  .legend-item{
    display:flex;align-items:center;gap:7px;
    font-size:12px;color:#cbb99b;
  }
  .legend-icon{
    width:20px;height:20px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .legend-icon svg{width:12px;height:12px;}
  .legend-icon.chant{background:rgba(245,148,44,0.16);color:var(--chant);}

  .lyrics-list{
    max-width:720px;margin:10px auto 0;padding:8px 10px 140px;
    list-style:none;
  }
  .lyric-line{
    width:100%;
    display:block;
    background:none;border:none;
    padding:13px 10px;
    border-radius:10px;
    text-align:left;
    cursor:pointer;
    transition:background .18s ease, transform .18s ease;
  }
  .lyric-line:hover{background:rgba(246,239,217,0.06);}
  .lyric-body{min-width:0;display:block;}
  .lyric-jp{
    display:block;
    font-size:clamp(13px,3.6vw,14px);
    color:#a99a80;
    line-height:1.5;
  }
  .lyric-ko{
    display:block;
    font-size:clamp(15px,4.2vw,17px);
    font-weight:800;
    line-height:1.5;
    color:var(--cream);
  }
  .lyric-tr{
    display:block;
    font-size:clamp(12px,3.4vw,13px);
    color:#8d7d62;
    line-height:1.5;
    margin-top:1px;
  }
  /* 한 줄 안에서도 구간별로 떼창(주황) 부분만 색이 달라짐 */
  .seg-chant{color:var(--chant);}

  .lyric-line.active{
    background:linear-gradient(90deg, rgba(94,205,196,0.14), rgba(63,143,214,0.08));
    transform:translateX(2px);
  }

  /* ---------- 우측 하단 고정 컨트롤 ---------- */
  .player-controls{
    position:fixed;
    right:18px;bottom:22px;
    z-index:20;
    display:flex;flex-direction:column;align-items:flex-end;gap:10px;
  }
  .ctrl-btn{
    width:48px;height:48px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(23,5,4,0.88);
    border:1px solid var(--line);
    color:var(--cream);
    backdrop-filter:blur(6px);
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
    cursor:pointer;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .ctrl-btn:active{transform:scale(0.94);}
  .ctrl-btn svg{width:20px;height:20px;}
  .ctrl-btn.primary{
    background:linear-gradient(135deg, rgba(94,205,196,0.9), rgba(63,143,214,0.9));
    color:#0f0403;
    border:none;
  }

  /* AUTO SCROLL 필 스위치 (참고 이미지 스타일) — 크기 절반 */
  .autoscroll-toggle{
    display:flex;align-items:center;gap:7px;
    background:linear-gradient(180deg, #2c130c, #1c0a06);
    border:1px solid var(--chant);
    border-radius:999px;
    padding:5px 5px 5px 10px;
    cursor:pointer;
    box-shadow:0 3px 9px rgba(0,0,0,0.45);
    transition:opacity .18s ease, transform .12s ease;
  }
  .autoscroll-toggle:active{transform:scale(0.97);}
  .autoscroll-toggle:not(.active){opacity:.55;}
  .autoscroll-label{
    font-family:'Anton',sans-serif;
    letter-spacing:.05em;
    font-size:8px;
    color:var(--chant);
    white-space:nowrap;
  }
  .autoscroll-switch{
    width:22px;height:13px;flex:none;
    border-radius:999px;
    background:#160a06;
    border:1px solid var(--chant);
    position:relative;
    transition:background .2s ease;
  }
  .autoscroll-knob{
    position:absolute;top:1px;left:1px;
    width:10px;height:10px;
    border-radius:50%;
    background:#8d8f93;
    box-shadow:0 1px 2px rgba(0,0,0,0.5);
    transition:transform .2s ease, background .2s ease;
  }
  .autoscroll-toggle.active .autoscroll-switch{background:#241109;}
  .autoscroll-toggle.active .autoscroll-knob{
    transform:translateX(9px);
    background:#aab6c9;
  }

  #app{min-height:100svh;}
  @media (min-width:720px){
    .hero{padding-top:72px;}
  }
</style>
</head>

<body>
<div id="app"></div>

<script>
/* =========================================================================
   VAUNDY ASIA ARENA TOUR 2026 "HORO" — SEOUL 떼창 가이드
   -------------------------------------------------------------------------
   ▼ 아래 SONGS 배열에 실제 세트리스트 정보를 채워 넣으세요.
   ▼ id          : URL에 쓰일 영문/숫자 slug (예: 'kaijuu')
   ▼ title       : 화면에 보일 곡명
   ▼ youtubeId   : 유튜브 영상 ID (watch?v=  뒤에 오는 11자리 문자열)
   ▼ lyrics      : 한 소절씩 아래 형식의 객체 배열
       {
         time: 초단위 타임스탬프 (영상에서 이 소절이 시작되는 시점 · 화면에는
               표시되지 않고 영상 이동에만 쓰임),
         jp:   일본어 원문,
         ko:   한글 발음. 아래 둘 중 하나로 넣으세요.
               1) 문자열 그대로 넣으면 구분 없이 기본색으로 표시됩니다.
                  예: ko: "한글 발음 전체"
               2) 한 줄 안에서 떼창(주황) 구간만 색을 다르게 하고 싶으면
                  배열로 나눠서 넣으세요. 각 조각의 tag 값:
                  "chant" = 떼창(주황), 생략 = 기본색.
                  예: ko: [
                        { text: "앞부분 몇 글자는 떼창", tag: "chant" },
                        { text: " 뒷부분은 기본색" },
                      ]
                  조각들은 이어붙여서 한 줄로 표시되니 필요하면 조각
                  사이에 띄어쓰기를 text 안에 포함해 주세요.
         tr:   한국어 해석,
       }
     * 떼창 아이콘은 각 곡 화면 맨 위에 한 번만(범례) 표시되고,
       가사 줄 앞에는 더 이상 표시되지 않습니다.
     * 저작권 보호를 받는 실제 가사 원문·발음·해석은 이 코드에 미리
       채워둘 수 없어 예시 문구로 대체해 두었습니다.
       실제 배포 전에 공식 가사/발음/해석과 떼창 구간을 직접
       확인해서 교체해 주세요.
   ========================================================================= */
  const SHOW_DATETIME = "2026-09-19T17:00:00+09:00"; // 공연 시작 카운트다운 기준

  const SONGS = [
    {
      id: "song-1",
      title: "[곡명 1을 입력하세요]",
      youtubeId: "dQw4w9WgXcQ", // ← 실제 유튜브 영상 ID로 교체
      lyrics: [
        { time: 0,  jp: "(예시) 日本語 원문 가사 첫 줄",     ko: "(예시) 한글 발음 첫 줄",                                                              tr: "(예시) 한국어 해석 첫 줄" },
        { time: 8,  jp: "(예시) 日本語 원문 가사 두번째 줄", ko: "(예시) 한글 발음 두번째 줄",                                                          tr: "(예시) 한국어 해석 두번째 줄" },
        { time: 16, jp: "(예시) 떼창 파트 원문 후렴",        ko: [{ text: "(예시) 떼창 파트 한글 발음", tag: "chant" }],                               tr: "(예시) 떼창 파트 해석" },
        { time: 24, jp: "(예시) 한 줄 안 일부만 떼창인 원문", ko: [{ text: "앞부분은 기본색 " }, { text: "이 구간만 떼창", tag: "chant" }],              tr: "(예시) 앞부분은 기본색, 뒷부분만 떼창인 해석" },
      ],
    },
    {
      id: "song-2",
      title: "[곡명 2를 입력하세요]",
      youtubeId: "dQw4w9WgXcQ",
      lyrics: [
        { time: 0,  jp: "(예시) 日本語 원문 가사 첫 줄", ko: "(예시) 한글 발음 첫 줄",                                tr: "(예시) 한국어 해석 첫 줄" },
        { time: 10, jp: "(예시) 떼창 파트 원문",         ko: [{ text: "(예시) 떼창 파트 한글 발음", tag: "chant" }], tr: "(예시) 떼창 파트 해석" },
      ],
    },
    {
      id: "song-3",
      title: "[곡명 3을 입력하세요]",
      youtubeId: "dQw4w9WgXcQ",
      lyrics: [
        { time: 0,  jp: "(예시) 日本語 원문 가사 첫 줄", ko: "(예시) 한글 발음 첫 줄",                                tr: "(예시) 한국어 해석 첫 줄" },
        { time: 12, jp: "(예시) 떼창 파트 원문",         ko: [{ text: "(예시) 떼창 파트 한글 발음", tag: "chant" }], tr: "(예시) 떼창 파트 해석" },
      ],
    },
  ];


  /* ------------------------------------------------------------------ */

  const app = document.getElementById("app");
  let countdownTimer = null;
  let ytPlayer = null;
  let ytPollTimer = null;
  let ytReady = false;
  let pendingSongId = null;

  function pad(n){ return String(n).padStart(2,"0"); }

  function router(){
    stopCountdown();
    stopYtPoll();
    const hash = location.hash.replace(/^#\/?/, "");
    if (hash.startsWith("song/")) {
      const id = hash.slice(5);
      const song = SONGS.find(s => s.id === id);
      song ? renderSong(song) : renderHome();
    } else if (hash === "guide") {
      renderGuide();
    } else {
      renderHome();
    }
    window.scrollTo(0,0);
  }

  /* ---------------- HOME ---------------- */
  function renderHome(){
    app.innerHTML = `
      <section class="hero">
        <div class="hero-inner">
          <div class="eyebrow">ASIA ARENA TOUR 2026</div>
          <h1 class="tour-title"><span>VAUNDY</span>&ldquo;HORO&rdquo;</h1>
          <div class="wordmark">VAUNDY</div>

          <div class="countdown-label">공연까지 남은 시간</div>
          <div class="countdown" id="countdown">
            <div class="cd-box"><div class="cd-num" id="cd-d">00</div><div class="cd-unit">DAYS</div></div>
            <div class="cd-box"><div class="cd-num" id="cd-h">00</div><div class="cd-unit">HRS</div></div>
            <div class="cd-box"><div class="cd-num" id="cd-m">00</div><div class="cd-unit">MIN</div></div>
            <div class="cd-box"><div class="cd-num" id="cd-s">00</div><div class="cd-unit">SEC</div></div>
          </div>

          <div class="show-meta">
            <div class="show-date">9.19–20</div>
            <div class="show-venue">SEOUL · INSPIRE ARENA</div>
          </div>

          <nav class="main-menu">
            <button class="menu-btn" id="guide-btn">
              <span class="menu-btn-label">떼창가이드</span>
              <span class="menu-btn-sub">CHANT GUIDE</span>
            </button>
          </nav>
        </div>
      </section>

      <div class="credits">VAUNDY ASIA ARENA TOUR 2026 &ldquo;HORO&rdquo; · SEOUL FAN CHANT GUIDE (비공식 팬 제작)</div>
    `;

    document.getElementById("guide-btn").addEventListener("click", ()=>{ location.hash = "#/guide"; });

    startCountdown();
  }

  /* ---------------- CHANT GUIDE (song list) ---------------- */
  function renderGuide(){
    app.innerHTML = `
      <div class="guide-page">
        <div class="song-topbar">
          <button class="back-btn" id="back-btn">← 홈으로</button>
          <h1>떼창가이드</h1>
        </div>

        <section class="songs-section">
          <div class="songs-head">
            <div class="eyebrow">CHANT GUIDE</div>
            <h2>떼창 가이드</h2>
            <p>곡을 선택하면 영상에 맞춰 가사 · 떼창 포인트를 확인할 수 있어요</p>
          </div>
          <ul class="song-list">
            ${SONGS.map((s,i)=>`
              <li>
                <button class="song-row" data-id="${s.id}">
                  <span class="song-title">${escapeHtml(s.title)}</span>
                  <span class="song-arrow">→</span>
                </button>
              </li>`).join("")}
          </ul>
        </section>

        <div class="credits">VAUNDY ASIA ARENA TOUR 2026 &ldquo;HORO&rdquo; · SEOUL FAN CHANT GUIDE (비공식 팬 제작)</div>
      </div>
    `;

    document.getElementById("back-btn").addEventListener("click", ()=>{ location.hash = "#/"; });

    app.querySelectorAll(".song-row").forEach(btn=>{
      btn.addEventListener("click", ()=>{ location.hash = `#/song/${btn.dataset.id}`; });
    });
  }

  function startCountdown(){
    const target = new Date(SHOW_DATETIME).getTime();
    function tick(){
      const now = Date.now();
      const diff = target - now;
      const box = document.getElementById("countdown");
      if (!box) { stopCountdown(); return; }
      if (diff <= 0){
        box.outerHTML = `<div class="countdown-done">🎤 공연이 시작되었습니다!</div>`;
        stopCountdown();
        return;
      }
      const d = Math.floor(diff/86400000);
      const h = Math.floor(diff%86400000/3600000);
      const m = Math.floor(diff%3600000/60000);
      const s = Math.floor(diff%60000/1000);
      const dd=document.getElementById("cd-d"), hh=document.getElementById("cd-h"),
            mm=document.getElementById("cd-m"), ss=document.getElementById("cd-s");
      if(dd){dd.textContent=pad(d); hh.textContent=pad(h); mm.textContent=pad(m); ss.textContent=pad(s);}
    }
    tick();
    countdownTimer = setInterval(tick, 1000);
  }
  function stopCountdown(){ if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; } }

  /* ---------------- SONG DETAIL ---------------- */
  const MIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';
  const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';

  let autoScrollEnabled = true;
  let currentSong = null;
  let ytLoadTimeout = null;

  function renderSong(song){
    currentSong = song;
    app.innerHTML = `
      <div class="song-page">
        <div class="song-topbar">
          <button class="back-btn" id="back-btn">← 목록</button>
          <h1>${escapeHtml(song.title)}</h1>
        </div>

        <div class="video-wrap">
          <div class="video-frame" id="video-frame"><div id="yt-player"></div></div>
        </div>

        <div class="lyrics-note"><span class="dot">●</span> 가사를 탭하면 해당 위치로 영상이 이동해요. 재생 중인 소절은 자동으로 하이라이트됩니다.</div>

        <div class="lyrics-legend">
          <span class="legend-item"><span class="legend-icon chant">${MIC_SVG}</span>떼창</span>
        </div>

        <ul class="lyrics-list" id="lyrics-list">
          ${song.lyrics.map((l,i)=>{
            return `
            <li>
              <button class="lyric-line" data-time="${l.time}" data-idx="${i}">
                <span class="lyric-body">
                  <span class="lyric-jp">${escapeHtml(l.jp || "")}</span>
                  <span class="lyric-ko">${renderKo(l.ko)}</span>
                  <span class="lyric-tr">${escapeHtml(l.tr || "")}</span>
                </span>
              </button>
            </li>`;
          }).join("")}
        </ul>

        <div class="player-controls">
          <button class="autoscroll-toggle${autoScrollEnabled ? " active" : ""}" id="autoscroll-btn" aria-label="자동 스크롤 켜기/끄기">
            <span class="autoscroll-label">AUTO SCROLL</span>
            <span class="autoscroll-switch"><span class="autoscroll-knob"></span></span>
          </button>
          <button class="ctrl-btn primary" id="play-toggle-btn" aria-label="재생/일시정지">${PLAY_SVG}</button>
        </div>
      </div>
    `;

    document.getElementById("back-btn").addEventListener("click", ()=>{ location.hash = "#/guide"; });

    document.querySelectorAll(".lyric-line").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const t = Number(btn.dataset.time);
        seekTo(t);
      });
    });

    document.getElementById("autoscroll-btn").addEventListener("click", (e)=>{
      autoScrollEnabled = !autoScrollEnabled;
      e.currentTarget.classList.toggle("active", autoScrollEnabled);
    });

    document.getElementById("play-toggle-btn").addEventListener("click", ()=>{
      if (!ytPlayer || !ytPlayer.getPlayerState) return;
      const state = ytPlayer.getPlayerState();
      if (state === 1){ ytPlayer.pauseVideo(); } else { ytPlayer.playVideo(); }
    });

    loadYouTube(song.youtubeId);
  }

  function formatTime(sec){
    const m = Math.floor(sec/60), s = Math.floor(sec%60);
    return `${m}:${pad(s)}`;
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ko가 문자열이면 그대로, 배열이면 조각별로 떼창(chant) 색을 입혀 이어붙입니다.
  function renderKo(ko){
    if (!ko) return "";
    if (typeof ko === "string") return escapeHtml(ko);
    return ko.map(seg => {
      const cls = seg.tag === "chant" ? "seg-chant" : "";
      return `<span class="${cls}">${escapeHtml(seg.text || "")}</span>`;
    }).join("");
  }

  /* ---------------- YouTube IFrame API ---------------- */
  function ensureYtApi(cb){
    if (window.YT && window.YT.Player){ cb(); return; }
    pendingSongId = cb;
    if (!document.getElementById("yt-iframe-api")){
      const tag = document.createElement("script");
      tag.id = "yt-iframe-api";
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
    }
    window.onYouTubeIframeAPIReady = function(){
      ytReady = true;
      if (pendingSongId) pendingSongId();
    };
  }

  function loadYouTube(videoId){
    clearTimeout(ytLoadTimeout);
    // 광고 차단 확장 프로그램이나 네트워크 문제로 유튜브 API 스크립트 자체가
    // 로드되지 않는 경우를 대비한 안전장치 (8초 안에 준비되지 않으면 안내 표시)
    ytLoadTimeout = setTimeout(()=>{
      if (!ytPlayer){
        showVideoError("영상을 불러오지 못했어요. 네트워크 연결이나 광고 차단 확장 프로그램을 확인한 뒤 다시 시도해주세요. (index.html 파일을 더블클릭해서 바로 열면 file:// 주소라 유튜브 재생이 막힐 수 있어요 — 로컬 서버나 실제 호스팅 주소로 열어서 확인해주세요.)");
      }
    }, 8000);

    ensureYtApi(()=>{
      const target = document.getElementById("yt-player");
      if (!target) return; // 사용자가 이미 다른 화면으로 이동한 경우
      if (ytPlayer){ try{ ytPlayer.destroy(); }catch(e){} ytPlayer = null; }
      try{
        ytPlayer = new YT.Player("yt-player", {
          videoId,
          playerVars: { rel: 0, playsinline: 1 },
          events: {
            onReady: () => { clearTimeout(ytLoadTimeout); startYtPoll(); },
            onStateChange: (e) => updatePlayIcon(e.data),
            onError: (e) => { clearTimeout(ytLoadTimeout); handleYtError(e.data); },
          }
        });
      }catch(err){
        showVideoError("영상을 불러오는 중 오류가 발생했어요. youtubeId 값을 확인해주세요.");
      }
    });
  }

  function handleYtError(code){
    const messages = {
      2:   "유튜브 영상 ID가 올바르지 않아요. youtubeId 값을 다시 확인해주세요.",
      5:   "영상 재생 중 오류가 발생했어요. 새로고침 후 다시 시도해주세요.",
      100: "영상을 찾을 수 없어요. 비공개이거나 삭제된 영상일 수 있어요.",
      101: "이 영상은 외부 사이트 삽입(임베드)이 막혀 있어서 재생할 수 없어요. 다른 영상(공식 뮤직비디오 대신 리릭비디오 등 임베드 허용 영상)으로 교체해주세요.",
      150: "이 영상은 외부 사이트 삽입(임베드)이 막혀 있어서 재생할 수 없어요. 다른 영상(공식 뮤직비디오 대신 리릭비디오 등 임베드 허용 영상)으로 교체해주세요.",
    };
    showVideoError(messages[code] || "영상을 불러오지 못했어요.");
  }

  function showVideoError(message){
    stopYtPoll();
    const frame = document.getElementById("video-frame");
    if (!frame) return;
    frame.innerHTML = `
      <div class="video-error">
        <p>${escapeHtml(message)}</p>
        <button class="video-retry-btn" id="video-retry-btn">다시 시도</button>
      </div>`;
    const retryBtn = document.getElementById("video-retry-btn");
    if (retryBtn){
      retryBtn.addEventListener("click", ()=>{
        frame.innerHTML = `<div id="yt-player"></div>`;
        if (currentSong) loadYouTube(currentSong.youtubeId);
      });
    }
  }

  function updatePlayIcon(state){
    const btn = document.getElementById("play-toggle-btn");
    if (!btn) return;
    btn.innerHTML = state === 1 ? PAUSE_SVG : PLAY_SVG; // 1 = YT.PlayerState.PLAYING
  }

  function seekTo(seconds){
    if (ytPlayer && ytPlayer.seekTo){
      ytPlayer.seekTo(seconds, true);
      ytPlayer.playVideo();
    }
  }

  function startYtPoll(){
    stopYtPoll();
    ytPollTimer = setInterval(()=>{
      if (!ytPlayer || !ytPlayer.getCurrentTime) return;
      const list = document.getElementById("lyrics-list");
      if (!list) { stopYtPoll(); return; }
      const cur = ytPlayer.getCurrentTime();
      const lines = Array.from(list.querySelectorAll(".lyric-line"));
      let activeIdx = -1;
      lines.forEach((el,i)=>{
        const t = Number(el.dataset.time);
        if (cur >= t) activeIdx = i;
      });
      lines.forEach((el,i)=> el.classList.toggle("active", i===activeIdx));
      if (activeIdx >= 0 && autoScrollEnabled){
        lines[activeIdx].scrollIntoView({ block:"center", behavior:"smooth" });
      }
    }, 300);
  }
  function stopYtPoll(){
    clearTimeout(ytLoadTimeout);
    if (ytPollTimer){ clearInterval(ytPollTimer); ytPollTimer=null; }
    if (ytPlayer && ytPlayer.destroy){ try{ ytPlayer.destroy(); }catch(e){} ytPlayer=null; }
  }

  window.addEventListener("hashchange", router);
  router();
</script>
</body>
</html>
