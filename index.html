  /* 위쪽 메뉴 — 연도 하나만 열리는 접이식. 지금 보고 있는 공연의 연도가 기본으로 열린다 */
  function paintPicker(){
    const box = document.getElementById("cset-picker");
    if (!box) return;
    const list = concertItems(), idx = concertIndex();
    const years = [...new Set(list.map(it => it.year))];
    app.querySelectorAll(".cset-kind").forEach(k=>{
      const on = k.dataset.kind === concertKind;
      k.classList.toggle("active", on);
      k.setAttribute("aria-pressed", on ? "true" : "false");
    });
    const open = years.includes(concertOpenYear) ? concertOpenYear : (list[idx] && list[idx].year);

    // 연도는 한 줄에 칩으로, 고른 연도의 공연만 바로 아래에 보여 준다
    let rows = list.map((it, i)=>({ it, i })).filter(o => o.it.year === open);

    // 페스는 한 해에 40개가 넘기도 해서, 공연이 있는 달만 칩으로 한 줄 더 보여 준다
    let months = [], monthRow = "";
    if (concertKind === "fest"){
      months = [...new Set(rows.map(o => Number(o.it.date.slice(5, 7))))].sort((a,b)=> a - b);
      const has = months.includes(concertOpenMonth);
      if (!has && concertOpenMonth !== 0) concertOpenMonth = 0;
      monthRow = months.length < 2 ? "" : `
        <div class="cset-mons" role="group" aria-label="달 고르기">
          <button class="cset-mon${concertOpenMonth === 0 ? " active" : ""}" type="button" data-month="0">전체 ${rows.length}</button>
          ${months.map(m => `<button class="cset-mon${concertOpenMonth === m ? " active" : ""}" type="button" data-month="${m}">${m}월</button>`).join("")}
        </div>`;
      if (concertOpenMonth) rows = rows.filter(o => Number(o.it.date.slice(5, 7)) === concertOpenMonth);
    }

    box.innerHTML = `
      <div class="cset-yrs" role="group" aria-label="연도 고르기">
        ${years.map(y => `<button class="cset-yr-chip${y === open ? " active" : ""}" type="button" data-year="${y}" aria-pressed="${y === open ? "true" : "false"}">${String(y).slice(2)}</button>`).join("")}
      </div>
      ${monthRow}
      <div class="cset-yr-panel${concertKind === "fest" ? " scroll" : ""}">
        ${concertKind === "tour"
          ? `<div class="cset-tabs">${rows.map(o=>`
              <button class="cset-tab${o.i === idx ? " active" : ""}" type="button" data-pick="${o.i}"><b>${escapeHtml(o.it.short)}</b></button>`).join("")}</div>`
          : `<ul class="cset-fests">${rows.map(o=>`
              <li><button class="cset-fest${o.i === idx ? " active" : ""}" type="button" data-pick="${o.i}">
                <span class="cset-fest-date">${escapeHtml(o.it.date.slice(5))}</span>
                <span class="cset-fest-name">${escapeHtml(o.it.name)}<small>${escapeHtml(o.it.venue)}</small></span>
              </button></li>`).join("")}</ul>`}
      </div>`;

    box.querySelectorAll(".cset-mon").forEach(b => b.addEventListener("click", ()=>{
      concertOpenMonth = Number(b.dataset.month);
      paintPicker();
    }));

    box.querySelectorAll(".cset-yr-chip").forEach(b => b.addEventListener("click", ()=>{
      concertOpenYear = Number(b.dataset.year);   // 고른 연도만 아래에 펼쳐진다
      concertOpenMonth = 0;                       // 연도를 바꾸면 달 고르기는 '전체'로
      paintPicker();
    }));
    box.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", ()=>{
      concertPick(Number(b.dataset.pick));
      concertOpenYear = open;
      paintPicker();
      paintConcert();     // 보던 자리 그대로 둔다 (자동으로 스크롤하지 않음)
    }));
  }

  /* 곡을 보고 '뒤로' 왔을 때 보던 자리로 (글꼴이 늦게 잡혀도 맞도록 몇 번 더) */
  function restoreConcertsScroll(){
    const y = concertsScrollY;
    if (!(y > 0)) return;
    const restore = ()=>{
      const max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
      window.scrollTo(0, Math.min(y, max));
    };
    requestAnimationFrame(restore);
    setTimeout(restore, 80);
    setTimeout(restore, 260);
  }

  /* ---------------- SETLIST (스포일러) ----------------
     보기 방식을 직접 고르기 전까지 목록 데이터를 화면에 넣지 않는다. */
  let setlistScrollHandler = null;

  /* ── 곡 화면에서 '뒤로'를 눌렀을 때 돌아갈 곳 ──────────────────
     새로고침 뒤에는 셋리스트 맥락을 복원하지 않아 순서가 노출되지 않는다. */
  let songFrom = "guide";
  function setSongFrom(v){
    songFrom = (v === "setlist" || v === "concerts") ? v : "guide";
  }
  function songBackHash(){
    if (songFrom === "setlist") return "#/setlist";
    if (songFrom === "concerts") return "#/concerts";   // 콘서트 셋리스트에서 들어온 곡
    return "#/guide";
  }

  function teardownSetlistReveal(){
    if (setlistScrollHandler){
      window.removeEventListener("scroll", setlistScrollHandler);
      setlistScrollHandler = null;
    }
  }

  function setlistTitle(entry){
    const s = SONGS.find(x => x.id === entry.id);
    return s ? s.title : (entry.title || entry.id);
  }

  /* ── 셋리스트 보기 상태 ──────────────────────────────────────
     mode "order"  : 실제 공연 순서 (번호 있음, 토·일로 갈린 자리도 그대로)
     mode "random" : 순서를 감추고 곡을 하나씩 섞어서 보여 줌
                     (번호 없음, 토·일 구분도 없음 — 둘 다 순서 단서가 되므로)

     보기 방식은 가림막을 걷기 '전에' 고른다. 스크롤만 내려도 목록이 드러나면
     랜덤을 고르기 전에 실제 순서를 보게 되어 스포가 되기 때문이다.

     섞은 순서는 저장해 둔다. 곡을 보고 뒤로 돌아와도 같은 화면이 다시 나오므로
     실제 순서가 드러나지 않는다. */
  let setlistMode     = "random";
  let setlistShuffle  = null;   // 섞은 순서 (곡 키 배열)
  let setlistRevealed = false;  // 가림막을 이미 걷었는지 (이번 방문 동안)
  let setlistScrollY  = 0;      // 곡을 보러 가기 전 스크롤 위치

  /* 홈으로 나가면 셋리스트를 처음 상태로 되돌린다.
     · 곡을 보러 갔다 '뒤로' 오는 건 보던 화면 그대로 (중간에 끊기면 불편하므로)
     · 홈까지 나갔다가 다시 들어오면 → 스포주의 화면부터 다시
     옆 사람에게 폰을 건네줬을 때 실수로 순서가 보이는 일을 막아 준다. */
  function resetSetlistSpoiler(){
    setlistRevealed = false;
    setlistScrollY  = 0;
    setlistMode     = "random";
  }
  /* 셋리스트에서 곡을 눌러 들어갔을 때, 그 곡이 셋리스트의 몇 번째였는지.
     이전/다음 곡이 셋리스트 순서를 그대로 따라가게 하려고 기억해 둔다. */
  let setlistPos = (()=>{
    const n = parseInt(store("horo-set-pos"), 10);
    return Number.isFinite(n) && n >= 0 ? n : -1;
  })();
  function setSetlistPos(i){
    setlistPos = i;
    store("horo-set-pos", String(i));
  }

  /* 토·일로 갈린 자리까지 풀어서 곡 하나하나를 낱개로 만든다.
     랜덤에서는 이 낱개들을 통째로 섞기 때문에 "몇 번째 자리에서 곡이 갈렸는지"가
     드러나지 않는다. */
  function setlistFlat(){
    const out = [];
    SETLIST.items.forEach(it =>
      it.songs.forEach((e, i) => out.push({ key: it.n + ":" + i, id: e.id }))
    );
    return out;
  }

  function makeSetlistShuffle(){
    const keys = setlistFlat().map(x => x.key);
    for (let i = keys.length - 1; i > 0; i--){          // 피셔–예이츠 섞기
      const j = Math.floor(Math.random() * (i + 1));
      const t = keys[i]; keys[i] = keys[j]; keys[j] = t;
    }
    setlistShuffle = keys;
    store("horo-set-shuffle2", JSON.stringify(keys));
  }

  function ensureSetlistShuffle(){
    const flat = setlistFlat();
    if (setlistShuffle && setlistShuffle.length === flat.length) return;
    const saved = store("horo-set-shuffle2");
    if (saved){
      try {
        const arr = JSON.parse(saved);
        if (Array.isArray(arr) && arr.length === flat.length){
          setlistShuffle = arr;
          return;
        }
      } catch(e){ /* 저장값이 깨졌으면 새로 섞는다 */ }
    }
    makeSetlistShuffle();
  }

  function setlistRandomSongs(){
    ensureSetlistShuffle();
    const byKey = new Map(setlistFlat().map(x => [x.key, x]));
    return setlistShuffle.map(k => byKey.get(k)).filter(Boolean);
  }

  /* 셋리스트 화면에 보이는 그대로의 곡 순서.
     · 공연 순서 모드 → 실제 공연 순서 (토·일로 갈린 자리는 낱개로 풀어서)
     · 랜덤 모드      → 그때 섞어 둔 바로 그 순서
     가이드가 없는 곡은 눌러도 안 열리므로 빼 둔다. */
  function setlistNavList(){
    const list = (setlistMode === "random") ? setlistRandomSongs() : setlistFlat();
    return list.filter(x => SONGS.some(s => s.id === x.id));
  }

  /* 공연 순서 한 줄 — 번호 + 제목. 토·일로 갈린 자리는 둘을 묶어서 보여 준다. */
  function setlistRowHtml(item){
    if (item.songs.length === 1){
      const e = item.songs[0];
      const exists = SONGS.some(s => s.id === e.id);
      return `
        <li class="set-item">
          <button class="set-row" data-id="${escapeHtml(e.id)}" ${exists ? "" : "disabled"}>
            <span class="set-num">${pad(item.n)}</span>
            <span class="set-title">${escapeHtml(setlistTitle(e))}</span>
            <span class="set-go">${exists ? "›" : ""}</span>
          </button>
        </li>`;
    }
    return `
      <li class="set-item">
        <div class="set-split">
          <div class="set-split-head">
            <span class="set-num">${pad(item.n)}</span>
            <span class="set-split-note">날짜별로 다른 곡</span>
          </div>
          ${item.songs.map(e=>{
            const exists = SONGS.some(s => s.id === e.id);
            return `
            <button class="set-row sub" data-id="${escapeHtml(e.id)}" ${exists ? "" : "disabled"}>
              <span class="day-chip ${e.day === "일" ? "sun" : ""}">${e.day}</span>
              <span class="set-title">${escapeHtml(setlistTitle(e))}</span>
              <span class="set-go">${exists ? "›" : ""}</span>
            </button>`;
          }).join("")}
        </div>
      </li>`;
  }

  /* 랜덤 한 줄 — 번호도 날짜 표시도 없이 곡 제목만 */
  function setlistRandomRowHtml(x){
    const exists = SONGS.some(s => s.id === x.id);
    return `
      <li class="set-item">
        <button class="set-row" data-id="${escapeHtml(x.id)}" ${exists ? "" : "disabled"}>
          <span class="set-num rand">♪</span>
          <span class="set-title">${escapeHtml(setlistTitle(x))}</span>
          <span class="set-go">${exists ? "›" : ""}</span>
        </button>
      </li>`;
  }

  /* 목록만 다시 그린다 (보기 방식을 바꿀 때 화면 전체를 새로 그리지 않도록) */
  function paintSetlist(){
    const listEl = document.getElementById("set-list");
    if (!listEl) return;
    const isOrder = setlistMode === "order";
    const total = setlistFlat().length;

    listEl.innerHTML = isOrder
      ? SETLIST.items.map(setlistRowHtml).join("")
      : setlistRandomSongs().map(setlistRandomRowHtml).join("");

    const countEl = document.getElementById("setlist-count");
    if (countEl) countEl.textContent = isOrder
      ? `본편 ${SETLIST.items.length}곡 · 총 ${total}곡`
      : `총 ${total}곡`;

    const metaEl = document.getElementById("setlist-mode-meta");
    if (metaEl) metaEl.textContent = isOrder ? "SPOILER" : "RANDOM";

    const shufEl = document.getElementById("set-shuffle");
    if (shufEl) shufEl.hidden = isOrder;

    const desc = document.getElementById("setlist-desc");
    if (desc) desc.innerHTML = isOrder
      ? `${escapeHtml(SETLIST.dates)}<br>곡을 누르면 응원가이드로 넘어가요`
      : `${escapeHtml(SETLIST.dates)}<br><b>공연 순서는 감춘 채</b> 섞어서 보여 주고 있어요`;

    const note = document.getElementById("setlist-note");
    if (note) note.innerHTML = isOrder
      ? `※ 팬 기록을 정리한 비공식 셋리스트입니다. <b>서울 공연도 같은 순서</b>였어요.<br>
         ※ 날짜별로 다른 곡이 있었던 자리는 <b>토</b> · <b>일</b>로 나눠 두었습니다.`
      : `※ 팬 기록을 정리한 비공식 셋리스트입니다. <b>서울 공연도 같은 순서</b>였어요.<br>
         ※ 순서도, 날짜별로 갈린 자리도 감춰 두었습니다. 전부 보려면 위에서 <b>공연 순서</b>를 눌러 주세요.`;

    app.querySelectorAll(".set-mode").forEach(b=>{
      const on = b.dataset.mode === setlistMode;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });

    // 눌린 줄이 셋리스트의 몇 번째인지 같이 기억해 둔다 (이전/다음 곡용)
    let pos = 0;
    listEl.querySelectorAll(".set-row").forEach(btn=>{
      if (btn.disabled) return;          // 가이드 없는 곡은 순서에서 뺀다
      const myPos = pos++;
      btn.addEventListener("click", ()=>{
        const target = SONGS.find(s => s.id === btn.dataset.id);
        if (!target) return;
        setlistScrollY = window.scrollY;   // 돌아왔을 때 보던 자리로
        setSongFrom("setlist");
        setSetlistPos(myPos);
        gotoSong(target);
      });
    });
  }

  function renderSetlist(){
    app.innerHTML = `
      <div class="setlist-page">
        <div class="song-topbar">
          <button class="back-btn" id="setlist-back-btn">← 홈으로</button>
          <h1>셋리스트</h1>
          ${themeToggleHtml()}
        </div>

        <section class="spoiler-hero">
          <div class="spoiler-mark">${WARN_SVG}</div>
          <h2 class="spoiler-title">스포주의</h2>
          <p class="spoiler-desc">
            이 화면에는 <b>${SETLIST.label}의 곡명과 순서</b>가 있어요.<br>
            보기 방식을 고르기 전에는 내용이 표시되지 않습니다.
          </p>
          <button class="spoiler-safe" type="button" id="spoiler-safe">스포 없이 홈으로</button>

          <div class="spoiler-choice">
            <button class="spoiler-open soft" type="button" data-mode="random">
              <b>곡명만 보기<span class="tag">곡명 스포</span></b>
              <span>공연 순서는 섞어서 표시</span>
            </button>
            <button class="spoiler-open" type="button" data-mode="order">
              <b>공연 순서로 보기<span class="tag">전체 스포</span></b>
              <span>곡명과 순서 모두 공개</span>
            </button>
          </div>
        </section>

        <section class="setlist-body" id="setlist-body" hidden inert>
          <div class="setlist-head">
            <h2>${escapeHtml(SETLIST.label)} 셋리스트</h2>
            <p id="setlist-desc"></p>
          </div>

          <div class="set-modes" role="group" aria-label="셋리스트 보기 방식">
            <button class="set-mode" type="button" data-mode="order">공연 순서<span class="set-mode-badge">스포</span></button>
            <button class="set-mode" type="button" data-mode="random">랜덤 순서</button>
          </div>
          <div class="set-order-confirm" id="set-order-confirm" role="group" aria-label="공연 순서 공개 확인" hidden>
            <p>공연 순서가 그대로 공개됩니다.</p>
            <button type="button" id="set-order-cancel">취소</button>
            <button type="button" id="set-order-reveal">순서 공개</button>
          </div>

          <div class="set-shuffle" id="set-shuffle" hidden>
            <span><b>순서를 섞어 두었어요.</b> 어떤 곡을 하는지만 보고, 순서는 공연 당일의 즐거움으로 남겨 두세요.</span>
            <button type="button" id="set-reshuffle">다시 섞기</button>
          </div>

          <div class="setlist-meta">
            <span id="setlist-count"></span>
            <span id="setlist-mode-meta">SPOILER</span>
          </div>

          <ul class="set-list" id="set-list"></ul>

          <p class="setlist-note" id="setlist-note"></p>
        </section>
      </div>
    `;

    document.getElementById("setlist-back-btn").addEventListener("click", ()=>{ location.hash = "#/"; });
    document.getElementById("spoiler-safe").addEventListener("click", ()=>{ location.hash = "#/"; });

    const body = document.getElementById("setlist-body");
    const orderConfirm = document.getElementById("set-order-confirm");

    /* 보기 방식을 고른 순간에만 목록 데이터를 만들고 표시한다. */
    const reveal = (mode, smooth)=>{
      setlistMode = (mode === "order") ? "order" : "random";
      setlistRevealed = true;
      paintSetlist();
      body.hidden = false;
      body.inert = false;
      if (smooth !== false) body.scrollIntoView({ behavior:"smooth", block:"start" });
    };

    app.querySelectorAll(".spoiler-choice .spoiler-open").forEach(b=>{
      b.addEventListener("click", ()=> reveal(b.dataset.mode));
    });

    // 이미 펼친 뒤 보기 방식을 바꿀 때
    app.querySelectorAll(".set-mode").forEach(b=>{
      b.addEventListener("click", ()=>{
        if (b.dataset.mode === "order" && setlistMode !== "order"){
          orderConfirm.hidden = false;
          document.getElementById("set-order-cancel").focus();
          return;
        }
        orderConfirm.hidden = true;
        if (setlistMode === b.dataset.mode) return;
        setlistMode = b.dataset.mode === "random" ? "random" : "order";
        paintSetlist();
      });
    });
    document.getElementById("set-order-cancel").addEventListener("click", ()=>{
      orderConfirm.hidden = true;
      app.querySelector('.set-mode[data-mode="order"]').focus();
    });
    document.getElementById("set-order-reveal").addEventListener("click", ()=>{
      orderConfirm.hidden = true;
      setlistMode = "order";
      paintSetlist();
      app.querySelector('.set-mode[data-mode="order"]').focus();
    });
    document.getElementById("set-reshuffle").addEventListener("click", ()=>{
      makeSetlistShuffle();
      paintSetlist();
    });

    /* 곱을 보고 '뒤로' 돌아온 경우 — 가림막과 스크롤 위치를 그대로 되살린다.
       (보기 방식도 그대로라 실제 순서가 잠깐이라도 비치지 않는다)
       홈까지 나갔다 온 경우에는 resetSetlistSpoiler() 가 이미 초기화해 둔다. */
    if (setlistRevealed){
      reveal(setlistMode, false);
      if (setlistScrollY > 0){
        const y = setlistScrollY;
        // 글꼴·레이아웃이 늦게 잡히면 페이지가 짧아 위치가 잘리므로 몇 번 더 맞춘다
        const restore = ()=>{
          const max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
          window.scrollTo(0, Math.min(y, max));
        };
        requestAnimationFrame(restore);
        setTimeout(restore, 80);
        setTimeout(restore, 260);
      }
    }
  }

  /* 알약 안의 두 글자를 바꿔 준다. clock 을 비우면 왼쪽 글자만 크게 보인다. */
  function setPill(dday, clock, mode){
    const pill  = document.querySelector(".cd-pill");
    const dEl   = document.getElementById("cd-dday");
    const cEl   = document.getElementById("cd-clock");
    if (!pill || !dEl || !cEl) return;
    dEl.textContent = dday;
    cEl.textContent = clock || "";
    pill.classList.toggle("is-live", mode === "live");
    pill.classList.toggle("is-end",  mode === "end");
  }

  /* 한국 날짜 기준 "YYYY-MM-DD" */
  function kstDateKey(d){
    return new Intl.DateTimeFormat("en-CA", {
      timeZone:"Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit"
    }).format(d);
  }
  /* 한국 날짜 기준으로 두 시점이 며칠 차이인지 (오늘=0, 내일=1) */
  function kstDayGap(from, to){
    const ymd = (t)=>{
      const k = kstDateKey(new Date(t));
      return Date.UTC(+k.slice(0,4), +k.slice(5,7) - 1, +k.slice(8,10));
    };
    return Math.max(0, Math.round((ymd(to) - ymd(from)) / 86400000));
  }

  /* ── 라이브 일정 계산 ─────────────────────────────────────────
     LIVE_SCHEDULE 의 하루하루를 시각(ms)으로 풀어 둔다.
       startMs : 개연 시각 (모르면 null)
       dayFrom / dayTo : 공연지 기준 그날 0시 ~ 다음날 0시
       endMs   : 이 시각이 지나면 "끝난 공연" (시각을 알면 개연+3시간,
                 이벤트 출연 순서만 아는 경우 +75분, 모르면 그날 자정) */
  const DOW_KO = ["일","월","화","수","목","금","토"];
  const DOW_EN = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  function liveDays(){
    const out = [];
    LIVE_SCHEDULE.forEach((grp, gi)=>{
      grp.days.forEach((d, di)=>{
        const tz = d.tz || "+09:00";
        const dayFrom = new Date(`${d.date}T00:00:00${tz}`).getTime();
        const dayTo   = dayFrom + 86400000;
        const startMs = d.start ? new Date(`${d.date}T${d.start}:00${tz}`).getTime() : null;
        const endMs   = startMs !== null ? startMs + (grp.slot ? 75 : 180) * 60000 : dayTo;
        const dow     = new Date(`${d.date}T12:00:00${tz}`).getUTCDay();
        out.push({ gi, di, grp, d, dayFrom, dayTo, startMs, endMs, dow,
                   cancelled: !!grp.cancelled });
      });
    });
    return out;
  }
  /* 지금 카운트다운이 봐야 할 공연 하루 (취소된 공연은 건너뜀) */
  function focusLiveDay(now){
    return liveDays().find(x => !x.cancelled && now < x.endMs) || null;
  }

  /* "熱闘甲子園 presents 熱闘JAM 2026" → "熱闘JAM 2026" (좁은 칸에서 핵심이 잘리지 않게) */
  const shortLiveTitle = (t)=> String(t).replace(/^.*presents\s*/i, "");

  /* 날짜 모양 "10.24" */
  const mdOf = (date)=> date.slice(5,7) + "." + date.slice(8,10);

  /* ── 홈 카드: 라이브 일정 목록 ───────────────────────────────
     같은 공연장 연속 공연은 한 줄로 묶어 보여 준다(원래 표도 그렇게 묶여 있음).
     끝난 공연은 빼고, 해가 바뀌는 곳에는 연도 구분선을 넣는다. */
  function liveListHtml(now){
    const focus = focusLiveDay(now);
    const rows = [];
    let lastYear = kstDateKey(new Date(now)).slice(0,4);
    LIVE_SCHEDULE.forEach((grp, gi)=>{
      const days = liveDays().filter(x => x.gi === gi);
      if (days.every(x => now >= x.endMs)) return;           // 다 끝난 공연
      const y = grp.days[0].date.slice(0,4);
      if (y !== lastYear){ rows.push(`<li class="live-year">${y}</li>`); lastYear = y; }

      // 날짜 하나하나가 그날의 공식 상세 페이지로 가는 링크 (이틀 공연이면 두 줄)
      const dates = days.map(x => `
              <a class="live-day${now >= x.endMs ? " past" : ""}" href="${x.d.url}" target="_blank" rel="noopener"
                 aria-label="${mdOf(x.d.date)}(${DOW_KO[x.dow]}) 공식 상세 안내"><b>${mdOf(x.d.date)}</b><small>${DOW_KO[x.dow]}</small></a>`).join("");

      const isNext = focus && focus.gi === gi;
      const series = grp.title ? shortLiveTitle(grp.title) : (LIVE_SERIES[grp.series] || "");
      let tag = "";
      if (grp.cancelled)    tag = `<span class="live-tag cancel">공연 취소</span>`;
      else if (isNext)      tag = `<span class="live-tag next">NEXT</span>`;
      else if (grp.soldout) tag = `<span class="live-tag">SOLD OUT</span>`;
      const note = grp.days.map(d => d.note).filter(Boolean)[0];

      rows.push(`
        <li class="live-item${isNext ? " is-next" : ""}${grp.cancelled ? " is-cancel" : ""}">
          <span class="live-date">${dates}</span>
          <a class="live-body" href="${(days.find(x => now < x.endMs) || days[0]).d.url}" target="_blank" rel="noopener">
            <span class="live-main">
              <span class="live-series">${escapeHtml(series)}</span>
              <span class="live-venue">${escapeHtml(grp.venue)} · ${escapeHtml(grp.place)}</span>
              ${note ? `<span class="live-note">${escapeHtml(note)}</span>` : ""}
            </span>
            ${tag}
          </a>
        </li>`);
    });
    if (!rows.length) rows.push(`<li class="live-empty">발표된 다음 공연이 아직 없어요.</li>`);
    return `
      <p class="way-note">공식 사이트에 발표된 공연입니다. 공연을 누르면 그날의 <b>공식 상세 안내</b>가 열려요.</p>
      <ul class="live-list">${rows.join("")}</ul>
      <p class="info-footnote">※ 2026.09.21 기준 · 팬이 옮겨 적은 일정입니다. 시간·티켓은 공식 안내가 우선합니다.
        <a href="${LIVE_SOURCE_URL}" target="_blank" rel="noopener">공식 LIVE 일정 ↗</a></p>`;
  }

  /* 셋리스트 표의 일본어 원제로 응원가이드 곡을 찾는다 (없으면 null) */
  let songByJp = null;
  function findSongByJp(name){
    if (!songByJp){
      songByJp = new Map();
      SONGS.forEach(sg => {
        const m = String(sg.title).match(/\(([^()]*)\)\s*$/);
        const key = (m ? m[1] : sg.title).trim().toLowerCase().replace(/\s+/g, "");
        songByJp.set(key, sg);
      });
    }
    return songByJp.get(String(name).trim().toLowerCase().replace(/\s+/g, "")) || null;
  }

  /* ── 히어로: 다음 공연 표시 ──────────────────────────────────
     카운트다운이 세는 공연(같은 공연장 이틀이면 이틀 모두)을 날짜·시각 줄로 보여 준다. */
  let nextLiveGi = -2;
  function paintNextLive(focus){
    const box = document.getElementById("next-live");
    const cap = document.getElementById("next-cap");
    if (!box) return;
    const gi = focus ? focus.gi : -1;
    if (gi !== nextLiveGi){
      nextLiveGi = gi;
      if (!focus){
        box.innerHTML = "";
        if (cap) cap.textContent = "";
      } else {
        const grp = focus.grp;
        if (cap) cap.textContent = "NEXT LIVE · " + (grp.title ? shortLiveTitle(grp.title) : (LIVE_SERIES_SHORT[grp.series] || ""));
        const days = liveDays().filter(x => x.gi === gi);
        box.innerHTML = days.map(x => `
            <a class="show-row" href="${x.d.url}" target="_blank" rel="noopener"
               aria-label="${mdOf(x.d.date)} 공식 상세 안내">
              <span class="show-day">${mdOf(x.d.date)}<span class="dow">${DOW_EN[x.dow]}</span></span>
              <span class="show-time">${x.d.start ? x.d.start : "TBA"}<span class="go">↗</span></span>
            </a>`).join("")
          + `<a class="show-venue" href="${focus.d.url}" target="_blank" rel="noopener">${escapeHtml(grp.venue)} · ${escapeHtml(grp.place)}</a>`;
      }
    }
  }

  /* ── 오늘의 공연 — 실시간 현황 ────────────────────────────────
     공연지 날짜로 "오늘" 공연이 있으면 카드가 나타나고, 개장 · 개연 중
     지금 어느 단계인지와 다음 단계까지 남은 시간을 1초마다 갱신한다.
     시각은 공식 안내에 적힌 현지 시각 그대로 보여 준다
     (일본은 한국과 같은 시각, 홍콩·타이베이는 한국보다 1시간 늦다). */
  function todaySteps(x){
    const d = x.d, steps = [];
    if (d.open) steps.push({ t:d.open, label:"개장 · 입장 시작" });
    if (x.grp.slot){
      if (d.eventStart) steps.push({ t:d.eventStart, label:"이벤트 시작" });
      if (d.start)      steps.push({ t:d.start, label:"Vaundy 출연", main:true });
    } else if (x.grp.series === "event"){
      if (d.start) steps.push({ t:d.start, label:"이벤트 시작", sub:"Vaundy 출연 순서 미정", main:true });
    } else if (d.start){
      steps.push({ t:d.start, label:"공연 시작", main:true });
    }
    const tz = d.tz || "+09:00";
    steps.forEach(v => { v.ms = new Date(`${d.date}T${v.t}:00${tz}`).getTime(); });
    return steps;
  }
  const leftText = (ms)=>{
    const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000), sec = Math.floor(ms%60000/1000);
    return h > 0 ? `${h}시간 ${pad(m)}분 ${pad(sec)}초` : `${m}분 ${pad(sec)}초`;
  };

  let todayBuiltKey = null;
  function updateTodayCard(now){
    const card = document.getElementById("today-card");
    if (!card) return;
    const x = liveDays().find(v => !v.cancelled && now >= v.dayFrom && now < v.dayTo);
    if (!x){ card.hidden = true; todayBuiltKey = null; return; }
    card.hidden = false;

    const key = x.d.date;
    if (todayBuiltKey !== key){
      todayBuiltKey = key;
      const name = x.grp.title ? shortLiveTitle(x.grp.title) : (LIVE_SERIES_SHORT[x.grp.series] || "");
      document.getElementById("today-title").textContent =
        `오늘 공연 · ${Number(key.slice(5,7))}/${Number(key.slice(8,10))}(${DOW_KO[x.dow]}) · ${name}`;
    }

    const steps   = todaySteps(x);
    const list    = document.getElementById("today-list");
    const nowEl   = document.getElementById("today-now");
    const venue   = `${escapeHtml(x.grp.venue)} · ${escapeHtml(x.grp.place)}`;
    const link    = `<a class="today-link" href="${x.d.url}" target="_blank" rel="noopener">공식 안내 ↗</a>`;

    if (!steps.length){                    // 시각이 발표되지 않은 날
      list.innerHTML = "";
      nowEl.innerHTML = `<b>${venue}</b><br>개장·개연 시각은 아직 발표되지 않았어요. ${link}`;
      return;
    }

    const nextIdx = steps.findIndex(v => v.ms > now);
    const ended   = nextIdx === -1 && now >= x.endMs;       // 공연까지 끝났으면 전부 흐리게
    const curIdx  = ended ? steps.length : (nextIdx === -1 ? steps.length - 1 : nextIdx - 1);
    list.innerHTML = steps.map((v,i)=>{
      const cls = i < curIdx ? "past" : (i === curIdx ? "now" : "");
      const sub = v.sub ? ` <small>${escapeHtml(v.sub)}</small>` : "";
      return `<li class="${cls}${v.main ? " main" : ""}"><span class="t">${v.t}</span><span class="l">${escapeHtml(v.label)}${sub}</span></li>`;
    }).join("");

    if (nextIdx === -1){
      nowEl.innerHTML = now < x.endMs
        ? `<b>지금 공연 중</b> · ${venue}`
        : `<b>오늘 공연은 끝났을 시간이에요.</b> 고생 많으셨어요!`;
      return;
    }
    const cur = curIdx >= 0 ? `<b>${escapeHtml(steps[curIdx].label)}</b> 진행 중<br>` : `<b>${venue}</b><br>`;
    nowEl.innerHTML = `${cur}${escapeHtml(steps[nextIdx].label)}까지 <span class="left">${leftText(steps[nextIdx].ms - now)}</span> ${curIdx < 0 ? link : ""}`;
  }

  /* 끝난 날은 흐리게, 진행 중인 날은 주황으로 */
  function markShowRows(focus, now){
    const rows = document.querySelectorAll("#next-live .show-row");
    if (!focus) return;
    const days = liveDays().filter(x => x.gi === focus.gi);
    rows.forEach((row, i)=>{
      const x = days[i];
      if (!x) return;
      const live = x.startMs !== null ? (now >= x.startMs && now < x.endMs)
                                      : (now >= x.dayFrom && now < x.dayTo);
      row.classList.toggle("live", live);
      row.classList.toggle("past", !live && now >= x.endMs);
    });
  }

  /* ── 준비물 체크 · 주소 복사 · 공유 · 오프라인 상태 ───────────── */
  function setupHomeExtras(){
    // 주소 복사
    const copyBtn = document.getElementById("copy-addr");
    if (copyBtn){
      copyBtn.addEventListener("click", async ()=>{
        const addr = "인천 중구 공항문화로 127 인스파이어 아레나";
        try { await navigator.clipboard.writeText(addr); copyBtn.textContent = "복사됨 ✓"; }
        catch(e){ copyBtn.textContent = addr; }
        setTimeout(()=>{ copyBtn.textContent = "주소 복사"; }, 1600);
      });
    }

    // 공유하기 — 공유 시트가 없으면 링크 복사로 대체
    const shareBtn = document.getElementById("share-btn");
    if (shareBtn){
      shareBtn.addEventListener("click", async ()=>{
        const data = {
          title: "VAUNDY \"HORO\" SEOUL 응원가이드",
          text: "곡별 가사와 떼창·박수·손 흔들기 포인트를 영상에 맞춰 볼 수 있어요",
          url: location.href.split("#")[0]
        };
        try {
          if (navigator.share){ await navigator.share(data); return; }
          await navigator.clipboard.writeText(data.url);
          showBanner("링크를 <b>복사</b>했어요. 붙여넣기로 공유해 주세요.", "확인", hideBanner);
        } catch(e){ /* 사용자가 취소한 경우 등 — 아무것도 하지 않음 */ }
      });
    }

  }


  /* ── 곡 목록 검색 ─────────────────────────────────────────────
     한글 제목, 괄호 안 원제(일본어·영문), 그리고 초성(ㅁㅎ → 무희)까지 찾습니다. */
  const CHO_TABLE = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  function toCho(str){
    return [...String(str)].map(ch=>{
      const c = ch.charCodeAt(0);
      return (c >= 0xAC00 && c <= 0xD7A3) ? CHO_TABLE[Math.floor((c - 0xAC00) / 588)] : ch;
    }).join("");
  }
  const squash = (str) => String(str).toLowerCase().replace(/\s+/g, "");

  /* 고른 순서대로 목록을 다시 그린다 (검색어는 그대로 유지) */
  function paintSongList(){
    const ul = document.getElementById("song-list");
    if (!ul) return;

    ul.innerHTML = sortedSongs().map(s=>`
      <li data-no="${songNo(s)}"${songHasCall(s) ? "" : ' data-nocall="1"'}>
        <button class="song-row" data-id="${escapeHtml(s.id)}">
          <span class="song-num">${pad(songNo(s))}</span>
          <span class="song-title">${escapeHtml(s.title)}</span>
          ${songMarksHtml(s)}
        </button>
      </li>`).join("");

    // 곡을 탭한 그 순간 바로 재생을 시작시킨다 (모바일 소리 허용을 위해)
    ul.querySelectorAll(".song-row").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const target = SONGS.find(x => x.id === btn.dataset.id);
        if (!target) return;

        gotoSong(target);

    });

    // 어느 칩이 켜져 있는지 + 떼창 방향 표시
    app.querySelectorAll(".song-sort").forEach(b=>{
      const on = (b.dataset.sort === "chant" || b.dataset.sort === "title")
        ? songSort.startsWith(b.dataset.sort)
        : b.dataset.sort === songSort;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    const chantBtn = document.getElementById("sort-chant");
    if (chantBtn){
      const dir = songSort === "chant-asc" ? "적은 순" : "많은 순";
      chantBtn.innerHTML = songSort.startsWith("chant")
        ? `떼창 <span class="dir">${dir}</span>`
        : "떼창";
    }

    if (titleBtn){

      titleBtn.innerHTML = songSort.startsWith("title")
        ? `가나다 <span class="dir">${dir}</span>`

  /* 검색어에 맞춰 보이고 숨긴다 (목록을 다시 그린 뒤에도 그대로 적용된다) */
  function applyGuideFilter(){
    const input = document.getElementById("song-search-input");
    const clear = document.getElementById("song-search-clear");
    const count = document.getElementById("song-count");
    const empty = document.getElementById("song-empty");
    const items = document.querySelectorAll("#song-list > li");
    if (!input || !items.length) return;

    // "5", "05", "5번" 모두 5번 곡으로 인식
    const q = squash(input.value).replace(/번$/, "");
    const isNum = /^\d{1,2}$/.test(q);
    let hit = 0;

    items.forEach(li=>{
      const title = li.querySelector(".song-title").textContent;
      const no = li.dataset.no;
      const ok = !q || (isNum
        ? (no === String(Number(q)) || pad(Number(no)) === q)      // 번호 검색
        : (squash(title).includes(q) || squash(toCho(title)).includes(q)));  // 제목 · 초성
      // 검색 중에는 숨김을 잠시 풀어 준다 (찾는 곡이 안 나오면 더 헷갈리니까)
      const show = ok && (!!q || !hideNoCall || li.dataset.nocall !== "1");
      li.hidden = !show;
      if (show) hit++;
    });

    const hid = (hideNoCall && !q) ? noCallCount() : 0;
    if (count) count.textContent = q
      ? `검색 결과 ${hit}곡`
      : (hid ? `응원콜 ${hit}곡 · ${hid}곡 숨김` : `전체 ${hit}곡`);

    const toggle = document.getElementById("nocall-toggle");
    if (toggle){
      const n = noCallCount();
      toggle.hidden = n === 0;
      toggle.textContent = hideNoCall ? `응원콜 없는 곡 보기 (${n})` : `응원콜 없는 곡 숨기기 (${n})`;
      toggle.setAttribute("aria-pressed", hideNoCall ? "true" : "false");
      toggle.classList.toggle("on", !hideNoCall);
    }
    if (empty) empty.hidden = hit !== 0;
    if (clear) clear.classList.toggle("show", !!input.value);
  }

  function setupSongSearch(){
    const input = document.getElementById("song-search-input");
    const clear = document.getElementById("song-search-clear");
    if (!input) return;

    const apply = applyGuideFilter;

    // 검색창이 화면 맨 위에 붙었을 때만 뒤 배경을 흐리게 (붙기 전에는 그대로 둠)
    const bar = document.querySelector(".song-search");
    const sentinel = document.getElementById("song-search-sentinel");
    if (bar && sentinel && "IntersectionObserver" in window){
      new IntersectionObserver(([e])=>{
        bar.classList.toggle("stuck", !e.isIntersecting);
      }, { threshold: 0 }).observe(sentinel);
    }

    input.addEventListener("input", apply);
    clear.addEventListener("click", ()=>{ input.value = ""; apply(); input.focus(); });

    const toggle = document.getElementById("nocall-toggle");
    if (toggle) toggle.addEventListener("click", ()=>{
      hideNoCall = !hideNoCall;      // 이 화면에 있는 동안만 유지 (다시 들어오면 또 숨김)
      apply();
    });
    apply();
  }

  function startCountdown(){
    nextLiveGi = -2;                      // 홈을 새로 그렸으니 다음 공연 표시도 새로
    function tick(){
      const box = document.getElementById("countdown");
      if (!box) { stopCountdown(); return; }

      const now   = Date.now();
      const focus = focusLiveDay(now);
      paintNextLive(focus);
      updateTodayCard(now);               // 공연 당일이면 오늘의 일정 · 실시간 현황
      markShowRows(focus, now);

      if (!focus){                        // 발표된 공연이 모두 끝남
        setPill("END", "", "end");
        updateTodayCard(now);
        stopCountdown();
        return;
      }
      // 공연 중 (개연 시각을 아는 날)
      if (focus.startMs !== null && now >= focus.startMs){
        setPill("NOW", "ON AIR", "live");
        return;
      }
      // 공연 당일인데 시각이 발표되지 않은 날
      if (focus.startMs === null && now >= focus.dayFrom){
        setPill("D-DAY", "TODAY", "live");
        return;
      }
      const target = focus.startMs !== null ? focus.startMs : focus.dayFrom;
      // D-day 는 "며칠 남았나"를 한국 날짜 기준으로 센다.
      // 남은 시간을 24로 나누면, 공연이 내일이어도 20시간 남았을 때 D-00 이 되어
      // '오늘이 공연날'로 잘못 읽힌다. 날짜끼리 빼야 내일은 D-01 이 된다.
      const d = kstDayGap(now, target);
      if (focus.startMs === null){        // 시각 미정 — 날짜만 센다
        setPill(`D-${pad(d)}`, "TBA", "count");
        return;
      }
      const diff = target - now;
      // 날 수는 옆의 D-day 가 맡으므로 시계는 24시간 안쪽만 센다 (00:00:00 ~ 23:59:59)
      const h = Math.floor(diff/3600000) % 24;
      const m = Math.floor(diff%3600000/60000);
      const s = Math.floor(diff%60000/1000);
      setPill(`D-${pad(d)}`, `${pad(h)}:${pad(m)}:${pad(s)}`, "count");
    }

    tick();
    countdownTimer = setInterval(tick, 1000);
  }
  function stopCountdown(){ if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; } }

  /* ---------------- SONG DETAIL ---------------- */

  /* 손 흔들기 아이콘 (좌우로 흔들리는 애니메이션은 CSS의 handWave 가 담당) */
  /* 박수 아이콘용 — 손 한 짝 (두 개를 마주 보게 놓고 CSS로 마주치게 함) */

  /* 가사 안에 글자처럼 끼워 쓰는 아이콘.
     가사 텍스트 아무 위치에나 [wave] / [clap] / [mic] 이라고 적으면 됩니다. */
  /* 아이콘 본체는 페이지 맨 위 <svg class="icon-sprite"> 에 한 번만 있고,
     여기서는 <use> 로 가리키기만 한다. 가사 한 곡에 수백 개가 들어가므로
     이렇게 해야 DOM 이 가벼워진다. */
  const useSvg = (id) => `<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#${id}"/></svg>`;
  const INLINE_ICONS = {
    wave: `<span class="ico ico-wave" title="손 흔들기">${useSvg("i-wave")}</span>`,
    clap: `<span class="ico ico-clap" title="박수"><span class="hand l">${useSvg("i-hand")}</span><span class="hand r">${useSvg("i-hand")}</span><span class="spark">${useSvg("i-spark")}</span></span>`,
    mic:  `<span class="ico ico-mic" title="떼창">${useSvg("i-mic")}</span>`,
    jump: `<span class="ico ico-jump" title="점프">${useSvg("i-jump")}<span class="ground"></span></span>`,
    spin: `<span class="ico ico-spin" title="머리 위로 팔 돌리기">
             <svg class="body" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-cheer"/></svg>
             <svg class="arm" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-cheer-arm"/></svg>
           </span>`
  };
  INLINE_ICONS.turn = INLINE_ICONS.spin;   // [turn] 으로 써도 동일
  INLINE_ICONS.chant = INLINE_ICONS.mic;   // [chant] 로 써도 동일

  /* 가사 안의 [mic] 은 통통 튀지만, 버튼·띠에서는 가만히 있는 편이 낫다 */
  const STATIC_MIC_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mic"/></svg>';

  const CHEV_RIGHT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
  const CLOSE_SVG      = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

  /* 곡 목록 시트 안 검색 — 곡 목록 화면과 동일한 규칙 */
  function applySheetFilter(){

  /* 시트를 닫을 때 검색어를 비워 다음에 열면 전체가 보이게 한다 */

  /* ── 곡 화면 셸 ───────────────────────────────────────────────
     유튜브 플레이어(iframe)를 곡마다 새로 만들면 모바일에서 "사용자가 직접 누른
     재생"으로 인정받지 못해 소리가 막힌다. 그래서 곡 화면(과 그 안의 iframe)은
     페이지에 딱 한 번만 만들어 두고, 곡이 바뀌면 내용만 갈아끼운다. */
  let songShellBuilt = false;

  /* 곡 선택 목록에 보여 줄 곡들.
     셋리스트에서 들어왔으면 전체 곡이 아니라 셋리스트에 있는 곡만,
     셋리스트 화면에서 보던 그 순서 그대로 보여 준다.
     (랜덤 모드면 섞여 있던 그 순서) */
  function sheetSongs(){
    if (songFrom === "concerts"){
      const list = concertNavList();
      if (list.length) return list;
    }
    if (songFrom === "setlist"){
      const list = setlistNavList();
      if (list.length){
        const out = list.map(x => SONGS.find(s => s.id === x.id)).filter(Boolean);
        if (out.length) return out;
      }
    }
    return sortedSongs();
  }

  /* 이전/다음 곡의 순서는 "어디서 들어왔는지"에 따라 달라진다.
     · 셋리스트에서 들어왔으면 → 셋리스트에서 보던 그 순서 그대로
       (공연 순서 모드면 공연 순서, 랜덤 모드면 섞여 있던 그 순서)
     · 곡 목록에서 들어왔으면  → 곡 목록에서 고른 정렬 순서 */
  function songNeighbors(song){
    if (songFrom === "concerts"){
      const list = concertNavList();
      const pos = list.findIndex(x => x.id === song.id);
      if (pos >= 0){
        return { idx: pos, prev: list[(pos - 1 + list.length) % list.length],
                 next: list[(pos + 1) % list.length] };
      }
    }
    if (songFrom === "setlist"){
      const list = setlistNavList();
      if (list.length){
        let pos = setlistPos;
        // 기억해 둔 자리가 어긋났으면(모드를 바꿨다거나) 곡으로 다시 찾는다
        if (!(pos >= 0 && pos < list.length && list[pos].id === song.id))
          pos = list.findIndex(x => x.id === song.id);
        if (pos >= 0){
          const pi = (pos - 1 + list.length) % list.length;
          const ni = (pos + 1) % list.length;
          const at = (i)=> SONGS.find(s => s.id === list[i].id) || song;
          return { idx: pos, prev: at(pi), next: at(ni), pos, prevPos: pi, nextPos: ni };
        }
      }
    }
    const list = sortedSongs();
    const idx = list.findIndex(s => s.id === song.id);
    if (idx < 0) return { idx: -1, prev: song, next: song };
    return {
      idx,
      prev: list[(idx - 1 + list.length) % list.length],
      next: list[(idx + 1) % list.length]
    };
  }

  /* 이전(-1) · 다음(+1) 곡으로 넘어간다.
     셋리스트에서 들어온 경우에는 "지금 몇 번째인지"도 같이 옮겨 준다. */
  function goNeighbor(dir){
    if (!currentSong) return;
    const n = songNeighbors(currentSong);
    const target = dir < 0 ? n.prev : n.next;
    const nextPos = dir < 0 ? n.prevPos : n.nextPos;
    if (nextPos !== undefined) setSetlistPos(nextPos);
    gotoSong(target);
  }
